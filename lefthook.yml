# push 전 검사 (lefthook) — PR에서 앱 검사가 자동으로 돌지 않아서(#134) push 때 로컬에서 같은 검사를 돌림 (#198)
#   mobile/ 안 파일이 들어간 push만 검사함. 문서 · 워크플로만 바꾼 push는 건너뜀
#   (새 브랜치의 첫 push는 비교할 원격 브랜치가 없어 다 돌 수 있음)
#   타입 · 린트 · 단위 테스트(jest 전체)를 동시에 돌리고, 하나라도 실패하면 push가 막힘
#   설치: mobile/에서 npm ci(또는 npm install)를 하면 git 훅이 자동으로 깔림
#   main으로 가는 push는 파일과 상관없이 막힘 — 무료 private 조직이라 GitHub 보호 규칙을 못 써서 대신 (#494)
#     commands가 아니라 scripts(.lefthook/pre-push/)로 둠: commands는 push 파일이 비면 건너뛰어
#     `git push origin HEAD:main` 같은 push가 빠져나감
#   알람 계산(서버 TS) · 골든 도구가 들어간 push는 골든 대조도 함 (tools/golden/README.md): 계산 결과가 커밋된 골든과 다르면 막힘
#     같은 자리에서 Node(24 이상)가 .ts를 바로 돌림 — mobile/에서 npm ci를 안 해도 됨
#   급할 때 건너뛰기: git push --no-verify (mobile/README.md "push 전 검사")
pre-push:
  parallel: true
  scripts:
    'block-main-push.mjs':
      runner: node
      use_stdin: true
  commands:
    typecheck:
      root: mobile/
      glob: '*'
      run: npm run typecheck
    lint:
      root: mobile/
      glob: '*'
      run: npm run lint
    test:
      root: mobile/
      glob: '*'
      run: npm test -- --ci
    golden:
      glob: '{supabase/functions/_shared/**,tools/golden/**}'
      run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON tools/golden/golden.ts check
