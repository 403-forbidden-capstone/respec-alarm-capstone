plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.alarmcore'
version = '0.1.0'

android {
  namespace "expo.modules.alarmcore"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

dependencies {
  implementation 'androidx.core:core-ktx:1.15.0'
  // 음성 단계 판단(SpeechUrgency)이 TS와 같은지 보는 JVM 단위 시험 — 안드로이드 빌드 검사가 돌림
  testImplementation 'junit:junit:4.13.2'
}
