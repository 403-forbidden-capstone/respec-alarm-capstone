<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light">
<link rel="icon" href="data:,">
<title>Re:Spec AI 실험실</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* 앱 기본 디자인 그대로 — mobile/src/theme/tokens.ts · typography.ts · 클릭 목업(mockup.html)의 :root 값과 클래스 모양을 따름. 밝은 화면만. */
:root{
  --bg:#f6f6f4;--card:#ffffff;--line:#e6e6e2;--ink:#151515;--sub:#6b6b67;--faint:#a5a5a0;--chip:#efefec;--dash:#cfcfca;
  --ok:#55b477;--mid:#7b99e8;--zz:#d3a630;--warn:#c8553d;
  --font:Pretendard,"Pretendard Variable","IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;word-break:keep-all;overflow-wrap:anywhere;-webkit-font-smoothing:antialiased}
a{color:var(--ink);text-decoration:underline;text-decoration-color:var(--dash);text-underline-offset:2px}
a:hover{text-decoration-color:var(--ink)}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
p{margin:0 0 8px}
code,pre{font-family:ui-monospace,Consolas,"D2Coding",monospace;font-size:12px}
code{background:var(--chip);border-radius:6px;padding:1px 5px}
pre{background:var(--chip);border-radius:14px;padding:12px 14px;margin:6px 0 0;overflow:auto;white-space:pre-wrap;word-break:break-word;line-height:1.55}
.num{font-variant-numeric:tabular-nums}
.sub{color:var(--sub)}.muted{color:var(--faint)}.small{font-size:12.5px;color:var(--sub)}
.warn-t{color:var(--warn)}
/* 위 줄 · 탭 막대 (TopBar · TabBar) */
.hdr{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line)}
.hdr-in{max-width:1100px;margin:0 auto;padding:0 20px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px;margin-top:2px;flex-wrap:wrap}
.brand{font-size:15px;font-weight:700;letter-spacing:-.01em;color:var(--ink);text-decoration:none}
.tabs{display:flex;max-width:760px;padding:0 0 4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a{flex:1 0 auto;min-width:3.6rem;display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 8px 6px;font-size:12.5px;color:var(--sub);text-decoration:none;white-space:nowrap}
.tabs .n{font-size:10px;min-width:26px;height:16px;line-height:16px;border-radius:8px;background:var(--chip);color:var(--faint);text-align:center;font-variant-numeric:tabular-nums}
.tabs a.on{color:var(--ink);font-weight:600}
.tabs a.on .n{background:var(--ink);color:#fff}
main{max-width:1100px;margin:0 auto;padding:0 20px 56px;min-width:0}
footer{max-width:1100px;margin:0 auto;padding:0 20px 32px;color:var(--faint);font-size:11.5px;line-height:1.55}
/* 글자 */
.sid{font-size:11.5px;color:var(--faint);letter-spacing:.06em}
.crumbs{font-size:12.5px;color:var(--faint);margin:14px 0 0}
.crumbs a{color:var(--sub);text-decoration:none}
.crumbs a:hover{text-decoration:underline}
h1.ttl{font-size:23px;font-weight:700;letter-spacing:-.025em;margin:8px 0 4px;line-height:1.3}
.lead{margin:0 0 18px;color:var(--sub);font-size:13.5px}
.h2{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:2px 10px;margin:22px 0 10px;font-size:15.5px;font-weight:700}
.h2 small{font-weight:500;color:var(--sub);font-size:12.5px}
.big2{font-size:17px;font-weight:700;letter-spacing:-.01em;line-height:1.4}
h3{font-size:12px;font-weight:600;color:var(--sub);margin:14px 0 6px}
h3:first-child{margin-top:0}
.lbl{font-size:12px;color:var(--sub);margin:0 0 8px}
.note{font-size:12px;color:var(--sub);margin:6px 2px 0;line-height:1.55}
.empty{color:var(--sub);font-size:13px;margin:6px 0;line-height:1.55}
/* 카드 (Card) */
.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px 18px;margin:0 0 12px}
.card.dash{background:transparent;border-style:dashed;border-color:var(--dash)}
.card.flush{padding-top:4px;padding-bottom:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(320px,100%),1fr));gap:12px;margin-bottom:12px}
.grid>.card{margin:0}
.grid.stats{grid-template-columns:repeat(auto-fill,minmax(min(200px,100%),1fr))}
.sec>.card:last-child{margin-bottom:12px}
/* 칩 (Chip) · 세그먼트 (Segmented) · 버튼 */
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:13px;border:1px solid var(--line);background:#fff;font-size:12px;color:var(--ink);white-space:nowrap;text-decoration:none;vertical-align:middle}
.chip.fill{background:var(--chip);border-color:transparent}
.chip.ink{background:var(--ink);color:#fff;border-color:var(--ink)}
a.chip:hover{background:var(--chip)}
a.chip.ink:hover{background:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sd{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--line);flex:none;font-style:normal}
.sd.ok{background:var(--ok)}.sd.mid{background:var(--mid)}.sd.zz{background:var(--zz)}.sd.warn{background:var(--warn)}.sd.off{background:none;box-shadow:inset 0 0 0 1.5px var(--faint)}
.seg{display:flex;background:var(--chip);border-radius:14px;padding:4px;overflow-x:auto;scrollbar-width:none;gap:2px}
.seg::-webkit-scrollbar{display:none}
.seg>button,.seg>a{flex:1 0 auto;min-height:34px;padding:0 14px;border:0;background:none;border-radius:11px;font-size:13.5px;color:var(--sub);cursor:pointer;text-decoration:none;display:flex;align-items:center;justify-content:center;white-space:nowrap}
.seg>.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.btn{display:inline-flex;align-items:center;justify-content:center;height:38px;padding:0 16px;border:0;border-radius:12px;background:var(--ink);color:#fff;font-weight:600;font-size:13.5px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.sm{height:32px;padding:0 12px;font-size:13px}
.btn:hover{opacity:.88}
.more{display:flex;margin:10px auto 0}
.go{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:auto;padding-top:12px}
/* 필터 막대 */
.filters{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(128px,100%),1fr));gap:12px 12px;align-items:end;padding:14px 18px}
.filters .fld{display:flex;flex-direction:column;min-width:0}
.filters .fld.wide{grid-column:1/-1}
.filters .lbl{margin:0 0 6px}
select.sel{height:36px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:0 10px;font-size:13px;width:100%;min-width:0;color:var(--ink)}
select.sel:focus{border-color:var(--ink)}
.count{margin:14px 2px 8px;color:var(--sub);font-size:12.5px}
/* 한 줄 목록 · KeyValueRow */
.lrow{display:flex;gap:12px;align-items:center;padding:11px 0}
.lrow+.lrow{border-top:1px solid var(--line)}
.lrow.top{align-items:flex-start}
.lrow .grow{flex:1;min-width:0}
.kv{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0}
.kv+.kv{border-top:1px solid var(--line)}
.kv .k{color:var(--sub);font-size:13.5px}
.kv .v{font-weight:600;text-align:right;display:flex;flex-direction:column;align-items:flex-end;min-width:0}
.kv .v small{font-weight:400;font-size:11.5px;color:var(--faint)}
.kvl{display:grid;grid-template-columns:7rem minmax(0,1fr);gap:4px 14px;padding:11px 0;align-items:start}
.kvl+.kvl{border-top:1px solid var(--line)}
.kvl .k{color:var(--sub);font-size:13.5px}
.kvl .v{min-width:0;line-height:1.55}
@media (max-width:560px){.kvl{grid-template-columns:1fr}}
.stat .big{font-size:30px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.2}
.stat .big small{font-size:14px;font-weight:400;color:var(--sub);letter-spacing:0}
.stat .small{margin:4px 0 0;line-height:1.5}
.prog{display:block;height:6px;border-radius:3px;background:var(--chip);margin-top:10px;overflow:hidden}
.prog b{display:block;height:100%;background:var(--ink)}
/* 표 */
.scroll{overflow-x:auto;margin:0 -4px;padding:0 4px}
table{border-collapse:collapse;width:100%;font-size:13px;line-height:1.45}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--sub);font-weight:500;font-size:12px;white-space:nowrap}
td.r,th.r{text-align:right}
tr:last-child td{border-bottom:0}
td .note{display:block;margin:2px 0 0}
td a{color:var(--ink);font-weight:600}
/* 사람 */
.avatar{width:40px;height:40px;border-radius:50%;background:var(--chip);display:grid;place-items:center;font-size:13px;font-weight:600;flex:none}
.person{display:flex;align-items:center;gap:12px;padding:12px 0;color:var(--ink);text-decoration:none}
.person+.person{border-top:1px solid var(--line)}
.person .pm{flex:1;min-width:0}
.person .pm b{display:block;font-size:14.5px}
.person .pm small{display:block;font-size:12.5px;color:var(--sub)}
.person .pr{font-size:12.5px;color:var(--sub);text-align:right;flex:none;max-width:100%;white-space:normal}
@media (max-width:640px){.person{flex-wrap:wrap}.person .pm{flex-basis:calc(100% - 52px)}.person .pr{text-align:left;margin-left:52px;flex-basis:100%}}
/* 대화 · 프롬프트 목록 줄 */
.crow{display:grid;grid-template-columns:8.5rem 10rem minmax(0,1fr) 11rem minmax(0,1.1fr);gap:4px 14px;padding:11px 0;color:var(--ink);text-decoration:none;align-items:start}
.crow+.crow{border-top:1px solid var(--line)}
.crow:hover{background:var(--bg);box-shadow:-18px 0 0 var(--bg),18px 0 0 var(--bg)}
.crow small{display:block;color:var(--faint);font-size:11.5px}
.crow b{font-weight:600}
@media (max-width:860px){.crow{grid-template-columns:1fr 1fr}.crow>:nth-child(5){grid-column:1/-1}}
.prow{display:grid;grid-template-columns:minmax(10rem,13rem) 6.5rem minmax(0,1fr) 7rem;gap:4px 14px;padding:11px 0;align-items:start}
.prow+.prow{border-top:1px solid var(--line)}
.prow.v{color:var(--sub)}
.prow .id a{font-weight:600;color:var(--ink)}
@media (max-width:760px){.prow{grid-template-columns:1fr 1fr}.prow>:nth-child(3){grid-column:1/-1}}
.fam{margin-bottom:6px}
/* 용어 목록 — 좁은 화면에서는 글자 위 · 설명 아래 */
.terms .kvl{grid-template-columns:12rem minmax(0,1fr)}
@media (max-width:560px){.terms .kvl{grid-template-columns:1fr}}
.terms .kvl b{font-size:15.5px;line-height:1.5}
.terms .kvl span{font-size:15px;line-height:1.7;color:#3a3a37}
/* 첫 화면 큰 글씨 — 처음이라면 · 이 실험은 · 지금 어디까지 왔나 */
.lede .kvl{padding:12px 0}
.lede .kvl .k{font-size:14px;font-weight:600;color:var(--ink)}
.lede .kvl .v{font-size:15.5px;line-height:1.65}
.steps .lrow{padding:16px 0;gap:14px}
.steps .nm{font-size:19px;font-weight:700;letter-spacing:-.015em;line-height:1.35}
.steps .nm small{font-size:13px;font-weight:500;color:var(--faint);margin-left:6px;letter-spacing:0}
.steps .role{font-size:13.5px;color:var(--sub);margin:2px 0 0;line-height:1.5}
.steps .cl{font-size:16px;line-height:1.55;margin:6px 0 0}
.steps .lrow>.chip{flex:none}
.steps.past .nm{font-size:16.5px}
.steps.past .cl{font-size:15px;color:#3a3a37}
/* 타임라인 (Timeline) — 대화 턴 */
.tl2{list-style:none;margin:0;padding:0}
.tl2>li{display:grid;grid-template-columns:56px 14px minmax(0,1fr);gap:8px;position:relative;padding-bottom:12px}
.tl2>li::before{content:"";position:absolute;left:70px;top:16px;bottom:-4px;width:1px;background:var(--line)}
.tl2>li:last-child::before{display:none}
.tl2 .rail{display:contents}
.tl2 .t{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums;padding-top:11px}
.tl2 .d{width:7px;height:7px;border-radius:50%;background:var(--line);margin:15px 0 0 3.5px;position:relative;z-index:1;font-style:normal}
.tl2 li.ai .d{background:var(--ink)}
.tl2 li .d.bad{background:var(--warn)}
.tcard{background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px 14px;min-width:0}
.tl2 li.user .tcard{background:var(--chip);border-color:transparent}
.thd{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:6px;font-size:12px;color:var(--sub)}
.thd .tt{display:none;font-weight:700;color:var(--ink);font-size:13px;margin-right:2px}
.say{font-size:14.5px;line-height:1.65;margin:0 0 4px;white-space:pre-wrap}
.drow{display:grid;grid-template-columns:4.6rem minmax(0,1fr);gap:2px 10px;padding:8px 0 2px;margin-top:8px;border-top:1px solid var(--line)}
.tl2 li.user .drow{border-top-color:rgba(0,0,0,.07)}
.drow>.k{font-size:12px;color:var(--sub);padding-top:1px}
.drow ul{margin:0;padding-left:16px}.drow li{margin:1px 0}
@media (max-width:560px){.drow{grid-template-columns:1fr}.tl2>li{grid-template-columns:44px 14px minmax(0,1fr);gap:6px}.tl2>li::before{left:56px}}
.probs{margin:6px 0 0;padding:8px 12px;background:rgba(200,85,61,.09);border-radius:12px;color:var(--warn);font-size:13px;line-height:1.5}
.probs div+div{margin-top:2px}
.tl2.compact>li{grid-template-columns:14px minmax(0,1fr)}
.tl2.compact>li::before{left:3px}
.tl2.compact .t{display:none}
.tl2.compact .thd .tt{display:inline}
.tl2.compact .d{margin-left:0}
.tl2.compact .say{font-size:14px}
.tl2.compact .drow{grid-template-columns:1fr}
details{margin:6px 0 0}
summary{cursor:pointer;color:var(--sub);font-size:13px}
summary:hover{color:var(--ink)}
.compare{display:grid;grid-template-columns:repeat(var(--n,2),minmax(0,1fr));gap:14px;align-items:start}
@media (max-width:900px){.compare{grid-template-columns:1fr}}
/* 차이 */
.diff{font-family:ui-monospace,Consolas,"D2Coding",monospace;font-size:12px;border:1px solid var(--line);border-radius:14px;overflow:auto;background:#fff}
.diff div{display:grid;grid-template-columns:3rem 3rem 1.2rem 1fr;white-space:pre-wrap;word-break:break-word;padding:0 6px}
.diff .n{color:var(--faint);text-align:right;padding-right:6px;user-select:none}
.diff .add{background:rgba(85,180,119,.16)}
.diff .del{background:rgba(200,85,61,.13)}
.diff .gap{color:var(--faint);background:var(--chip)}
/* 진행 흐름 (.flow) */
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px}
.flow span{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:12px;border:1px solid var(--line);color:var(--faint);background:#fff}
.flow span.done{color:var(--ink)}
.flow span.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.flow i.ar{font-style:normal;color:var(--faint)}
.xcard{display:flex;flex-direction:column;gap:6px}
.xcard ul{margin:2px 0 0;padding-left:18px;color:var(--sub);font-size:13px}
.xcard .big2 a{text-decoration:none}
.xcard .big2 a:hover{text-decoration:underline}
.bar-line{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bar-line .prog{width:160px;margin:0}
.chip.xs{height:18px;font-size:11px;padding:0 7px;gap:4px;vertical-align:1px}
/* v3 받아쓰기 — 인식이 바꾼 곳 · 정리 판별 */
mark.nz{background:rgba(200,85,61,.16);color:inherit;border-radius:5px;padding:0 2px}
mark.nz.forced{background:rgba(200,85,61,.32);font-weight:600}
.nzl{margin:6px 0 0;padding-left:16px;line-height:1.55}
.tcard>.thd+.drow{border-top:0;margin-top:0;padding-top:0}
.tcard.hit{box-shadow:0 0 0 2px var(--ink)}
.t0v{padding:8px 0;border-top:1px solid rgba(0,0,0,.07)}
.t0v:first-of-type{border-top:0}
.t0v>b{display:block;font-size:12.5px;margin-bottom:2px}
.t0v .small{margin-top:3px}
.exrow{color:var(--ink);text-decoration:none;align-items:flex-start}
.exrow:hover{background:var(--bg);box-shadow:-18px 0 0 var(--bg),18px 0 0 var(--bg)}
.mdref{border-bottom:1px dotted var(--faint);color:var(--sub)}
/* 마크다운 글 (실험 정리 · 카드) */
.md{font-size:14px;line-height:1.7;min-width:0}
.md>*:first-child{margin-top:0}
.md p{margin:0 0 10px}
.md h1.mdh1{font-size:19px;margin:0 0 6px;letter-spacing:-.02em}
.md .mdh2{font-size:17px;font-weight:700;margin:30px 0 10px;padding-top:16px;border-top:1px solid var(--line);color:var(--ink);letter-spacing:-.01em}
.md .mdh3{font-size:14.5px;font-weight:700;color:var(--ink);margin:20px 0 6px}
.md .mdh4{font-size:13px;font-weight:700;color:var(--sub);margin:16px 0 4px}
.md ul,.md ol{margin:0 0 10px;padding-left:20px}
.md li{margin:2px 0}
.md li>ul,.md li>ol{margin:2px 0 4px}
.md blockquote{margin:0 0 12px;padding:10px 14px;background:var(--chip);border-radius:14px;color:var(--sub);font-size:13px;line-height:1.6}
.md hr{border:0;border-top:1px solid var(--line);margin:22px 0}
.md pre.mdcode{white-space:pre;overflow-x:auto;word-break:normal;margin:0 0 12px;font-size:12px;line-height:1.6}
.md table{margin:0 0 4px}
.md .scroll{margin:0 -4px 12px}
.mdcard{padding:20px 22px}
@media (max-width:560px){.mdcard{padding:14px 16px}}
.err{padding:16px 18px}
.mono-id{font-variant-numeric:tabular-nums}
/* v3 사람 카드 — 진짜 모습 | 앱이 보는 기록 */
.vhd,.vrow{display:grid;grid-template-columns:6.2rem minmax(0,1fr) minmax(0,1fr);gap:4px 18px}
.vhd{padding:2px 0 8px;font-size:12px;color:var(--sub);border-bottom:1px solid var(--line)}
.vrow{padding:12px 0;align-items:start;line-height:1.55}
.vrow+.vrow{border-top:1px solid var(--line)}
.vrow .k{font-weight:600;font-size:13.5px}
.vrow .a{color:var(--sub)}
@media (max-width:760px){.vhd{display:none}.vrow{grid-template-columns:1fr}.vrow>div[data-l]::before{content:attr(data-l);display:block;font-size:11.5px;color:var(--faint);margin-bottom:1px}}
/* v3 14일 기록 — 하루 한 줄 */
.dhd,.day{display:grid;grid-template-columns:4.4rem 5rem 7.6rem 8.4rem 8.2rem 6.6rem 5.8rem minmax(10.5rem,1fr);gap:4px 12px}
.dhd{padding:2px 0 8px;font-size:12px;color:var(--sub);border-bottom:1px solid var(--line)}
.day{padding:12px 0;align-items:start;font-size:13.5px}
.day+.day{border-top:1px solid var(--line)}
.day .dc{min-width:0}
.day .dt b{font-size:14.5px}
.pair .ln{display:flex;flex-wrap:wrap;gap:0 6px;align-items:baseline;font-variant-numeric:tabular-nums}
.pair .l{font-size:11.5px;color:var(--faint);width:2.6rem;flex:none}
.pair b.dv{font-weight:600}
.pair .gap{font-size:11.5px;color:var(--warn)}
.og{font-size:11.5px;color:var(--faint);margin:6px 0 2px;white-space:normal}
.og:first-child{margin-top:0}
.day .notes{margin:0;padding:0;list-style:none;font-size:12.5px;color:var(--sub);line-height:1.5}
.day .notes li{display:flex;gap:6px;align-items:baseline;margin:0 0 3px}

<script>
"use strict";
/* ───────── 바탕 ───────── */
// 데이터는 이 페이지 옆 data/ 폴더. /lab 으로 열려도 /lab/ 처럼 읽는다.
const BASE = (() => {
  let p = location.pathname;
  if (/\.html?$/.test(p)) p = p.replace(/[^/]*$/, "");
  else if (!p.endsWith("/")) p += "/";
  return p + "data/";
})();
const app = document.getElementById("app");

function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  if (props) for (const [k, v] of Object.entries(props)) {
    if (v === undefined || v === null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "text") el.textContent = v;
    else if (k.startsWith("on") && typeof v === "function") el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  put(el, kids);
  return el;
}
function put(el, kids) {
  for (const k of kids.flat(Infinity)) {
    if (k === null || k === undefined || k === false) continue;
    el.append(k.nodeType ? k : document.createTextNode(String(k)));
  }
  return el;
}

const cache = new Map();
function load(name) {
  if (!cache.has(name)) {
    cache.set(name, fetch(BASE + name, { cache: "no-cache" }).then(async (r) => {
      if (!r.ok) throw new Error(`자료 ${name} 응답 ${r.status}`);
      const t = await r.text();
      try { return JSON.parse(t); } catch { throw new Error(`자료 ${name}의 형식이 맞지 않아요 (없는 자료면 서버가 엉뚱한 글을 돌려줘요)`); }
    }).catch((e) => { cache.delete(name); if (e && typeof e === "object") e.tech = true; throw e; }));
  }
  return cache.get(name);
}

// 대화는 실행 폴더마다 파일 하나(conv/<실행>.json) — 그 실행의 대화를 처음 열 때 받고 이후엔 캐시
async function loadConv(run, id) {
  const pack = await load(`conv/${run}.json`);
  const c = pack.convs && pack.convs[id];
  if (!c) throw new Error(`${run} 판의 자료에 ${id} 대화가 없어요`);
  return c;
}

/* ───────── 주소 ───────── */
function parseHash() {
  const raw = location.hash.replace(/^#\/?/, "");
  const i = raw.indexOf("?");
  const p = i < 0 ? raw : raw.slice(0, i);
  const q = new URLSearchParams(i < 0 ? "" : raw.slice(i + 1));
  return { parts: p.split("/").filter(Boolean).map((x) => { try { return decodeURIComponent(x); } catch { return x; } }), q };
}
function href(parts, query) {
  const qs = query ? new URLSearchParams(Object.entries(query).filter(([, v]) => v !== "" && v != null)).toString() : "";
  return "#/" + parts.map(encodeURIComponent).join("/") + (qs ? "?" + qs : "");
}
const hConv = (run, id, u) => href(["conv", run, id], u ? { u: String(u) } : undefined);
const hPrompt = (key) => href(["prompts", key]);
const hExp = (id) => href(["exp", id]);
const expLabel = (e) => e.code || `실험 ${e.num}`;

/* ───────── 작은 도우미 ───────── */
const pct = (a, b) => (b ? `${a}/${b} (${Math.round((a / b) * 100)}%)` : `${a}/${b}`);
const f2 = (x) => (x === null || x === undefined ? "—" : x.toFixed(2));
const usd = (x) => (x === null || x === undefined ? "—" : "$" + (x >= 1 ? x.toFixed(2) : x.toFixed(4)));
function kst(iso) {
  try {
    const p = Object.fromEntries(new Intl.DateTimeFormat("ko-KR", { timeZone: "Asia/Seoul", month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit", hour12: false, hourCycle: "h23" }).formatToParts(new Date(iso)).map((x) => [x.type, x.value]));
    return `${p.month}/${p.day} ${p.hour}:${p.minute}`;
  } catch { return iso; }
}

// 칩 — variant: "" 테두리 · "fill" 회색 바탕 · "ink" 검은 바탕. extra: { href, dot, title } (dot = 상태 점 ok · mid · zz · warn · off)
function chip(text, variant, extra) {
  const e = extra || {};
  return h(e.href ? "a" : "span", { class: "chip" + (variant ? " " + variant : ""), href: e.href, title: e.title },
    e.dot ? h("i", { class: "sd " + e.dot }) : null, text);
}
// 상태 점 의미: ok = 좋음 · 끝남 · mid = 진행 · 후보 · zz = 참고 · 멈춤 · warn = 문제
const PROBLEM_DOT = { rule: "warn", err_missed: "warn", t2_bad: "warn", fail: "warn", acts: "zz", early_end: "zz", no_reflect: "zz", sq_missed: "zz" };
const probChip = (code, label) => chip(label, "", { dot: PROBLEM_DOT[code] || "zz" });
const okChip = () => chip("문제 없음", "", { dot: "ok" });
const STATUS_CHIP = { "지금 쓰는 판": ["ink", null], "채택": ["", "ok"], "기준판": ["fill", null], "후보": ["", "mid"], "실험 변형": ["fill", null], "점검용": ["", "warn"], "실험 도구": ["fill", null] };
const statusChip = (ko) => { const [v, dot] = STATUS_CHIP[ko] || ["fill", null]; return chip(ko, v, { dot }); };
const crumbs = (...items) => h("div", { class: "crumbs" }, items.map((x, i) => [i ? " › " : "", typeof x === "string" ? x : h("a", { href: x.href }, x.t)]));
const title = (t, ...more) => h("h1", { class: "ttl" }, t, ...more);
// 섹션 — 제목(.h2)은 카드 밖, 내용은 흰 카드 안
const section = (heading, ...kids) => h("div", { class: "sec" }, heading ? h("div", { class: "h2" }, heading) : null, h("div", { class: "card" }, kids));
const empty = (t) => h("p", { class: "empty" }, t);
const kv = (k, v, sub) => h("div", { class: "kv" }, h("span", { class: "k" }, k), h("span", { class: "v" }, v, sub ? h("small", null, sub) : null));
const kvl = (k, ...v) => h("div", { class: "kvl" }, h("span", { class: "k" }, k), h("div", { class: "v" }, v));
const stat = (lbl, big, sub, prog) => h("div", { class: "card stat" }, h("div", { class: "lbl" }, lbl), h("div", { class: "big" }, big),
  prog ? h("span", { class: "prog" }, h("b", { style: `width:${prog}%` })) : null, sub ? h("p", { class: "small" }, sub) : null);
const btn = (text, hrefv, ghost, sm) => h("a", { class: "btn" + (ghost ? " ghost" : "") + (sm ? " sm" : ""), href: hrefv }, text);
// 코드 이름표는 작게 뒤로 — "NONE 받아쓰기 그대로" → ["받아쓰기 그대로", "NONE"]. 뒤에 한국어가 있고 앞 낱말이 이름표처럼 생겼을 때만 나눔
function splitCode(label) {
  const s = String(label);
  const m = /^([A-Za-z0-9][A-Za-z0-9._~+-]*)\s+(?=.*[가-힣])/.exec(s);
  if (!m || m[1] === "AI") return [s, null];
  return [s.slice(m[0].length), m[1]];
}
// 이름이 이미 괄호를 품고 있으면 [ ]로, 아니면 ( )로 감쌈
const codeTail = (code, ko) => (code ? h("span", { class: "muted small", style: "font-weight:400" }, String(ko).includes("(") ? ` [${code}]` : ` (${code})`) : null);
// 화면에 그대로 내보내기 어려운 기술 낱말을 풀어 씀
// (JSON 낱말 · 함수 이름 · 설정 이름 · 데이터 이름표 → 한국어)
const plainKo = (s) => String(s)
  .replace(/JSON/g, "정해진 형식")
  .replace(/propose_changes/g, "'변경 제안'")
  .replace(/prep · daily_record/g, "준비 시간 · 하루 기록")
  .replace(/daily_record/g, "하루 기록")
  .replace(/\s*\(freeze-v0\)/g, "")
  .replace(/\s*\(gold v1\)/g, "")
  .replace(/\(intended\)/g, "")
  .replace(/effort low로/g, "생각 깊이를 '낮음'으로")
  .replace(/medium 유지/g, "'보통' 유지")
  .replace(/잡음 mid/g, "잡음 '중간'")
  .replace(/잡음을 high로/g, "잡음을 '높음'으로")
  .replace(/\(mid · high\)/g, "(중간 · 높음)")
  .replace(/ESTIMATE_SHORT는 '원래 그만큼 걸림'일 때만/g, "'원래 그만큼 걸림' 태그는 그럴 때만")
  .replace(/= ETC\)/g, "= 기타)")
  .replace(/발표\(PRESENTATION\)/g, "발표");
// 글 속의 코드 이름(T4.v1 · SIM.v2 …)을 '한국어 이름 + 뒤에 작은 이름표'로 바꿔 보여 줌 (노드 목록)
const CODE_KO = { T0: "받아쓰기 정리", T1: "대화 답", T2: "추출", T3: "사유 분류", T4: "일기", T5: "코칭", SIM: "가상 유저" };
function koCodes(s) {
  const out = [];
  const re = /\b(T[0-5]|SIM)(\.v\d+(?:\.\d+)*(?:-[A-Za-z0-9]+)?)?/g;
  let pos = 0, m;
  while ((m = re.exec(s)) !== null) {
    if (m.index > pos) out.push(s.slice(pos, m.index));
    out.push(CODE_KO[m[1]], h("span", { class: "muted small", style: "font-weight:400" }, " " + m[0]));
    pos = m.index + m[0].length;
  }
  if (pos < s.length) out.push(s.slice(pos));
  return out;
}
// 한 줄 결론 — '—' 앞이나 첫 문장만 (첫 문장이 너무 짧으면 둘째 문장까지). 전체 글은 실험 화면에 있음
function oneLine(s) {
  const t = plainKo(s).trim();
  const dash = t.indexOf(" — ");
  if (dash > 8) return t.slice(0, dash);
  let end = t.length, from = 0;
  for (;;) {
    const i = t.indexOf(". ", from);
    if (i < 0) break;
    if (i + 1 >= 24) { end = i + 1; break; }
    from = i + 2;
  }
  return t.slice(0, end);
}
// 표 아래 설명에서 "출처: spec/….md 5절" 같은 파일 이름 문장을 뺌 (뒤에 붙은 뜻 있는 괄호는 남김)
const plainNote = (s) => String(s).replace(/출처:\s*((?:[^.(]|\.(?=md\b|jsonl?\b))*)(\([^)]*\))?(?:\.\s+|\.?$)/g, (_, _src, par) => (par && !/절/.test(par) ? par + " " : "")).trim();

const STYLE_KO = { POLITE: "존댓말", CASUAL: "편한 말투", TYPO_SLANG: "오타 · 줄임말", STT: "받아쓰기 말투" };
const RES_OPTS = [["", "전부"], ["ok", "문제 없음"], ["bad", "문제 있음"], ["rule", "규칙 어김"], ["err_missed", "틀린 자동 기록을 못 고침"], ["t2_bad", "추출이 많이 틀림"], ["fail", "실행 오류"], ["acts", "물음 표시 어긋남"], ["early_end", "신호 없이 AI가 먼저 마무리"], ["no_reflect", "돌아보기 없이 마무리"], ["sq_missed", "서버 질문을 안 물음"]];

/* ───────── 화면 바꾸기 ───────── */
let token = 0;
function setNav(k) { document.querySelectorAll("#tabs a").forEach((a) => a.classList.toggle("on", a.dataset.k === k)); }
function mount(node, ttl) {
  app.replaceChildren(node);
  document.title = (ttl ? ttl + " · " : "") + "Re:Spec AI 실험실";
}
function errView(e) {
  const msg = String(e && e.message ? e.message : e);
  // 자료를 못 받은 경우(기술 오류)는 쉬운 말로 먼저 알리고, 원인은 접어 둠. 그 밖의 오류(없는 실험 · 사람 등)는 글을 그대로 보여 줌
  if (!(e && e.tech)) return h("div", { class: "card dash err", style: "margin-top:18px" }, h("div", { class: "big2" }, "불러오지 못했어요"), h("p", { style: "margin-top:6px" }, msg));
  return h("div", { class: "card dash err", style: "margin-top:18px" }, h("div", { class: "big2" }, "불러오지 못했어요"),
    h("p", { style: "margin-top:6px" }, "화면에 필요한 자료를 열지 못했어요. 새로고침해 보고, 계속 안 되면 개발 보드 담당에게 알려 주세요."),
    h("details", null, h("summary", null, "자세한 내용 (개발자용)"), h("p", { class: "small", style: "margin:6px 0 0" }, msg),
      h("p", { class: "small", style: "margin:4px 0 0" }, "자료 묶음을 만들지 않았거나 배포에서 빠졌을 때 이렇게 나와요. 자료를 만드는 쪽에서 묶음을 다시 만든 뒤 열어 주세요.")));
}
async function route() {
  const my = ++token;
  const { parts, q } = parseHash();
  const [a, b, c] = parts;
  setNav(a === "compare" ? "conv" : a === "diff" ? "prompts" : a || "home");
  if (!app.firstChild || app.dataset.key !== location.hash) app.replaceChildren(empty("불러오는 중…"));
  app.dataset.key = location.hash;
  try {
    let v;
    if (!a) v = await vHome();
    else if (a === "exp") v = b ? await vExp(b) : await vExpList(q);
    else if (a === "people") v = b ? await vPerson(b) : await vPeople(q);
    else if (a === "conv") v = b && c ? await vConv(b, c, q) : await vConvList(q);
    else if (a === "summary") v = await vSummary();
    else if (a === "cards") v = await vCards(b);
    else if (a === "compare") v = await vCompare(b, q);
    else if (a === "prompts") v = b ? await vPrompt(b) : await vPrompts(q);
    else if (a === "diff") v = await vDiff(q);
    else if (a === "terms") v = vTerms();
    else v = h("div", { class: "card dash", style: "margin-top:18px" }, h("p", null, "없는 화면이에요. "), h("a", { href: "#/" }, "홈으로"));
    if (my !== token) return;
    mount(v.node || v, v.title);
    window.scrollTo(0, 0);
    if (v.after) v.after();
  } catch (e) {
    if (my !== token) return;
    mount(errView(e), "오류");
  }
}
try { history.scrollRestoration = "manual"; } catch { /* 무시 */ }
window.addEventListener("hashchange", route);

/* ───────── 필터 막대 ───────── */
// defs: [{key,label,options:[[value,label]],seg?}] · state: {key:value}. 값은 주소에 남음(replaceState). seg: true면 세그먼트로.
function filterBar(defs, state, onChange, extra) {
  const form = h("div", { class: "card filters" });
  const resets = [];
  for (const d of defs) {
    if (d.seg) {
      const seg = h("div", { class: "seg", role: "tablist", "aria-label": d.label });
      const paint = () => seg.querySelectorAll("button").forEach((b) => { const on = b.dataset.v === (state[d.key] || ""); b.classList.toggle("on", on); b.setAttribute("aria-selected", on ? "true" : "false"); });
      d.options.forEach(([v, l]) => seg.append(h("button", { type: "button", role: "tab", "data-v": v, onclick: () => { state[d.key] = v; paint(); onChange(); } }, l)));

      sel.addEventListener("change", () => { state[d.key] = sel.value; onChange(); });
      resets.push(() => { state[d.key] = ""; sel.value = ""; });
      form.append(h("label", { class: "fld" }, h("span", { class: "lbl" }, d.label), sel));
    }
  }

  if (extra) form.append(extra);

}
function syncHash(parts, state) {
  const nh = href(parts, state);

}

/* ───────── 홈 ───────── */
// 첫 화면 제목은 크게
const bigH2 = (t, ...more) => h("div", { class: "h2", style: "font-size:21px;letter-spacing:-.02em;margin-top:26px" }, t, ...more);

// 처음 보는 사람을 위한 안내 카드 — 네 줄 + 돌아가기. 이 실험실이 무엇이고 어떤 순서로 읽으면 되는지
function firstTimeCard() {
  const lk = (t, to) => h("a", { href: to }, t);
  return h("div", { class: "sec" },
    bigH2("처음이라면", h("small", null, "이 화면은 이런 곳이에요")),

      kvl("무엇을 하는 곳", "앱에서 AI가 말하는 자리(자기 전 · 기상 후 대화 답, 대화에서 저장할 것 뽑기, 일기 · 코칭, 아침 준비 시간 추천)마다 'AI에게 주는 지시문'을 미리 시험해서 가장 좋은 판을 고르는 곳이에요."),
      kvl("어떻게 시험하나", "가상 유저 12명(개발용 8 · 시험용 4)이 상대예요. 습관이 다른 사람을 AI가 연기하고, 음성 받아쓰기가 글자를 틀리게 적는 잡음까지 흉내 내요. 지시문을 판마다 바꿔 같은 대화를 시켜 보고 점수를 비교해요."),

    const state = s.status === "done" ? "done" : s.status === "doing" ? "doing" : i === firstTodo ? "next" : "todo";

// 이 실험이 잰 것 — 첫 결과 표에서 읽음. 표의 줄이 잰 항목이면 그 이름들, 줄이 판 이름 · 가설이면 표 제목을 씀. 없으면 null
function measuredOf(e) {
  const t = (e.tables || [])[0];
  if (!t || !t.rows.length) return null;
  const keys = e.arms.flatMap((a) => [a.id, a.label]).filter(Boolean);
  const isArm = (l) => /^h\d/.test(l) || keys.some((k) => l === k || l.startsWith(k + " "));
  const names = t.rows.filter((r) => !/^\s/.test(String(r.label))).map((r) => String(r.label).trim().replace(/\s*\([^)]*\)\s*$/, "")).filter(Boolean);
  const items = [...new Set(names.filter((l) => !isArm(l)))];
  if (items.length && items.length * 2 > names.length) {
    // 항목 이름을 길이 110자 안에서 (적어도 2개) 보여 주고 나머지는 개수로
    let n = 0, len = 0;
    while (n < Math.min(4, items.length) && (n < 2 || len + items[n].length <= 110)) { len += items[n].length + 3; n++; }
    return items.slice(0, n).join(" · ") + (items.length > n ? ` 외 ${items.length - n}가지` : "");
  }
  return t.title || null;
}

async function vConvList(q) {

  const pvs = [...new Set(rows.flatMap((r) => r.pv))].sort();
  const people = [...new Map(rows.map((r) => [r.p, r.who])).entries()].sort();
  const defs = [
    { key: "gen", label: "자료", seg: true, options: [["", "전부"], ["v3", "v3 · 말로 하는 대화"], ["r1", "예전 · 타이핑 대화"]] },

    { key: "exp", label: "실험", options: [["", "전부"], ...idx.experiments.filter((e) => e.convs).map((e) => [e.id, `${expLabel(e)}. ${e.title}`])] },
    { key: "run", label: "실행(판)", options: [["", "전부"], ...ci.runs.map((r) => [r.run, `${r.run} · ${r.label}`])] },
    { key: "pv", label: "프롬프트 버전", options: [["", "전부"], ...pvs.map((k) => [k, k])] },
    { key: "p", label: "사람", options: [["", "전부"], ...people.map(([id, n]) => [id, `${n} (${id})`])] },
    { key: "style", label: "말투", options: [["", "전부"], ...uniq((r) => r.style).map((s) => [s, STYLE_KO[s] || s])] },
    { key: "type", label: "상황", options: [["", "전부"], ...Object.entries(ci.types)] },
    { key: "res", label: "결과", options: RES_OPTS },
    { key: "sort", label: "정렬", options: [["", "기본 (실행 · 번호순)"], ["rule", "규칙 어긴 턴 많은 순"], ["f1", "추출 F1 낮은 순"], ["truth", "숨은 사실 전달 낮은 순"]] },
  ];
  const resOK = (r, s) => !s || (s === "ok" ? !r.bad : s === "bad" ? r.bad : r.pr.includes(s));
  const PAGE = 80;
  let shown = PAGE;
  const root = h("div");
  const box = h("div");
  const counter = h("p", { class: "count" });
  const draw = (reset) => {
    if (reset) shown = PAGE;
    syncHash(["conv"], state);
    const s = state;
    let list = rows.filter((r) => (!s.gen || r.gen === s.gen) && (!s.exp || r.exp === s.exp) && (!s.run || r.run === s.run) && (!s.pv || r.pv.includes(s.pv)) && (!s.p || r.p === s.p) && (!s.style || r.style === s.style) && (!s.type || r.type === s.type) && (!s.sess || r.sess === s.sess) && resOK(r, s.res));
    const ord = (a, b) => (runOrder.get(a.run) - runOrder.get(b.run)) || a.id.localeCompare(b.id);
    if (s.sort === "rule") list = [...list].sort((a, b) => b.nfl - a.nfl || ord(a, b));

      const off = li.getBoundingClientRect().top - 110;

      requestAnimationFrame(tick);

  return { node: root, title: `${id} ${conv.persona.name}`, after };
}

function lineage(list) {
  // 부모-자식 순서로 펼쳐 깊이를 붙인다 (같은 부모 아래는 날짜 → 이름순)
  const byParent = new Map();
  const keys = new Set(list.map((p) => p.ref));
  for (const p of list) { const k = p.parent && keys.has(p.parent) ? p.parent : ""; if (!byParent.has(k)) byParent.set(k, []); byParent.get(k).push(p); }
  const out = [];
  const walk = (parent, depth) => {
    (byParent.get(parent) || []).sort((a, b) => a.date.localeCompare(b.date) || a.ref.localeCompare(b.ref)).forEach((p) => { out.push({ p, depth }); walk(p.ref, depth + 1); });
  };
  walk("", 0);
  return out;
}

function diffUnified(aText, bText, ctx) {
  const A = aText.split("\n"), B = bText.split("\n");
  const n = A.length, m = B.length;
  const dp = Array.from({ length: n + 1 }, () => new Uint32Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) dp[i][j] = A[i] === B[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const seq = [];
  let i = 0, j = 0;
  while (i < n && j < m) {
    if (A[i] === B[j]) { seq.push({ op: "=", t: A[i], a: i + 1, b: j + 1 }); i++; j++; }
    else if (dp[i + 1][j] >= dp[i][j + 1]) { seq.push({ op: "-", t: A[i], a: i + 1 }); i++; }
    else { seq.push({ op: "+", t: B[j], b: j + 1 }); j++; }
  }
  while (i < n) { seq.push({ op: "-", t: A[i], a: i + 1 }); i++; }
  while (j < m) { seq.push({ op: "+", t: B[j], b: j + 1 }); j++; }
  const keep = new Array(seq.length).fill(false);
  seq.forEach((x, k) => { if (x.op !== "=") for (let d = -ctx; d <= ctx; d++) if (seq[k + d]) keep[k + d] = true; });
  const box = h("div", { class: "diff" });
  let gap = 0;
  const flush = () => { if (gap) { box.append(h("div", { class: "gap" }, h("span"), h("span"), h("span"), `… 같은 줄 ${gap}개`)); gap = 0; } };
  let added = 0, removed = 0;
  seq.forEach((x, k) => {
    if (x.op === "+") added++; if (x.op === "-") removed++;
    if (!keep[k]) { gap++; return; }
    flush();
    box.append(h("div", { class: x.op === "+" ? "add" : x.op === "-" ? "del" : "" }, h("span", { class: "n" }, x.a || ""), h("span", { class: "n" }, x.b || ""), h("span", null, x.op === "=" ? " " : x.op), h("span", null, x.t)));
  });
  flush();
  return { box, added, removed, same: added + removed === 0 };
}

async function vDiff(q) {
  const pr = await load("prompts.json");
  const a = pr.prompts.find((x) => x.ref === q.get("a"));
  const b = pr.prompts.find((x) => x.ref === q.get("b"));
  if (!a || !b) throw new Error("비교할 두 버전이 필요해요. 프롬프트 목록에서 버전을 골라 '비교'를 눌러 주세요.");
  const ci = await load("conv-index.json");
  const root = h("div");
  const d = diffUnified(a.text, b.text, 2);
  root.append(crumbs({ t: "프롬프트", href: "#/prompts" }, "비교"), title(`${a.ref} → ${b.ref}`),
    h("p", { class: "lead" }, d.same ? "두 버전의 내용이 같아요." : `새 줄 ${d.added}개 · 뺀 줄 ${d.removed}개 (버전 표시 한 줄 포함)`));
  root.append(section("바뀐 줄", d.box, h("p", { class: "note" }, "초록 = 새 줄, 빨강 = 뺀 줄")));
  // 이 변경으로 결과가 달라진 대화: A를 쓴 대화와 B를 쓴 대화에서 같은 상황끼리 문제 여부가 다른 것
  const rowsA = ci.rows.filter((r) => r.pv.includes(a.ref) && !r.pv.includes(b.ref));
  const rowsB = ci.rows.filter((r) => r.pv.includes(b.ref) && !r.pv.includes(a.ref));
  const byId = (rows) => { const m = new Map(); rows.forEach((r) => { if (!m.has(r.id)) m.set(r.id, r); }); return m; };
  const A = byId(rowsA), B = byId(rowsB);
  const worse = [], better = [];
  for (const [id, ra] of A) { const rb = B.get(id); if (!rb) continue; if (ra.bad && !rb.bad) better.push([ra, rb]); else if (!ra.bad && rb.bad) worse.push([ra, rb]); }
  const line = ([ra, rb]) => h("div", { class: "lrow" }, h("span", { style: "flex:none;width:9rem" }, h("b", null, ra.id), h("span", { class: "sub" }, ` ${ra.who}`)), h("span", { class: "small grow" }, ra.type_ko), btn("나란히 보기", href(["compare", ra.id], { runs: ra.run + "," + rb.run }), true, true));
  if (A.size && B.size) {
    root.append(section("이 변경으로 결과가 달라진 대화", h("p", { class: "small", style: "margin:0" }, `${a.ref}를 쓴 대화 ${A.size}개와 ${b.ref}를 쓴 대화 ${B.size}개 중 같은 상황끼리 비교 (문제 있음 여부 기준)`),
      h("h3", { style: "margin-top:14px" }, `좋아진 것 ${better.length}개`), better.length ? better.slice(0, 12).map(line) : empty("없음"),
      h("h3", null, `나빠진 것 ${worse.length}개`), worse.length ? worse.slice(0, 12).map(line) : empty("없음")));
  } else {
    root.append(section("이 변경으로 결과가 달라진 대화", empty("두 버전을 모두 쓴 대화 기록이 없어요. 재생 · 계산 실험에서만 쓴 버전은 대화 단위로 비교할 수 없어요.")));
  }
  return { node: root, title: "프롬프트 비교" };
}

/* ───────── 글 (실험 정리 · 프롬프트 카드) — 간단한 마크다운 → 화면 ───────── */
// 레포 안 글끼리의 링크는 이 화면의 주소로 바꾸고, 화면에 없는 파일(spec/… 등)은 글자만 남김
function mdLinkTarget(url) {
  if (/^https?:\/\//.test(url)) return { href: url, ext: true };
  let u = url;
  try { u = decodeURIComponent(url); } catch { /* 그대로 */ }
  u = u.replace(/^(\.\.\/|\.\/)+/, "").replace(/#.*$/, "");
  if (u === "실험정리.md") return { href: "#/summary" };
  const m = /^프롬프트카드\/([^/]+)\.md$/.exec(u);
  if (m) return { href: "#/cards/" + encodeURIComponent(m[1]) };
  return null;
}
// 파일 이름처럼 생긴 글 (spec/e0.md · 프롬프트카드/01-….md · results.json …)
const looksFile = (s) => /\.(md|jsonl?|ts|tsx|mjs|js)$/i.test(s);
// 글 사이에 그대로 적힌 파일 경로(data/v3/….json 등)는 '원본 자료'로 바꿈
const plainPaths = (t) => t.replace(/(?:\.{1,2}\/)*(?:[\w가-힣.\-]+\/)+[\w가-힣.\-]+\.(?:md|jsonl?|tsx?|mjs)\b/g, "원본 자료");
function mdInline(src) {
  const out = [];
  const re = /(`+)([^`]+?)\1|\*\*([^*]+?)\*\*|\[([^\]]+)\]\(([^)\s]+)\)/g;
  let pos = 0;
  let m;
  while ((m = re.exec(src)) !== null) {
    if (m.index > pos) out.push(plainPaths(src.slice(pos, m.index)));
    if (m[2] !== undefined) out.push(looksFile(m[2]) ? h("span", { class: "mdref", title: "원본 파일: " + m[2] }, "원본 파일") : h("code", null, m[2]));
    else if (m[3] !== undefined) out.push(h("b", null, mdInline(m[3])));
    else {
      const t = mdLinkTarget(m[5]);
      // 파일 이름이 글자로 보이는 링크는 쉬운 이름으로 바꾸고, 이름은 마우스를 올렸을 때만 보임
      const label = !looksFile(m[4]) ? m[4] : t && t.href === "#/summary" ? "실험 정리" : t && t.href.startsWith("#/cards/") ? "프롬프트 카드" : "원본 자료";
      if (t) out.push(h("a", { href: t.href, target: t.ext ? "_blank" : null, rel: t.ext ? "noopener" : null, title: looksFile(m[4]) ? m[4] : null }, label));
      else out.push(h("span", { class: "mdref", title: "원본 자료예요 (이 화면에는 링크가 없어요)" + (looksFile(m[4]) ? " · " + m[4] : "") }, label));
    }
    pos = m.index + m[0].length;
  }
  if (pos < src.length) out.push(plainPaths(src.slice(pos)));
  return out;
}
const MD_BLOCK = /^(`{3,}|#{1,6}\s|>|\s*([-*]|\d+\.)\s+\S|\s*\|)/;
function mdRender(src) {
  const lines = src.replace(/\r\n?/g, "\n").split("\n");
  const root = h("div", { class: "md" });
  const heads = [];
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    if (/^\s*$/.test(line)) { i++; continue; }
    let m;
    if ((m = /^(`{3,})(.*)$/.exec(line))) {
      const n = m[1].length;
      const buf = [];
      i++;
      while (i < lines.length && !(new RegExp("^`{" + n + ",}\\s*$").test(lines[i].trim()))) { buf.push(lines[i]); i++; }
      i++;
      root.append(h("pre", { class: "mdcode" }, h("code", null, buf.join("\n"))));
      continue;
    }
    if ((m = /^(#{1,6})\s+(.*)$/.exec(line))) {
      const lv = m[1].length;
      const el = h("h" + lv, { class: "mdh" + lv }, mdInline(m[2]));
      if (lv === 2) heads.push({ title: m[2], el });
      root.append(el);
      i++;
      continue;
    }
    if (/^(-{3,}|\*{3,})\s*$/.test(line)) { root.append(h("hr")); i++; continue; }
    if (/^\s*\|/.test(line) && i + 1 < lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i + 1])) {
      const cells = (l) => l.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map((c) => c.trim());
      const head = cells(line);
      i += 2;
      const rows = [];
      while (i < lines.length && /^\s*\|/.test(lines[i])) { rows.push(cells(lines[i])); i++; }
      const numeric = head.map((_, c) => c > 0 && rows.length > 0 && rows.every((r) => /^\**[0-9$—.~(+−-]/.test(r[c] || "—")));
      const ths = head.map((c, k) => h("th", { class: numeric[k] ? "r" : "" }, mdInline(c)));
      const trs = rows.map((r) => h("tr", null, head.map((_, k) => h("td", { class: numeric[k] ? "r num" : "" }, mdInline(r[k] || "")))));
      root.append(h("div", { class: "scroll" }, h("table", null, h("thead", null, h("tr", null, ths)), h("tbody", null, trs))));
      continue;
    }
    if (/^>/.test(line)) {
      const buf = [];
      while (i < lines.length && /^>/.test(lines[i])) { buf.push(lines[i].replace(/^>\s?/, "")); i++; }
      root.append(h("blockquote", null, buf.map((t, k) => [k ? h("br") : null, mdInline(t)])));
      continue;
    }
    if (/^\s*([-*]|\d+\.)\s+\S/.test(line)) {
      const stack = [];
      let host = root;
      while (i < lines.length && /^\s*([-*]|\d+\.)\s+\S/.test(lines[i])) {
        const mm = /^(\s*)([-*]|\d+\.)\s+(.*)$/.exec(lines[i]);
        const indent = mm[1].length;
        const ordered = /\d/.test(mm[2]);
        while (stack.length && indent < stack[stack.length - 1].indent) stack.pop();
        if (!stack.length || indent > stack[stack.length - 1].indent) {
          const list = h(ordered ? "ol" : "ul");
          if (stack.length) stack[stack.length - 1].lastLi.append(list); else host.append(list);
          stack.push({ list, indent, lastLi: null });
        }
        const top = stack[stack.length - 1];
        const li = h("li", null, mdInline(mm[3]));
        top.list.append(li);
        top.lastLi = li;
        i++;
        // 들여쓴 이어 줄은 앞 항목에 붙임
        while (i < lines.length && /^\s{2,}\S/.test(lines[i]) && !/^\s*([-*]|\d+\.)\s+\S/.test(lines[i])) { li.append(" ", mdInline(lines[i].trim())); i++; }
      }
      continue;
    }
    const buf = [];
    while (i < lines.length && !/^\s*$/.test(lines[i]) && (buf.length === 0 || !MD_BLOCK.test(lines[i]))) { buf.push(lines[i]); i++; }
    root.append(h("p", null, buf.map((t, k) => [k ? " " : "", mdInline(t)])));
  }
  return { node: root, heads };
}

async function vSummary() {
  const [docs, idx] = await Promise.all([load("docs.json"), load("index.json")]);
  if (!docs.summary) throw new Error("실험 정리 글이 아직 없어요");
  const r = mdRender(docs.summary.md);
  const root = h("div");
  const e0 = idx.experiments.find((e) => e.id === "e0");
  root.append(title("실험 정리"), h("p", { class: "lead" }, "실험 정리 글을 그대로 보여 줘요 — 실험이 끝날 때마다 한 장씩 채워져요. 실험마다 한 줄 결론 › 왜 했나 › 누구로 해 봤나 › 대화로 보면 › 결과 › 아직 모르는 것 순서로 적혀 있어요."),
    h("div", { class: "chips", style: "margin-bottom:12px" },
      r.heads.map((hd) => h("a", { class: "chip", href: "#/summary", onclick: (ev) => { ev.preventDefault(); hd.el.scrollIntoView({ block: "start" }); window.scrollBy(0, -110); } }, hd.title.replace(/\*\*/g, "").replace(/\s*\(.*$/, ""))),
      e0 ? chip("E0 실험 페이지", "ink", { href: hExp("e0") }) : null),
    h("div", { class: "card mdcard" }, r.node));
  return { node: root, title: "실험 정리" };
}

async function vCards(id) {
  const docs = await load("docs.json");
  if (!docs.cards.length) throw new Error("프롬프트 카드가 아직 없어요");
  const card = docs.cards.find((c) => c.id === id) || docs.cards[0];
  const r = mdRender(card.md);
  const root = h("div");
  const seg = h("div", { class: "seg", role: "tablist", style: "margin-bottom:14px" }, docs.cards.map((c) => h("a", { class: c.id === card.id ? "on" : "", href: "#/cards/" + encodeURIComponent(c.id) }, c.id.replace(/^(\d+)-(.*)$/, "$1 · $2"))));
  put(root, [title("프롬프트 카드"), h("p", { class: "lead" }, "앱을 만들 때 그대로 가져다 쓰는 지시문(프롬프트) 카드예요. AI가 말하는 자리 하나가 한 장이고, 실험이 끝날 때마다 채워져요."),
    docs.cards.length > 1 ? seg : null, h("div", { class: "card mdcard" }, r.node)]);
  return { node: root, title: card.title };
}
