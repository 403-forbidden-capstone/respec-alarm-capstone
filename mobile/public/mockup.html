<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Re:Spec Alarm 클릭 목업</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&display=swap">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --stage:#e6e9e4; --panel:#f8f9f6; --pline:#d3d9d1; --pink:#1c2a24; --pmuted:#5f6b64; --deck:#1f4a3d; --deck-soft:#dce8e1;
  --a-bg:#f6f6f4; --a-card:#ffffff; --a-line:#e6e6e2; --a-ink:#151515; --a-sub:#6b6b67; --a-faint:#a5a5a0; --a-chip:#efefec;
  --ok:#55b477; --mid:#7b99e8; --zz:#d3a630; --warn:#c8553d;
  --font:Pretendard,"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--stage:#111513; --panel:#1a201d; --pline:#2c3631; --pink:#e3ebe6; --pmuted:#9aa69f; --deck:#2c6a56; --deck-soft:#22332c;}
}
:root[data-theme="dark"]{--stage:#111513; --panel:#1a201d; --pline:#2c3631; --pink:#e3ebe6; --pmuted:#9aa69f; --deck:#2c6a56; --deck-soft:#22332c;}
*,*::before,*::after{box-sizing:border-box}
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%; margin:0; background:var(--stage); color:var(--pink); font-family:var(--font); -webkit-font-smoothing:antialiased; word-break:keep-all}
button{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--deck); outline-offset:2px}
.screen :focus-visible{outline-color:var(--a-ink)}

/* stage */
.stage{min-height:100%; display:flex; align-items:center; justify-content:center; gap:36px; padding:20px 24px}
.device-wrap{position:relative; flex:none; width:414px; height:868px}
.device{position:absolute; top:0; left:0; width:414px; height:868px; transform-origin:top left; border-radius:58px; background:#1a1b1a; padding:12px; box-shadow:0 40px 80px -40px rgba(15,30,24,.55), inset 0 0 0 1px #2c2d2c}
.cam{position:absolute; top:25px; left:50%; width:11px; height:11px; margin-left:-5.5px; border-radius:50%; background:#070707; z-index:40; box-shadow:0 0 0 2px #232323}
.screen{position:relative; width:390px; height:844px; border-radius:46px; overflow:hidden; background:var(--a-bg); color:var(--a-ink); display:flex; flex-direction:column; font-size:14px; line-height:1.45}
.sbar{height:42px; flex:none; display:flex; align-items:center; justify-content:space-between; padding:8px 30px 0; font-size:13px; font-weight:600; font-variant-numeric:tabular-nums}
.sbar .ic{display:flex; gap:6px; align-items:center}
.sig{display:flex; gap:1.5px; align-items:flex-end; height:11px}
.sig i{width:3px; background:currentColor; border-radius:1px}
.sig i:nth-child(1){height:4px}.sig i:nth-child(2){height:6px}.sig i:nth-child(3){height:8px}.sig i:nth-child(4){height:11px}
.bat{width:22px; height:11px; border:1.5px solid currentColor; border-radius:3px; position:relative}
.bat::after{content:''; position:absolute; top:1.5px; bottom:1.5px; left:1.5px; right:5px; background:currentColor; border-radius:1px}
#view{flex:1; overflow-y:auto; overflow-x:hidden; padding:0 20px 28px; scrollbar-width:none; outline:none}
#view::-webkit-scrollbar{display:none}

/* tabs */
.tabs{flex:none; display:grid; grid-template-columns:repeat(4,1fr); background:#fff; border-top:1px solid var(--a-line); padding:8px 6px 16px}
.tabs button{border:0; background:none; display:flex; flex-direction:column; align-items:center; gap:4px; font-size:11.5px; color:var(--a-faint); padding:4px 0; cursor:pointer}
.tabs .n{font-size:10px; min-width:26px; height:16px; line-height:16px; border-radius:8px; background:var(--a-chip); color:var(--a-faint); text-align:center; font-variant-numeric:tabular-nums}
.tabs .on{color:var(--a-ink); font-weight:600}
.tabs .on .n{background:var(--a-ink); color:#fff}

/* type + layout */
.top{display:flex; align-items:center; justify-content:space-between; min-height:44px; margin-top:2px}
.sid{font-size:11.5px; color:var(--a-faint); letter-spacing:.06em}
.back,.tlink{border:0; background:none; padding:6px 0; font-size:13.5px; color:var(--a-sub); cursor:pointer}
.tbtn{border:1px solid var(--a-line); background:#fff; border-radius:16px; height:32px; padding:0 12px; font-size:13px; cursor:pointer; white-space:nowrap}
.ttl{font-size:23px; font-weight:700; letter-spacing:-.025em; margin:8px 0 4px; line-height:1.3}
.lead{margin:0 0 18px; color:var(--a-sub); font-size:13.5px}
.ink{color:var(--a-ink)}
.h2{display:flex; align-items:center; justify-content:space-between; margin:22px 0 10px; font-size:15.5px; font-weight:700}
.h2 small{font-weight:500; color:var(--a-sub); font-size:12.5px}
.small{font-size:12.5px; color:var(--a-sub)}
p.small{margin:4px 0 0; line-height:1.55}
.block{display:block}
.ctr{text-align:center}
.big2{font-size:17px; font-weight:700; letter-spacing:-.01em; line-height:1.4}
.between{display:flex; justify-content:space-between; align-items:center; gap:10px}
.grow{flex:1; min-width:0; display:flex; flex-direction:column}
.grow small{font-size:12.5px; color:var(--a-sub)}
.note{font-size:12px; color:var(--a-sub); margin:4px 4px 14px; line-height:1.55}
.note.sm{margin:10px 0 0; font-size:11.5px; color:var(--a-faint)}
.empty{color:var(--a-sub); font-size:13px; margin:6px 0; line-height:1.55}

.card{display:block; background:var(--a-card); border:1px solid var(--a-line); border-radius:22px; padding:16px 18px; margin:0 0 12px; text-align:left; width:100%}
button.card{cursor:pointer}
.card.dash{background:transparent; border-style:dashed; border-color:#cfcfca}
.card.flat{border:0; padding:0}
.lbl{font-size:12px; color:var(--a-sub); margin:0 0 8px}
.lbl2{font-size:11.5px; color:var(--a-faint); margin:8px 0 6px}
.kv{display:flex; justify-content:space-between; align-items:center; gap:12px; padding:11px 0}
.kv + .kv{border-top:1px solid var(--a-line)}
.kv .k{color:var(--a-sub); font-size:13.5px}
.kv .v{font-weight:600; text-align:right; display:flex; flex-direction:column; align-items:flex-end}
.kv .v small{font-weight:400; font-size:11.5px; color:var(--a-faint)}
.kv .v.row-r{flex-direction:row; align-items:center; gap:12px}
.kv small.block{font-size:12px; color:var(--a-sub); font-weight:400}
.btn{display:flex; align-items:center; justify-content:center; width:100%; height:52px; border:0; border-radius:16px; background:var(--a-ink); color:#fff; font-weight:600; font-size:15px; cursor:pointer}
.btn.ghost{background:#fff; color:var(--a-ink); border:1px solid var(--a-line)}
.btn.plain{background:none; color:var(--a-sub); height:44px; font-weight:500}
.btn.sm{height:38px; width:auto; padding:0 16px; font-size:13.5px; border-radius:12px}
.btn:disabled{opacity:.35; cursor:default}
.stack{display:grid; gap:10px; margin-top:16px}
.row2{display:flex; gap:8px; margin-top:12px}
.chip{display:inline-flex; align-items:center; height:26px; padding:0 10px; border-radius:13px; border:1px solid var(--a-line); background:#fff; font-size:12px; color:var(--a-ink); white-space:nowrap}
.chip.fill{background:var(--a-chip); border-color:transparent}
.chip.ink{background:var(--a-ink); color:#fff; border-color:var(--a-ink)}
.chip.dark{background:transparent; border-color:rgba(255,255,255,.35); color:#fff}
.chips{display:flex; flex-wrap:wrap; gap:6px}

.sw{width:46px; height:28px; border-radius:14px; background:#d8d8d4; position:relative; border:0; cursor:pointer; flex:none; transition:background .18s}
.sw.on{background:var(--a-ink)}
.sw::after{content:''; position:absolute; top:3px; left:3px; width:22px; height:22px; border-radius:50%; background:#fff; transition:transform .18s}
.sw.on::after{transform:translateX(18px)}
.seg{display:flex; background:var(--a-chip); border-radius:14px; padding:4px; margin-bottom:6px}
.seg button{flex:1; height:38px; border:0; background:none; border-radius:11px; font-size:14px; color:var(--a-sub); cursor:pointer}
.seg button.on{background:#fff; color:var(--a-ink); font-weight:600; box-shadow:0 1px 2px rgba(0,0,0,.06)}

/* alarm card */
.acard{padding:14px 16px}
.acard.off{opacity:.45}
.acard-h{display:flex; justify-content:space-between; align-items:center}
.acard-b{display:flex; justify-content:space-between; align-items:center; width:100%; border:0; background:none; padding:2px 0 0; text-align:left; cursor:pointer}
.acard-b.static{cursor:default}
.bigt{display:flex; align-items:baseline; gap:6px}
.ampm{font-size:16px; color:var(--a-sub)}
.num{font-size:46px; font-weight:300; letter-spacing:-.035em; font-variant-numeric:tabular-nums; line-height:1.1}
.kind{font-size:13px; color:var(--a-sub)}
.chain{display:flex; flex-direction:column; align-items:flex-end; font-size:12px; line-height:1.35; font-weight:600}
.chain i{font-style:normal; color:var(--a-faint); font-weight:400; line-height:1}
.meta{font-size:11.5px; color:var(--a-faint); margin:2px 0 0; line-height:1.5}
.foot{text-align:right; font-size:12.5px; color:var(--a-sub); margin:6px 0 0}
.shift{display:flex; gap:8px; margin-top:12px}

/* schedule rows */
.srow{display:grid; grid-template-columns:50px 2px 1fr; gap:12px; align-items:center; width:100%; border:0; background:none; text-align:left; padding:10px 0; cursor:pointer}
div.srow{cursor:default}
.srow + .srow{border-top:1px solid var(--a-line)}
.st small{display:block; font-size:11px; color:var(--a-sub)}
.st b{font-size:15px; font-variant-numeric:tabular-nums}
.sb{height:30px; background:var(--a-ink); width:2px}
div.srow .sb{background:var(--a-line)}
.sx b{display:block; font-size:14.5px}
.sx small{font-size:12px; color:var(--a-sub)}
.rcard b,.sug b{display:block; font-size:15px}
.rcard small,.sug small{display:block; font-size:12.5px; color:var(--a-sub); margin-top:2px}
.rcard s{color:var(--a-faint)}
.prog{display:block; height:6px; border-radius:3px; background:var(--a-chip); margin-top:12px; overflow:hidden}
.prog b{display:block; height:100%; background:var(--a-ink); transition:width .25s}
.todo{display:flex; align-items:center; gap:10px; width:100%; border:0; background:none; padding:10px 0; text-align:left; cursor:pointer}
.todo + .todo{border-top:1px solid var(--a-line)}
.cb{width:20px; height:20px; border-radius:6px; border:1.5px solid var(--a-faint); display:grid; place-items:center; flex:none}
.todo.done{color:var(--a-faint); text-decoration:line-through}
.todo.done .cb{background:var(--a-ink); border-color:var(--a-ink)}
.todo.done .cb::after{content:'✓'; color:#fff; font-size:12px}
.cta .btn{margin-top:12px}
.gq{display:flex; align-items:center; gap:12px}
.gq b{display:block}
.gq small{font-size:12.5px; color:var(--a-sub)}
.avs{display:flex}
.avs .avatar{margin-left:-8px; box-shadow:0 0 0 2px #fff}
.avs .avatar:first-child{margin-left:0}

/* people */
.avatar{width:40px; height:40px; border-radius:50%; background:var(--a-chip); display:grid; place-items:center; font-size:13px; font-weight:600; position:relative; flex:none}
.avatar.sm{width:32px; height:32px; font-size:12px}
.dot{position:absolute; top:0; right:-1px; width:10px; height:10px; border-radius:50%; border:2px solid #fff; font-style:normal}
.dot.ok{background:var(--ok)}
.dot.mid{background:var(--mid)}
.dot.zz{background:none; border:0; width:auto; height:auto; color:var(--zz); font-size:11px; font-weight:700; top:-6px; right:-2px; line-height:1}
.person{display:flex; align-items:center; gap:12px; width:100%; border:0; background:none; text-align:left; padding:12px 0; cursor:pointer}
div.person{cursor:default}
.person + .person{border-top:1px solid var(--a-line)}
.person .pr{font-size:12.5px; color:var(--a-sub); display:flex; gap:6px; align-items:center; white-space:nowrap}
.mini{border:0; background:none; font-size:12px; color:var(--a-sub); padding:6px 4px; cursor:pointer; white-space:nowrap}
.mini:disabled{color:var(--a-faint); text-decoration:line-through; cursor:default}
.req{display:flex; align-items:center; gap:12px}
.search{display:flex; align-items:center; gap:8px; background:#fff; border:1px solid var(--a-line); border-radius:16px; padding:0 14px; height:48px; margin:14px 0 12px}
.search:focus-within{border-color:var(--a-ink)}
.search input{flex:1; border:0; background:none; font:inherit; outline:none; min-width:0}
.tiles{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:14px}
.tile{height:96px; border-radius:20px; border:1px solid var(--a-line); background:#fff; text-align:left; padding:14px; display:flex; flex-direction:column; cursor:pointer}
.tile b{font-size:20px; font-weight:400; margin-bottom:auto; line-height:1}
.tile span{font-weight:600; font-size:14px}
.tile small{font-size:11.5px; color:var(--a-sub)}
.tile.dark{background:var(--a-ink); color:#fff; border-color:var(--a-ink)}
.tile.dark small{color:rgba(255,255,255,.6)}
.gcard b{display:block; font-size:16px; margin-top:10px}
.gcard small{display:block; color:var(--a-sub); font-size:12.5px; margin:2px 0 10px}
.gcard.row{display:flex; align-items:center; gap:12px}
.gcard.row b,.gcard.row small{margin:0}
.gico{width:42px; height:42px; border-radius:12px; background:var(--a-ink); color:#fff; display:grid; place-items:center; font-size:13px; font-weight:600; flex:none}
.gico.light{background:var(--a-chip); color:var(--a-ink); border-radius:50%}
.gico.sm{width:36px; height:36px}
.perm{padding:12px 0}
.perm + .perm{border-top:1px solid var(--a-line)}
.ptab{width:100%; border-collapse:collapse; font-size:12.5px}
.ptab th,.ptab td{padding:8px 4px; text-align:center; border-bottom:1px solid var(--a-line)}
.ptab th{font-weight:500; color:var(--a-sub); font-size:11.5px}
.ptab th:first-child,.ptab td:first-child{text-align:left}
.ptab tr.fin td{font-weight:700; border-bottom:0}
.yes{color:var(--a-ink); font-weight:700}
.no{color:var(--a-faint)}

/* detail */
input[type=range]{width:100%; accent-color:var(--a-ink); margin:4px 0 2px}
.formula{background:var(--a-chip); border-radius:14px; padding:12px 14px; font-size:13px; font-variant-numeric:tabular-nums; margin:0 0 6px; line-height:1.5}
.axis{display:flex; justify-content:space-between; align-items:center; margin-top:12px}
.axis em{font-style:normal; font-size:11px; color:var(--a-sub); background:var(--a-chip); border-radius:8px; padding:1px 6px; margin-left:4px}
.lvopts{display:flex; gap:4px; background:var(--a-chip); border-radius:12px; padding:3px}
.lvopts button{border:0; background:none; width:42px; height:30px; border-radius:9px; cursor:pointer; color:var(--a-sub)}
.lvopts .on{background:var(--a-ink); color:#fff; font-weight:600}
.axdesc{margin:4px 0 0; font-size:12px; color:var(--a-faint); text-align:right}

/* form */
.field{display:flex; align-items:center; justify-content:space-between; padding:10px 0; gap:12px}
.field + .field{border-top:1px solid var(--a-line)}
.field .k{color:var(--a-sub); font-size:13.5px; flex:none}
.field input,.field select{border:0; background:none; font:inherit; font-weight:600; text-align:right; color:var(--a-ink); min-width:0; width:62%; padding:4px 0; border-radius:6px}
.field select{-webkit-appearance:none; appearance:none; cursor:pointer; text-align-last:right}
.opts{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
.opt{height:44px; border-radius:14px; border:0; background:var(--a-chip); cursor:pointer; font-size:14px}
.opt.on{background:var(--a-ink); color:#fff; font-weight:600}

/* ringing */
#overlay:empty,#modal:empty{display:none}
.ring{position:absolute; inset:0; z-index:30; display:flex; flex-direction:column; padding:52px 22px 28px; background:#141414; color:#fff; animation:rise .35s ease-out}
.ring.depart{background:#4a4a54}
.ring.prepare{background:#262a28}
.ring-top{display:flex; justify-content:space-between; align-items:center}
.sid.lt{color:rgba(255,255,255,.45)}
.ring-head{text-align:center; margin:30px 0 0; font-size:15px; opacity:.8}
.ring-time{text-align:center; font-size:78px; font-weight:600; letter-spacing:-.045em; line-height:1.05; margin:4px 0 0; font-variant-numeric:tabular-nums}
.ring-title{text-align:center; font-size:17px; font-weight:600; margin:14px 0 2px}
.ring-sub{text-align:center; font-size:13px; opacity:.65; margin:0}
.voice{margin-top:22px; background:rgba(255,255,255,.08); border-radius:20px; padding:16px 18px}
.voice small{display:block; font-size:11.5px; opacity:.6; margin-bottom:6px}
.voice p{margin:0; font-size:14.5px; line-height:1.6}
.wave{display:flex; gap:3px; align-items:center; height:18px; margin-top:10px}
.wave i{width:3px; height:6px; border-radius:2px; background:rgba(255,255,255,.8); animation:wv 1s ease-in-out infinite}
.wave i:nth-child(2n){animation-delay:.18s}
.wave i:nth-child(3n){animation-delay:.36s}
.lvline{font-size:11.5px; opacity:.55; margin:10px 2px 0}
.snz{margin-top:auto}
.snz small{font-size:12px; opacity:.7}
.snz-opts{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:8px 0 16px}
.snz-opts button{height:42px; border-radius:14px; border:0; background:rgba(255,255,255,.1); color:#fff; cursor:pointer}
.snz-opts .on{background:#fff; color:#141414; font-weight:600}
.ring-btns{display:grid; grid-template-columns:1fr 1.3fr; gap:10px}
.rbtn{height:54px; border-radius:18px; border:0; background:rgba(255,255,255,.12); color:#fff; font-weight:600; cursor:pointer}
.rbtn.main{background:#fff; color:#141414}
@keyframes wv{0%,100%{height:4px}50%{height:16px}}
@keyframes rise{from{transform:translateY(14px); opacity:0}to{transform:none; opacity:1}}

/* wake check */
.flow{display:flex; flex-wrap:wrap; gap:6px; align-items:center; font-size:12px; margin:0 0 14px}
.flow span{padding:5px 10px; border-radius:12px; border:1px solid var(--a-line); color:var(--a-faint); background:#fff}
.flow span.done{color:var(--a-ink)}
.flow span.on{background:var(--a-ink); color:#fff; border-color:var(--a-ink)}
.flow i{font-style:normal; color:var(--a-faint)}
.meter{margin:12px 0}
.meter .mh{display:flex; justify-content:space-between; font-size:13px}
.meter .mt{height:8px; border-radius:4px; background:var(--a-chip); margin-top:6px; position:relative}
.meter .mt b{position:absolute; top:0; bottom:0; left:0; background:var(--a-ink); border-radius:4px; transition:width .4s}
.meter .th{position:absolute; top:-4px; bottom:-4px; width:2px; background:var(--warn)}
.sim{border:1px dashed var(--a-faint); border-radius:18px; padding:14px; margin-top:14px}
.sim p{margin:0 0 10px; font-size:12px; color:var(--a-sub)}
.stack2{display:grid; gap:8px}
.notif{background:#fff; border-radius:18px; padding:14px 16px; box-shadow:0 10px 26px -14px rgba(0,0,0,.3); border:1px solid var(--a-line); margin-bottom:12px}
.notif .nh{display:flex; justify-content:space-between; font-size:12px; color:var(--a-sub); margin-bottom:6px}
.notif p{margin:4px 0 12px; color:var(--a-sub); font-size:13px}
.done-big{text-align:center; padding:18px 0 14px}
.done-big .ck{width:64px; height:64px; border-radius:50%; background:var(--a-ink); color:#fff; display:grid; place-items:center; margin:0 auto 14px; font-size:28px}
.done-big b{font-size:18px}

/* timeline */
.tl{list-style:none; margin:0; padding:0}
.tl li{display:grid; grid-template-columns:64px 10px 1fr auto; gap:8px; align-items:center; padding:9px 0; font-size:13.5px}
.tl .t{font-size:12px; color:var(--a-sub); font-variant-numeric:tabular-nums}
.tl .d{width:7px; height:7px; border-radius:50%; background:var(--a-line)}
.tl li.now .d{background:var(--a-ink)}
.tl li.past{color:var(--a-faint)}
.tl .src{font-size:11.5px; color:var(--a-faint); text-align:right}

/* chat */
.chat{display:flex; flex-direction:column; gap:10px; padding:4px 0 8px}
.msg{max-width:84%; padding:12px 14px; border-radius:18px; font-size:14px; line-height:1.55}
.msg time{display:block; font-size:11px; color:var(--a-faint); margin-top:4px}
.msg.ai{background:#fff; border:1px solid var(--a-line); border-bottom-left-radius:6px; align-self:flex-start}
.msg.me{background:var(--a-ink); color:#fff; border-bottom-right-radius:6px; align-self:flex-end}
.msg.me time{color:rgba(255,255,255,.55)}
.typing{display:flex; gap:4px; padding:16px}
.typing i{width:6px; height:6px; border-radius:50%; background:var(--a-faint); animation:bl 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}
.typing i:nth-child(3){animation-delay:.3s}
.xcard{max-width:92%}
.xcard > small{display:block; font-size:11.5px; color:var(--a-faint); margin-bottom:6px}
.xr{display:flex; justify-content:space-between; gap:12px; font-size:13px; padding:6px 0; border-top:1px solid var(--a-line)}
.xr span{color:var(--a-sub)}
.xr em{font-style:normal; font-weight:400; font-size:11px; color:var(--a-sub); margin-left:4px}
.xcard .q{margin:10px 0; font-weight:600}
.xbtns{display:flex; gap:6px; flex-wrap:wrap}
.xs{margin:6px 0 0; font-size:12.5px; color:var(--a-sub)}
#view.chatview{padding-bottom:0}
.composer{position:sticky; bottom:0; margin:0 -20px; padding:18px 16px 14px; background:linear-gradient(rgba(246,246,244,0),var(--a-bg) 30%)}
.cbox{background:#fff; border:1px solid var(--a-line); border-radius:26px; padding:12px 16px 14px; text-align:center; box-shadow:0 10px 30px -18px rgba(0,0,0,.25)}
.cbox .small{margin:0 0 8px; display:block}
.tin{display:flex; gap:6px; margin-bottom:10px}
.tin input{flex:1; border:1px solid var(--a-line); border-radius:12px; padding:0 12px; height:38px; font:inherit; min-width:0}
.cbtns{display:flex; align-items:center; justify-content:center; gap:16px}
.pill{height:38px; padding:0 16px; border-radius:19px; background:var(--a-chip); border:0; cursor:pointer}
.pill.on{background:var(--a-ink); color:#fff}
.mic{width:58px; height:58px; border-radius:50%; background:var(--a-ink); color:#fff; border:0; font-weight:600; font-size:13px; cursor:pointer}
.mic:disabled{opacity:.3; cursor:default}
.mic.listen{animation:pulse 1s infinite}
@keyframes bl{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(20,20,20,.3)}50%{box-shadow:0 0 0 12px rgba(20,20,20,0)}}

/* journal + routine */
.jtext{font-size:14.5px; line-height:1.75; margin:4px 0 6px}
textarea{width:100%; border:1px solid var(--a-line); border-radius:14px; padding:12px; font:inherit; line-height:1.6; resize:vertical; color:var(--a-ink)}
.days{display:flex; justify-content:space-between}
.days button{width:38px; height:38px; border-radius:50%; border:0; background:var(--a-chip); color:var(--a-faint); cursor:pointer}
.days .on{background:var(--a-ink); color:#fff}
.rstep{display:grid; grid-template-columns:48px 1fr auto; gap:10px; align-items:center; padding:12px 0}
.rstep + .rstep{border-top:1px solid var(--a-line)}
.rstep > b{font-variant-numeric:tabular-nums; font-size:13px}
.rstep .nm{display:block; font-size:14px}
.rstep small{font-size:11.5px; color:var(--a-faint)}

/* records */
.cal-h{font-size:14px; margin-bottom:12px}
.cal-h > span{color:var(--a-faint)}
.cal{display:grid; grid-template-columns:repeat(7,1fr); gap:4px 0; text-align:center; font-size:13px}
.cal .w{font-size:11px; color:var(--a-faint); padding-bottom:4px}
.cal button{border:0; background:none; height:40px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; cursor:pointer; font-variant-numeric:tabular-nums}
.cal button span{width:28px; height:28px; display:grid; place-items:center; border-radius:50%}
.cal .today span{background:var(--a-ink); color:#fff}
.cal .fut{color:var(--a-faint)}
.cal i{width:4px; height:4px; border-radius:50%; background:var(--a-ink)}
.cal i.part{background:var(--a-faint)}
.cal i.none{background:transparent}
.legend{display:flex; gap:14px; justify-content:center; font-size:11.5px; color:var(--a-sub); margin-top:10px; border-top:1px solid var(--a-line); padding-top:10px}
.legend i{display:inline-block; width:5px; height:5px; border-radius:50%; background:var(--a-ink); margin-right:5px; vertical-align:middle}
.legend i.part{background:var(--a-faint)}
.wstrip{display:grid; grid-template-columns:repeat(7,1fr); gap:4px; text-align:center}
.wstrip span{border-radius:14px; padding:8px 0; background:var(--a-chip); display:flex; flex-direction:column; align-items:center; gap:2px}
.wstrip small{font-size:11px; color:var(--a-sub)}
.wstrip b{font-size:14px}
.wstrip i{width:4px; height:4px; border-radius:50%; background:var(--a-ink)}
.wstrip .fut{opacity:.5}
.wstrip .fut i{background:transparent}
.wstrip .on{background:var(--a-ink); color:#fff}
.wstrip .on small{color:rgba(255,255,255,.7)}
.wstrip .on i{background:#fff}
.stats{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.stat small{display:block; font-size:12px; color:var(--a-sub)}
.stat .big{display:block; font-size:30px; font-weight:600; letter-spacing:-.02em; margin:4px 0; font-variant-numeric:tabular-nums}
.bar{display:grid; grid-template-columns:48px 1fr 28px; align-items:center; gap:10px; font-size:13px; margin:8px 0}
.bar .tr{height:8px; border-radius:4px; background:var(--a-chip); overflow:hidden}
.bar .tr b{display:block; height:100%; background:var(--a-ink); border-radius:4px}
.bar > span:last-child{text-align:right; color:var(--a-sub); font-variant-numeric:tabular-nums}

/* suggestion */
.trio{display:grid; grid-template-columns:repeat(3,1fr); margin-top:16px; text-align:center}
.trio small{display:block; font-size:11.5px; color:var(--a-faint)}
.trio b{font-size:15px}
.cmp{display:flex; align-items:center; gap:12px; margin:8px 0 10px}
.cmp span{flex:1; border-radius:16px; padding:14px; text-align:center; background:var(--a-chip)}
.cmp .c-new{background:var(--a-ink); color:#fff}
.cmp small{display:block; font-size:11.5px; opacity:.7}
.cmp b{font-size:26px; font-weight:600; font-variant-numeric:tabular-nums}
.cmp i{font-style:normal; color:var(--a-faint)}
.stepper{display:flex; align-items:center; justify-content:space-between; margin:18px 0 6px}
.stepper b{font-size:24px; font-variant-numeric:tabular-nums}

/* modal + toast */
.modal{position:absolute; inset:0; z-index:50; background:rgba(20,20,20,.38); display:flex; align-items:flex-end}
.sheet{width:100%; background:#fff; border-radius:26px 26px 0 0; padding:22px 20px 26px; max-height:88%; overflow:auto; animation:rise .25s ease-out}
.sheet h3{margin:0 0 6px; font-size:18px; letter-spacing:-.01em}
.calc{list-style:none; padding:0; margin:14px 0; counter-reset:c}
.calc li{display:grid; grid-template-columns:22px 1fr; gap:10px; padding:8px 0; font-size:14px; font-weight:600}
.calc li::before{counter-increment:c; content:counter(c); width:22px; height:22px; border-radius:50%; background:var(--a-ink); color:#fff; font-size:11.5px; display:grid; place-items:center}
.calc small{display:block; color:var(--a-sub); font-size:12px; font-weight:400; margin-top:2px}
#toast{position:absolute; left:50%; bottom:96px; transform:translate(-50%,10px); background:var(--a-ink); color:#fff; padding:11px 16px; border-radius:14px; font-size:13px; max-width:330px; width:max-content; opacity:0; pointer-events:none; transition:opacity .2s,transform .2s; z-index:60; text-align:center; line-height:1.45}
#toast.show{opacity:1; transform:translate(-50%,0)}

/* demo panel */
.panel{width:330px; flex:none; background:var(--panel); border:1px solid var(--pline); border-radius:26px; padding:22px 18px 20px; overflow:auto; color:var(--pink); position:relative}
.panel h2{margin:0; font-size:17px; font-weight:700; letter-spacing:-.01em}
.p-sub{margin:2px 0 16px; font-size:12.5px; color:var(--pmuted)}
.p-clock{background:var(--deck); color:#fff; border-radius:18px; padding:14px 16px; display:flex; flex-direction:column}
.p-clock .d{font-size:12.5px; opacity:.8}
.p-clock .t{font-size:30px; font-weight:300; letter-spacing:-.02em; font-variant-numeric:tabular-nums; line-height:1.25}
.p-clock .s{font-size:12.5px; margin-top:6px; opacity:.92; line-height:1.45}
.p-h{font-size:13px; font-weight:700; margin:20px 0 8px}
.steps{list-style:none; margin:0; padding:0; display:grid; gap:2px}
.steps button{width:100%; display:grid; grid-template-columns:68px 1fr; gap:8px; text-align:left; border:0; background:none; padding:9px 10px; border-radius:12px; cursor:pointer; color:var(--pink)}
.steps button:hover{background:var(--deck-soft)}
.steps button.on{background:var(--deck); color:#fff}
.steps .stc{font-size:12.5px; font-variant-numeric:tabular-nums; color:var(--pmuted); padding-top:1px}
.steps .on .stc{color:rgba(255,255,255,.8)}
.steps .sl{font-size:13.5px; font-weight:600}
.steps .sn{display:block; font-size:12px; font-weight:400; color:var(--pmuted); margin-top:1px}
.steps .on .sn{color:rgba(255,255,255,.75)}
.exp label{display:flex; gap:10px; align-items:flex-start; justify-content:space-between; font-size:13px; padding:8px 2px; cursor:pointer}
.exp label > span{flex:1}
.exp small{display:block; color:var(--pmuted); font-size:12px}
.exp input[type=checkbox]{margin-top:3px; accent-color:var(--deck); width:16px; height:16px}
.exp select{font:inherit; font-size:13px; border:1px solid var(--pline); border-radius:10px; background:var(--panel); color:var(--pink); padding:4px 8px}
.p-reset{margin-top:16px; width:100%; height:42px; border-radius:12px; border:1px solid var(--pline); background:none; color:var(--pink); cursor:pointer}
.p-note{font-size:12px; color:var(--pmuted); margin:14px 2px 0; line-height:1.55}
.p-close{display:none}
.fab{display:none}

@media (max-width:760px){
  .stage{padding:0; height:100%; min-height:0; display:block}
  .device-wrap{width:100%; height:100%}
  .device{position:static; width:100%; height:100%; border-radius:0; padding:0; transform:none!important; box-shadow:none; background:var(--a-bg)}
  .cam,.sbar{display:none}
  .screen{width:100%; height:100%; border-radius:0}
  #view{padding-top:6px}
  .panel{position:fixed; left:0; right:0; bottom:0; width:auto; max-height:80%; border-radius:24px 24px 0 0; z-index:100; transform:translateY(105%); transition:transform .25s; padding-bottom:calc(20px + env(safe-area-inset-bottom,0px)); box-shadow:0 -20px 40px -20px rgba(0,0,0,.35)}
  .panel.open{transform:none}
  .p-close{display:block; position:absolute; top:16px; right:16px; border:1px solid var(--pline); background:none; color:var(--pink); border-radius:12px; height:32px; padding:0 12px; cursor:pointer}
  .fab{display:block; position:fixed; left:50%; transform:translateX(-50%); top:calc(env(safe-area-inset-top,0px) + 10px); z-index:90; height:30px; padding:0 14px; border-radius:15px; border:0; background:var(--deck); color:#fff; font-size:12.5px; font-weight:600; box-shadow:0 6px 16px -8px rgba(0,0,0,.45); cursor:pointer}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important; transition:none!important}}

SCR.wake=()=>{

  else if(ph==='confirmed'&&w.how==='본인 응답')flow+='<span class="done">확인 알림</span><i>→</i><span class="on">기상 확정</span>';
  else if(ph==='confirmed')flow+='<span class="on">기상 확정</span>';

    h+=`<div class="notif" role="alert"><div class="nh"><b>Re:Spec Alarm</b><small>${hm(S.now).s}</small></div><b>지금 일어나셨나요?</b><p>응답하면 캡스톤팀에 기상 완료로 표시돼요.</p><button class="btn sm" data-act="confirmYes">일어났어요</button></div>`;

function relInfo(rel){
  if(rel.indexOf('f:')===0){const pid=rel.slice(2);return {type:'friend',label:P[pid].name,sub:'친구',ico:avatar(pid,true)};}
  const g=S.groups[rel];return {type:'group',label:g.name,sub:'그룹 · 멤버 '+g.members.length+'명',ico:`<span class="gico sm">${g.name.slice(0,1)}</span>`};
}
const grantOf=rel=>rel.indexOf('f:')===0?S.grants.friend[rel.slice(2)]:S.grants.group[rel];
function recvFor(rel){
  if(rel.indexOf('f:')===0){const pid=rel.slice(2);return (S.received[pid]||[]).filter(r=>r.src==='친구').map(r=>Object.assign({pid},r));}
  const g=S.groups[rel];
  return g.members.filter(p=>S.received[p]).map(pid=>{const r=S.received[pid].find(x=>x.src===g.name);return r?Object.assign({pid},r):null;}).filter(Boolean);
}

function stepList(){

}

function rewind(t){
  S.events=S.events.filter(e=>e.t<=t);
  ['wakeAt','departAt','arriveAt'].forEach(k=>{if(S.me[k]!=null&&S.me[k]>t)S.me[k]=null;});

  if(S.snooze&&S.snooze.until>t)S.snooze=null;
}

function aiTurn(){
  const ch=S.chat, line=SCRIPT[ch.step];

    if(line.who==='card'){
      ch.card={status:'pending'};ch.msgs.push({who:'card',t:S.now});

A.jEdit=()=>{S.editJ=true;S.jText=S.journal.text;render();};
A.jSave=()=>{S.journal.text=S.jText;S.journal.edited=S.jText!==S.journal.ai;S.editJ=false;toast('일기를 저장했어요');render();};
A.jCancel=()=>{S.editJ=false;render();};
A.rAccept=()=>{S.rDraft={title:'회의 전날 준비',goal:'여유로운 아침',days:['수'],active:true,steps:[{t:1290,name:'회의 자료 확인',dur:5,alarm:true},{t:1295,name:'노트북 충전',dur:2,alarm:false},{t:1297,name:'가방에 준비물 넣기',dur:3,alarm:false}]};go('routine');};
A.rDecline=()=>{S.journal.routine='rejected';toast('알겠어요 · 14일 동안 같은 루틴은 제안하지 않아요');render();};
const rCur=()=>S.rDraft||S.rNight;
A.rDay=d=>{const r=rCur(),i=r.days.indexOf(d.d),o='월화수목금토일';if(i>=0)r.days.splice(i,1);else r.days.push(d.d);r.days.sort((x,y)=>o.indexOf(x)-o.indexOf(y));render();};
A.rStepAlarm=d=>{const s=rCur().steps[+d.i];s.alarm=!s.alarm;render();};
A.rAdd=()=>{const r=rCur(),l=r.steps[r.steps.length-1];r.steps.push({t:l.t+l.dur,name:'새 단계',dur:5,alarm:false});render();};
A.rActive=()=>{const r=rCur();r.active=!r.active;render();};
A.rSave=()=>{
  const r=rCur();S.rNight=r;S.rDraft=null;if(S.journal)S.journal.routine='accepted';
  const n=r.steps.filter(s=>s.alarm).length;logE(S.now,'루틴 저장 · '+r.title,'직접 입력');
  if(S.stack.length>1)S.stack.pop();
  toast(r.active?`저장했어요 · 루틴 알람 ${n}개가 다음 ${r.days[0]}요일부터 울려요`:'저장했어요 · 루틴은 꺼 둔 상태예요');render();
};
A.sugApply=d=>{const a=byId('a3');S.sug.prev=a.p80;a.p80+=+d.v;S.sug.status='applied';S.modal=null;logE(S.now,`알람 조정 수락 · ${d.v}분 앞당김`,'직접 입력');toast(`내일 기상 알람이 ${fmt(alarmsOf(a)[0].t)}에 울려요`);render();};
A.sugEdit=()=>{S.modal={kind:'sugEdit',v:10};render();};
A.sugStep=d=>{S.modal.v=Math.max(0,Math.min(30,S.modal.v+ +d.d));render();};
A.sugApplyEdit=()=>A.sugApply({v:S.modal.v});
A.sugUndo=()=>{const a=byId('a3');a.p80=S.sug.prev;S.sug.status='pending';logE(S.now,'알람 조정 되돌림','직접 입력');toast('이전 값으로 되돌렸어요');render();};
A.sugDismiss=()=>{S.sug.status='dismissed';toast('이번 제안을 무시했어요');render();};
A.sugReopen=()=>{S.sug.status='pending';render();};
A.step=d=>{
  const st=stepList()[+d.i];if(!st)return;S.modal=null;
  if(st.act==='resnooze'){const sn=S.snooze;S.now=sn.until;S.ring={aid:sn.aid,type:sn.type,snoozed:sn.count,min:sn.min};S.snooze=null;logE(S.now,TYPE[sn.type]+' 알람 다시 울림','자동');}
  else{if(st.t<S.now)rewind(st.t);S.now=st.t;S.ring=null;}
  if(st.ring){const [aid,type]=st.ring;
    if(!isOn(aid)||!typeOn(aid,type))toast('꺼 둔 알람이라 울리지 않아요');
    else{S.ring={aid,type,snoozed:0};S.snooze=null;if(type==='WAKE'&&S.me.wakeAt==null)S.wake={phase:'idle',at:null,usage:0,recent:0,how:null};logE(S.now,TYPE[type]+' 알람 울림','자동');}}
  if(st.go==='home')S.stack=[{s:'home'}];
  if(st.go==='ai')S.stack=[{s:'ai'}];
  if(st.go==='suggestion')S.stack=[{s:'home'},{s:'suggestion'}];
  if(st.act==='leave'){S.me.departAt=S.now;logE(S.now,'집 출발','자동 · 지오펜스');toast('집을 벗어나 출발을 기록했어요');}
  if(st.act==='arrive'){const a=byId('a1'),late=Math.max(0,S.now-a.at);S.me.arriveAt=S.now;logE(S.now,late?`도착 · ${late}분 지각`:'도착 · 지각 아님','자동 · 지오펜스');toast(late?late+'분 늦게 도착했어요':`약속 ${a.at-S.now}분 전에 도착했어요`);}
  S.stepId=st.id;closePanel();render();
};
A.reset=()=>{S=initState();closePanel();toast('처음 상태로 돌아왔어요');render();};
A.panelOpen=()=>$('#panel').classList.add('open');
A.panelClose=closePanel;

/* ---------- 이벤트 ---------- */
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const f=A[el.dataset.act];if(f){e.preventDefault();f(el.dataset,el);}});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset.input==='buffer'&&S.dDraft){
    S.dDraft.buffer=+el.value;const a=byId(S.dDraft.aid),tmp=Object.assign({},a,{buffer:+el.value}),f=alarmsOf(tmp)[0];
    $('#bufVal').textContent=el.value+'분';$('#calcBox').innerHTML=calcInner(tmp);$('#leadT').textContent=fmt(f.t)+' '+TYPE[f.type];
  }else if(el.dataset.input==='journal')S.jText=el.value;
  else if(el.dataset.input==='chat')S.chat.text=el.value;
  else if(el.dataset.f&&S.draft)S.draft[el.dataset.f]=el.value;
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='expLate'){S.late4w=el.checked?2:1;toast(el.checked?'늦잠 지각 2회 · 중요 일정의 강도가 한 단계 올라가요':'늦잠 지각 1회 · 원래 강도로 돌아왔어요');render();}
  else if(el.id==='expTheta'){S.theta=+el.value;toast(`기상 판정 기준 θ를 ${el.value}분으로 바꿨어요`);render();}
  else if(el.dataset.f&&S.draft)S.draft[el.dataset.f]=el.value;
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(S.modal){S.modal=null;render();}else closePanel();}});
function fit(){
  const wrap=$('#wrap'),dev=$('#device'),pan=$('#panel');
  if(innerWidth<=760){wrap.style.width='';wrap.style.height='';dev.style.transform='';pan.style.maxHeight='';return;}
  const s=Math.min(1,(innerHeight-40)/868);
  wrap.style.width=414*s+'px';wrap.style.height=868*s+'px';dev.style.transform='scale('+s+')';pan.style.maxHeight=Math.max(420,868*s)+'px';
}
addEventListener('resize',fit);
/* ---------- 결정안건.html에 끼우기: 목업.html#v=화면&hl=가리킬 글자 ---------- */
// hl: 글자 = 그 글자를 담은 가장 안쪽 요소 · 글자^선택자 = 그 요소를 감싼 상자(선택자 없으면 .card) · @선택자 · 여러 개는 |
// &full 을 붙이면 데모 패널도 보임 (크게 보기)
function nightRoutine(){return {title:'회의 전날 준비',goal:'여유로운 아침',days:['수'],active:true,steps:[{t:1290,name:'회의 자료 확인',dur:5,alarm:true},{t:1295,name:'노트북 충전',dur:2,alarm:false},{t:1297,name:'가방에 준비물 넣기',dur:3,alarm:false}]};}
function fillChat(){
  const ch=S.chat;ch.msgs=[];
  SCRIPT.forEach((l,i)=>{if(l.who==='card'){ch.card={status:'pending'};ch.msgs.push({who:'card',t:S.now});}else ch.msgs.push({who:l.who,text:l.text,t:S.now-4+i});});
  ch.step=SCRIPT.length;
  S.todos.push({id:'t4',title:'노트북 충전기',day:23,done:false});logE(S.now,'준비물 저장 · 노트북 충전기','AI 대화');
}
function morning(){
  logE(480,'기상 알람 울림','자동');logE(490,'기상 확인','자동 판정');logE(543,'집 출발','자동 · 지오펜스');logE(590,'도착 · 지각 아님','자동 · 지오펜스');
  S.me={wakeAt:490,departAt:543,arriveAt:590};S.wake={phase:'confirmed',at:480,usage:2.4,recent:1.2,how:'자동 판정'};
}
const toWake=()=>[{s:'home'},{s:'wake'}];
const VIEWS={
  H01:()=>{},
  H01e:()=>{S.now=-180;},
  H01r:()=>{S.now=-180;S.rNight=nightRoutine();},
  H02:()=>{S.stack=[{s:'home'},{s:'alarms'}];},
  H03:()=>{S.stack=[{s:'home'},{s:'detail',id:'a1'}];},
  H03c:()=>{VIEWS.H03();render();S.dDraft.buffer=20;A.detailSave();},
  H05c:()=>{S.stack=[{s:'home'},{s:'newAppt'}];render();A.naCalc();},
  H07:()=>{S.now=480;S.ring={aid:'a1',type:'WAKE',snoozed:0};},
  H07re:()=>{S.now=495;S.ring={aid:'a1',type:'WAKE',re:true};},
  H08o:()=>{S.now=484;S.wake={phase:'observing',at:480,usage:0.8,recent:0.4,how:null};S.stack=toWake();},
  H08p:()=>{S.now=490;S.wake={phase:'prompt',at:480,usage:0.6,recent:0,how:null};S.stack=toWake();},
  H08c:()=>{S.now=490;S.wake={phase:'confirmed',at:480,usage:2.4,recent:1.2,how:'자동 판정'};S.me.wakeAt=490;S.stack=toWake();},
  G01g:()=>{S.seg.group='group';S.stack=[{s:'group'}];},
  G02:()=>{S.seg.group='group';S.stack=[{s:'group'},{s:'groupDetail',id:'cap'}];},
  G03:()=>{S.stack=[{s:'group'},{s:'groupDetail',id:'cap'},{s:'memberWake',pid:'sy'}];},
  G04:()=>{S.stack=[{s:'group'},{s:'groupDetail',id:'cap'},{s:'sharedAlarm',pid:'sy'}];},
  G04log:()=>{VIEWS.G04();A.shShift({id:'s1',pid:'sy',d:'-5'});A.shLog();},
  F02:()=>{S.stack=[{s:'group'},{s:'friendPerm',pid:'sy'}];},
  F03:()=>{S.permRel='cap';S.stack=[{s:'group'},{s:'permSet'}];},
  A02:()=>{S.now=1350;S.stack=[{s:'ai'}];},
  A02c:()=>{S.now=1350;S.stack=[{s:'ai'}];fillChat();},
  A03:()=>{morning();S.now=1355;S.stack=[{s:'ai'}];fillChat();A.chatSave();A.chatDone();},
  A04:()=>{S.now=1355;S.rDraft=nightRoutine();S.stack=[{s:'home'},{s:'routine'}];},
  R02w:()=>{S.seg.rec='week';S.stack=[{s:'rec'}];},
  R02m:()=>{S.seg.rec='month';S.stack=[{s:'rec'}];},
  S01:()=>{S.now=1355;S.stack=[{s:'home'},{s:'suggestion'}];},
  S01a:()=>{VIEWS.S01();A.sugApply({v:10});},
  S01d:()=>{VIEWS.S01();S.sug.status='dismissed';}
};
function mark(hl){
  let first=null;
  hl.split('|').filter(Boolean).forEach(x=>{
    let el=null;
    if(x.charAt(0)==='@')el=$('#screen').querySelector(x.slice(1));
    else{
      const i=x.indexOf('^'), txt=i<0?x:x.slice(0,i), up=i<0?null:(x.slice(i+1)||'.card');
      for(const r of ['#modal','#overlay','#view','#tabs']){
        const all=[...$(r).querySelectorAll('*')].filter(e=>e.textContent.indexOf(txt)>=0);
        el=all.find(e=>!all.some(o=>o!==e&&e.contains(o)));
        if(el)break;
      }
      if(el&&up)el=el.closest(up)||el;
    }
    if(el){el.classList.add('hl-mark');first=first||el;}
  });
  const v=$('#view');
  if(first&&v.contains(first)){const r=first.getBoundingClientRect(),vr=v.getBoundingClientRect();v.scrollTop+=r.top-vr.top-Math.max(16,(vr.height-r.height)/3);}
}
function fromHash(){
  const q=new URLSearchParams(location.hash.slice(1)), v=q.get('v');
  if(!v||!VIEWS[v])return false;
  document.documentElement.classList.toggle('embed',!q.has('full'));
  S=initState();closePanel();
  VIEWS[v]();render();
  clearTimeout(tT);$('#toast').classList.remove('show');
  mark(q.get('hl')||'');
  return true;
}
addEventListener('hashchange',fromHash);
if(!fromHash())render();fit();
})();
