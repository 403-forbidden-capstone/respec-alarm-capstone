<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Re:Spec 개발 보드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--ink:#1b1b1b;--sub:#5f5e5a;--mute:#9a9891;--line:#e4e2db;--line2:#cfcdc5;--bg:#f6f5f1;--card:#fff;--teal:#1d9e75;--teal-bg:#e1f5ee;--amber:#ba7517;--amber-bg:#faeeda;--blue:#185fa5;--blue-bg:#e6f1fb;--purple:#534ab7;--purple-bg:#eeedfe;--red:#a32d2d;--red-bg:#fcebeb;--r:8px}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Pretendard Variable",Pretendard,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg);font-size:13.5px;line-height:1.55}
a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}
button{font:inherit;color:var(--ink);background:#fff;border:1px solid var(--line2);border-radius:var(--r);padding:5px 10px;cursor:pointer}
button:hover{background:var(--bg)}button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
code,kbd{font-family:ui-monospace,Consolas,monospace;font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:1px 5px}
pre{font-family:ui-monospace,Consolas,monospace;font-size:12px;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;overflow:auto;margin:6px 0}
.top{display:flex;align-items:center;gap:12px;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top h1{font-size:15px;font-weight:600;margin:0}
.top .meta{color:var(--sub);font-size:12.5px}
.top .sp{flex:1}
.tabs{display:flex;gap:2px;padding:6px 12px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:46px;z-index:5}
.tabs button{border:0;background:none;padding:6px 11px;border-radius:6px;color:var(--sub)}
.tabs button.on{background:var(--bg);color:var(--ink);font-weight:600}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) auto;min-height:calc(100vh - 92px)}
.main{padding:16px 18px;min-width:0}
.side{border-left:1px solid var(--line);background:#fff;padding:10px;display:none;position:sticky;top:92px;height:calc(100vh - 92px);overflow:auto}
.side.show{display:block}
.side iframe{width:390px;height:780px;border:1px solid var(--line2);border-radius:18px;background:#fff;display:block}
.side .bar{display:flex;gap:6px;margin-bottom:8px;align-items:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.chip{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:999px;border:1px solid transparent;vertical-align:1px;white-space:nowrap}
.chip.done{background:var(--teal-bg);color:#085041}.chip.doing{background:var(--amber-bg);color:#633806}.chip.review{background:var(--blue-bg);color:#0c447c}.chip.week{background:var(--purple-bg);color:#3c3489}.chip.todo{background:#f1efe8;color:#5f5e5a}.chip.wait{background:#fff;color:var(--mute);border-color:var(--line2)}.chip.ai{background:#fff;color:var(--mute);border:1px dashed var(--line2)}
.chip.k-DB{background:var(--teal-bg);color:#085041}.chip.k-RPC{background:var(--purple-bg);color:#3c3489}.chip.k-Edge{background:var(--blue-bg);color:#0c447c}.chip.k-폰{background:var(--amber-bg);color:#633806}.chip.k-배치{background:#f1efe8;color:#5f5e5a}.chip.k-Auth{background:var(--red-bg);color:#791f1f}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:#d3d1c7;vertical-align:0}
.dot.done{background:var(--teal)}.dot.doing{background:#ef9f27}.dot.review{background:#378add}.dot.week{background:#7f77dd}
h2{font-size:15px;font-weight:600;margin:0 0 10px}
h3{font-size:13.5px;font-weight:600;margin:14px 0 6px;color:var(--sub)}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--sub);font-weight:500;white-space:nowrap}
tr:hover td{background:#fbfaf7}
.muted{color:var(--mute)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
/* 큰 그림 */
.big{display:grid;grid-template-columns:1.1fr 1.1fr .8fr;gap:14px}
.box{border:1px solid var(--line2);border-radius:12px;padding:12px 14px;background:#fff}
.box h4{margin:0 0 8px;font-size:13px;font-weight:600}
.node{display:flex;justify-content:space-between;align-items:center;padding:6px 8px;border:1px solid var(--line);border-radius:8px;margin:4px 0;background:#fff;cursor:pointer}
.node:hover{border-color:var(--line2);background:#fbfaf7}
.node small{color:var(--mute)}
.arrow{color:var(--mute);text-align:center;font-size:12px;margin:6px 0}
/* 화면 */
.screens{display:grid;grid-template-columns:200px minmax(0,1fr);gap:14px}
.tree{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 6px;position:sticky;top:104px;align-self:start;max-height:calc(100vh - 120px);overflow:auto}
.tree .g{font-size:11.5px;color:var(--mute);padding:8px 8px 2px}
.tree .it{padding:4px 8px;border-radius:6px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tree .it:hover{background:var(--bg)}.tree .it.on{background:var(--bg);font-weight:600}
.kv td:first-child{color:var(--sub);width:84px;white-space:nowrap}
/* 기능 */
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0 10px}
.flow span{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:3px 8px;font-size:12.5px}
.flow i{color:var(--mute);font-style:normal}
/* 연결 */
.matrix-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:#fff}
.matrix th,.matrix td{white-space:nowrap;text-align:center;padding:4px 6px}
.matrix th.v{writing-mode:vertical-rl;transform:rotate(180deg);height:120px;font-size:11.5px;text-align:left;padding:6px 2px}
.matrix td:first-child,.matrix th:first-child{text-align:left;position:sticky;left:0;background:#fff;font-weight:500}
.matrix .y{color:var(--teal);font-weight:700}
/* 할 일 */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.filters button{padding:3px 9px;font-size:12.5px}
.late{color:var(--red)}
.todo-title{max-width:420px}
/* 환경 */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.check{display:flex;gap:8px;align-items:flex-start;padding:5px 0;border-bottom:1px solid var(--line)}
.check select{font:inherit;font-size:12px;border:1px solid var(--line2);border-radius:6px;padding:1px 4px;background:#fff}
input.tok{font:inherit;border:1px solid var(--line2);border-radius:6px;padding:4px 8px;width:300px}
textarea.note{font:inherit;font-size:12.5px;border:1px solid var(--line);border-radius:6px;width:100%;min-height:36px;padding:4px 6px;margin-top:4px}
@media (max-width:1100px){.wrap{grid-template-columns:1fr}.side{position:static;height:auto;border-left:0;border-top:1px solid var(--line)}.big{grid-template-columns:1fr}.screens{grid-template-columns:1fr}.tree{position:static;max-height:none}.grid2{grid-template-columns:1fr}}
</style>
</head>

const STATUS = { '✅ 완료': 'done', '🏃 진행 중': 'doing', '👀 리뷰': 'review', '📌 이번 주': 'week', '📥 백로그': 'todo' };
const STATUS_KO = { done: '완료', doing: '진행 중', review: '리뷰', week: '이번 주', todo: '백로그', wait: '대기', ai: 'AI 대기' };

function items() { return (live && live.items) || (SNAPSHOT && SNAPSHOT.items) || []; }
function prs() { return (live && live.prs) || (SNAPSHOT && SNAPSHOT.prs) || []; }
function issue(n) { return items().find(i => i.n === n); }
// PR 본문에 Closes #가 없으면 브랜치 이름의 번호(feat/26-FE-…)로 잇는다
function closesOf(p) { if (p.closes && p.closes.length) return p.closes; const m = /^[a-z]+\/(\d+)-/.exec(p.branch || ''); return m ? [Number(m[1])] : []; }
function prsOf(n) { return prs().filter(p => closesOf(p).includes(n)); }
function statusOf(n) {
  const it = issue(n); if (!it) return 'wait';
  if (it.labels && it.labels.includes('AI 대기') && it.st !== 'CLOSED') return 'ai';
  if (it.st === 'CLOSED') return 'done';
  if (prsOf(n).some(p => p.state === 'OPEN')) return 'review';
  return STATUS[it.status] || 'todo';
}
function screenStatus(s) {
  const st = s.issues.map(statusOf);
  if (st.every(x => x === 'done')) return 'done';
  if (st.includes('review')) return 'review';
  if (st.includes('doing')) return 'doing';
  if (st.includes('week')) return 'week';
  if (s.ai || st.every(x => x === 'ai')) return 'ai';
  return 'todo';
}
function fileOf(s) {
  if (!s.route) return null;
  const want = `mobile/src/app/${s.route}.tsx`;
  const tree = live && live.tree; if (!tree) return { path: want, known: false };
  return { path: want, known: true, exists: tree.includes(want) };
}
const esc = (x) => String(x).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const chip = (st, text) => `<span class="chip ${st}">${esc(text ?? STATUS_KO[st] ?? st)}</span>`;
const issueLink = (n) => { const it = issue(n); const st = statusOf(n); return `<a href="https://github.com/${SITE.org}/${SITE.repo}/issues/${n}" target="_blank" title="${esc(it ? it.t : '')}">#${n}</a> ${chip(st)}`; };

function rScreens() {
  const s = SCREENS.find(x => x.code === sel) || SCREENS[0];
  const tree = TABS.map(([id, name]) => `<div class="g">${name}</div>` + SCREENS.filter(x => x.tab === id).map(x =>
    `<div class="it ${x.code === s.code ? 'on' : ''}" data-sel="${x.code}"><span class="dot ${screenStatus(x)}"></span>${x.code} ${esc(x.name)}</div>`).join('')).join('');
  const f = fileOf(s);
  const fileText = s.native ? '네이티브 화면 (alarm-core)' : f ? `<code>${esc(f.path)}</code> ${f.known ? (f.exists ? chip('done', 'main에 있음') : chip('todo', 'main에 없음')) : '<span class="muted">동기화하면 확인</span>'}` : '';

  const links = SCREENS.filter(o => o !== s && o.data.some(d => d.r.some(r => s.data.some(e => e.r.includes(r))))).map(o => `<a href="#" data-sel="${o.code}">${o.code} ${esc(o.name)}</a>`).join(' · ');
  const openPrs = s.issues.flatMap(prsOf).filter((p, i, a) => a.findIndex(q => q.number === p.number) === i);
  return `<div class="screens"><div class="tree">${tree}</div>

      <tr><td>목업</td><td><a href="/mockup" target="_blank">mockup.html</a>의 ${s.code} 화면</td></tr>

    <h3>근거</h3><div class="muted">docs/screen-data-map.md · 상세설계서 4장(테이블) · 5장(함수) · 7장(흐름)</div>

  const cols = [['테이블', KINDS.table], ['RPC', KINDS.rpc], ['Edge', KINDS.edge], ['폰', KINDS.phone]];
  const head = `<tr><th></th>${cols.map(([g, arr]) => `<th colspan="${arr.length}" style="text-align:center;border-left:1px solid var(--line2)">${g}</th>`).join('')}</tr>
    <tr><th>화면</th>${cols.map(([, arr]) => arr.map((c, i) => `<th class="v" style="${i === 0 ? 'border-left:1px solid var(--line2)' : ''}">${esc(c)}</th>`).join('')).join('')}</tr>`;
  const body = SCREENS.map(s => {
    const refs = new Set(s.data.flatMap(d => d.r));
    return `<tr><td><a href="#" data-go="screens:${s.code}">${s.code} ${esc(s.name)}</a></td>${cols.map(([, arr]) => arr.map((c, i) => `<td class="${refs.has(c) ? 'y' : ''}" style="${i === 0 ? 'border-left:1px solid var(--line2)' : ''}">${refs.has(c) ? '●' : ''}</td>`).join('')).join('')}</tr>`;
  }).join('');
  const usedBy = (c) => SCREENS.filter(s => s.data.some(d => d.r.includes(c))).map(s => s.code);
  const edgeRows = EDGE.map(([n, w, ext]) => `<tr><td><code>${esc(n)}</code></td><td>${esc(w)}</td><td>${esc(ext)}</td><td>${usedBy(n.split(' ')[0]).join(' · ')}</td></tr>`).join('');
  const nat = NATIVE.map(([n, w]) => `<tr><td><code>${esc(n)}</code></td><td>${esc(w)}</td></tr>`).join('');
  return `<h2>화면 × 테이블 · 함수 · 폰</h2><div class="muted" style="margin-bottom:8px">● = 그 화면이 읽거나 씀. 테이블 하나 바꾸면 어느 화면이 영향받는지 세로로 보면 됨</div>
  <div class="matrix-wrap"><table class="matrix">${head}${body}</table></div>
  <div class="grid2" style="margin-top:14px">
    <div class="card"><h2>Edge Function</h2><table><tr><th>이름</th><th>하는 일</th><th>외부</th><th>화면</th></tr>${edgeRows}</table></div>
    <div class="card"><h2>alarm-core (폰)</h2><table><tr><th>함수</th><th>하는 일</th></tr>${nat}</table>
      <div class="muted" style="margin-top:8px">앞으로: #29 강도 · #33 알람 4종 · 기록 · 맞추기 · #35 기상 확인 · 음성 안내. 예약 꾸러미 <code>RingPackage</code></div></div>
  </div>`;
}

function rTodo() {
  const all = items().filter(i => i.n);
  const mss = [...new Set(all.map(i => i.ms).filter(Boolean))];
  const labels = ['1차 데모', 'AI 대기', 'iOS', 'FE', 'BE'];
  const f = todoFilter;
  const list = all.filter(i => (!f.status || statusOf(i.n) === f.status) && (!f.ms || i.ms === f.ms) && (!f.label || (i.labels || []).includes(f.label)))
    .sort((a, b) => { const da = statusOf(a.n) === 'done', db = statusOf(b.n) === 'done'; if (da !== db) return da ? 1 : -1; return (a.due || '9') < (b.due || '9') ? -1 : 1; });
  const t = ymd(today);
  const rows = list.map(i => {
    const st = statusOf(i.n); const late = i.due && i.due < t && st !== 'done';
    const pr = prsOf(i.n).map(p => `<a href="https://github.com/${SITE.org}/${SITE.repo}/pull/${p.number}" target="_blank">PR #${p.number}</a>`).join(' ');
    const scr = SCREENS.filter(s => s.issues.includes(i.n)).map(s => `<a href="#" data-go="screens:${s.code}">${s.code}</a>`).join(' ');
    return `<tr><td><a href="https://github.com/${SITE.org}/${SITE.repo}/issues/${i.n}" target="_blank">#${i.n}</a></td><td class="todo-title">${esc(i.t)}</td><td>${chip(st)}</td><td>${esc(i.part || '')}</td><td>${esc(i.ms || '')}</td><td class="${late ? 'late' : ''}">${fmtDate(i.start)}${i.due ? ' → ' + fmtDate(i.due) : ''}</td><td>${pr}</td><td>${scr}</td></tr>`;
  }).join('');
  const btn = (k, v, label) => `<button class="${f[k] === v ? 'on' : ''}" data-f="${k}" data-v="${esc(v)}">${esc(label)}</button>`;
  const counts = Object.fromEntries(['week', 'doing', 'review', 'todo', 'done', 'ai'].map(s => [s, all.filter(i => statusOf(i.n) === s).length]));
  return `<div class="filters">${btn('status', '', '전체')}${['week', 'doing', 'review', 'todo', 'done', 'ai'].map(s => btn('status', s, `${STATUS_KO[s]} ${counts[s]}`)).join('')}</div>
  <div class="filters">${btn('ms', '', '마일스톤 전체')}${mss.map(m => btn('ms', m, m)).join('')}</div>
  <div class="filters">${btn('label', '', '라벨 전체')}${labels.map(l => btn('label', l, l)).join('')}</div>
  <div class="card" style="padding:0 6px"><table><tr><th>#</th><th>할 일</th><th>상태</th><th>파트</th><th>마일스톤</th><th>시작 → 목표</th><th>PR</th><th>화면</th></tr>${rows || '<tr><td colspan="8" class="muted">없음</td></tr>'}</table></div>
  <div class="muted" style="margin-top:8px">상태의 정답은 GitHub 보드. 여기서는 보기만 하고, 바꾸는 건 보드에서</div>`;
}

function rEnv() {
  const opts = ['done', 'doing', 'review', 'todo'];
  const setup = SETUP.map(([t, d], i) => { const v = envState[i] || d; return `<div class="check"><span class="dot ${v}" style="margin-top:7px"></span><span style="flex:1">${i + 1}. ${esc(t)}</span><select data-env="${i}">${opts.map(o => `<option value="${o}" ${o === v ? 'selected' : ''}>${STATUS_KO[o]}</option>`).join('')}</select></div>`; }).join('');
  const links = LINKS.map(([n, u]) => `<tr><td>${esc(n)}</td><td><a href="${u}" target="_blank">${esc(u.replace('https://', ''))}</a></td></tr>`).join('');
  const cmds = COMMANDS.map(([n, c]) => `<tr><td>${esc(n)}</td><td><code>${esc(c)}</code></td></tr>`).join('');
  return `<div class="grid2">
    <div class="card"><h2>세팅 10단계</h2>${setup}<div class="muted" style="margin-top:8px">상태는 이 브라우저에만 저장</div></div>
    <div class="card"><h2>링크</h2><table>${links}</table>
      <h3>GitHub 연결</h3><div class="row"><input class="tok" id="tok" type="password" placeholder="ghp_… (repo · read:project)" value="${esc(token)}"><button id="tokSave">저장</button><button id="tokClear">지우기</button></div>
      <div class="muted" style="margin-top:4px">classic 토큰: <code>repo</code> + <code>read:project</code>. 이 브라우저의 localStorage에만 저장되고 어디에도 보내지 않음(GitHub API 호출에만 씀)</div></div>
  </div>
  <div class="card" style="margin-top:14px"><h2>명령</h2><table>${cmds}</table>
    <h3>폴더</h3><table><tr><td><code>mobile/</code></td><td>앱. <code>src/app</code> 화면(파일 = 주소) · <code>src/features/*/api.ts</code> 데이터 · <code>modules/alarm-core</code> 네이티브</td></tr>
    <tr><td><code>supabase/</code></td><td>마이그레이션 · Edge Functions (#63 · #72)</td></tr><tr><td><code>tools/deps-graph/</code></td><td>모듈 의존 그래프 (#74)</td></tr>
    <tr><td><code>docs/</code></td><td>화면 ↔ 데이터 ↔ API 매핑 · 알람 코어 인터페이스 (#64)</td></tr></table></div>`;
}

function rDec() {
  return `<div class="card"><h2>정할 것 · 정한 것</h2><table><tr><th></th><th>무엇</th><th>지금</th><th>어디서</th><th>메모</th></tr>` +
    DECISIONS.map(([q, now, refs], i) => { const d = decState[i] || {}; return `<tr><td><input type="checkbox" data-dec="${i}" ${d.done ? 'checked' : ''} title="정함"></td><td style="${d.done ? 'color:var(--mute)' : ''}">${esc(q)}</td><td>${esc(now)}</td><td>${refs.map(r => `<a href="https://github.com/${SITE.org}/${SITE.repo}/issues/${r.slice(1)}" target="_blank">${r}</a>`).join(' ')}</td><td><textarea class="note" data-decnote="${i}" placeholder="정한 내용">${esc(d.note || '')}</textarea></td></tr>`; }).join('') +
    `</table><div class="muted" style="margin-top:8px">체크 · 메모는 이 브라우저에만 저장. 팀이 알아야 할 결정은 이슈 댓글이나 docs/에 PR로</div></div>`;
}

// ───────────────────────────────── GitHub 동기화
const GQL = `query($org:String!,$repo:String!,$num:Int!){
  organization(login:$org){ projectV2(number:$num){ items(first:100){ nodes{
    fieldValues(first:20){ nodes{
      ... on ProjectV2ItemFieldSingleSelectValue{ field{ ... on ProjectV2FieldCommon{ name } } name }
      ... on ProjectV2ItemFieldDateValue{ field{ ... on ProjectV2FieldCommon{ name } } date } } }
    content{ ... on Issue{ number title state milestone{ title } labels(first:10){ nodes{ name } } } } } } } }
  repository(owner:$org,name:$repo){ pullRequests(first:50,states:[OPEN],orderBy:{field:UPDATED_AT,direction:DESC}){ nodes{
    number title isDraft headRefName reviewDecision closingIssuesReferences(first:5){ nodes{ number } }
    commits(last:1){ nodes{ commit{ statusCheckRollup{ state } } } } } } } }`;
async function sync() {
  if (!token) { askToken(); return; }
  const b = document.getElementById('btnSync'); b.disabled = true; b.textContent = '동기화 중…';
  try {
    const H = { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' };
    const g = await fetch('https://api.github.com/graphql', { method: 'POST', headers: H, body: JSON.stringify({ query: GQL, variables: { org: SITE.org, repo: SITE.repo, num: SITE.project } }) }).then(r => r.json());
    if (g.errors) throw new Error(g.errors.map(e => e.message).join('; '));
    const items = g.data.organization.projectV2.items.nodes.map(it => {
      const fv = {}; for (const v of it.fieldValues.nodes) if (v.field) fv[v.field.name] = v.name ?? v.date;
      const c = it.content || {};
      return { n: c.number, t: c.title || '', st: c.state || 'DRAFT', status: fv['Status'], ms: c.milestone && c.milestone.title, start: fv['시작일'], due: fv['목표일'], part: fv['파트'], labels: c.labels ? c.labels.nodes.map(l => l.name) : [] };
    });
    const prs = g.data.repository.pullRequests.nodes.map(p => ({ number: p.number, title: p.title, state: 'OPEN', draft: p.isDraft, branch: p.headRefName, review: p.reviewDecision, closes: p.closingIssuesReferences.nodes.map(x => x.number), checks: p.commits.nodes[0]?.commit?.statusCheckRollup?.state || null }));
    const t = await fetch(`https://api.github.com/repos/${SITE.org}/${SITE.repo}/git/trees/main?recursive=1`, { headers: H }).then(r => r.json());
    const tree = (t.tree || []).filter(x => x.type === 'blob').map(x => x.path);
    live = { at: Date.now(), items, prs, tree }; LS.set('sync', live);
  } catch (e) { alert('동기화 실패: ' + e.message + '\n토큰 권한(repo · read:project)을 확인해 주세요.'); }
  b.disabled = false; b.textContent = '동기화'; render();
}
function askToken() {
  const v = prompt('GitHub classic 토큰 (repo · read:project). 이 브라우저에만 저장됩니다.', token || '');
  if (v === null) return; token = v.trim(); LS.set('ghToken', token); render(); if (token) sync();
}

// ───────────────────────────────── 이벤트
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-tab],[data-go],[data-sel],[data-f],[data-src],#btnSync,#btnToken,#btnSide,#btnReload,#tokSave,#tokClear');
  if (!el) return;
  if (el.dataset.tab) { tab = el.dataset.tab; LS.set('tab', tab); render(); return; }
  if (el.dataset.go !== undefined) { e.preventDefault(); const [t, s] = el.dataset.go.split(':'); tab = t; if (s) sel = s; LS.set('tab', tab); LS.set('sel', sel); render(); return; }
  if (el.dataset.sel) { e.preventDefault(); sel = el.dataset.sel; LS.set('sel', sel); render(); return; }
  if (el.dataset.f) { todoFilter[el.dataset.f] = el.dataset.v; LS.set('todoFilter', todoFilter); render(); return; }
  if (el.dataset.src) { document.querySelectorAll('.side .bar [data-src]').forEach(b => b.classList.toggle('on', b === el)); document.getElementById('frame').src = el.dataset.src; LS.set('src', el.dataset.src); return; }
  if (el.id === 'btnSync') sync();
  if (el.id === 'btnToken') askToken();
  if (el.id === 'btnSide') { const s = document.getElementById('side'); s.classList.toggle('show'); LS.set('side', s.classList.contains('show')); el.classList.toggle('on', s.classList.contains('show')); }
  if (el.id === 'btnReload') { const f = document.getElementById('frame'); f.src = f.src; }
  if (el.id === 'tokSave') { token = document.getElementById('tok').value.trim(); LS.set('ghToken', token); render(); if (token) sync(); }
  if (el.id === 'tokClear') { token = ''; LS.set('ghToken', ''); live = null; LS.set('sync', null); render(); }
});
document.addEventListener('change', (e) => {
  const el = e.target;
  if (el.dataset.env) { envState[el.dataset.env] = el.value; LS.set('env', envState); render(); }
  if (el.dataset.dec) { decState[el.dataset.dec] = { ...(decState[el.dataset.dec] || {}), done: el.checked }; LS.set('dec', decState); render(); }
});
document.addEventListener('input', (e) => {
  const el = e.target; if (el.dataset.decnote) { decState[el.dataset.decnote] = { ...(decState[el.dataset.decnote] || {}), note: el.value }; LS.set('dec', decState); }
});

// 시작
if (LS.get('side', false)) { document.getElementById('side').classList.add('show'); document.getElementById('btnSide').classList.add('on'); }
const src0 = LS.get('src', '/'); document.getElementById('frame').src = src0; document.querySelectorAll('.side .bar [data-src]').forEach(b => b.classList.toggle('on', b.dataset.src === src0));
render();
</script>
</body>
</html>
