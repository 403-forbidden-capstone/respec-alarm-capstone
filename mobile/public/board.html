<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Re:Spec 개발 보드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--ink:#1b1b1b;--sub:#5f5e5a;--mute:#74726b;--line:#e4e2db;--line2:#cfcdc5;--bg:#f6f5f1;--bg2:#e9e7df;--card:#fff;--teal:#1d9e75;--teal-ink:#085041;--teal-bg:#e1f5ee;--red:#a32d2d;--r:8px;--r-lg:12px;--hdr:92px}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Pretendard Variable",Pretendard,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg);font-size:14px;line-height:1.5;word-break:keep-all}
a{color:var(--ink);text-decoration:underline;text-decoration-color:var(--line2);text-underline-offset:2px}
a:hover{text-decoration-color:var(--ink)}
a.in{color:var(--teal-ink);text-decoration:none}a.in:hover{text-decoration:underline}
a[target=_blank]::after{content:"↗";font-size:10px;color:var(--mute);margin-left:2px;text-decoration:none;display:inline-block}
button{font:inherit;font-size:13px;color:var(--ink);background:#fff;border:1px solid var(--line2);border-radius:var(--r);padding:4px 10px;line-height:1.3;cursor:pointer}
button:hover{background:var(--bg)}button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
select{font:inherit;font-size:13px;border:1px solid var(--line2);border-radius:var(--r);padding:3px 6px;background:#fff;color:var(--ink)}
:focus-visible{outline:2px solid var(--teal);outline-offset:1px}
code,kbd{font-family:ui-monospace,Consolas,monospace;font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:1px 5px;user-select:all}
h2{font-size:16px;font-weight:600;margin:0 0 12px}
h3{font-size:13px;font-weight:600;margin:16px 0 6px;color:var(--ink)}
.muted{color:var(--mute)}.note{font-size:12px;color:var(--mute);margin-top:8px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.num{font-variant-numeric:tabular-nums}
.late{color:var(--red);font-weight:600}
/* 상단 */
.top{display:flex;align-items:center;gap:12px;height:46px;padding:0 16px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top h1{font-size:15px;font-weight:600;margin:0;white-space:nowrap}
.top .meta{font-size:13px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.top .meta b{color:var(--ink);font-weight:600}
#meta{flex:1}
.tabs{display:flex;gap:2px;height:46px;padding:0 12px;align-items:center;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:46px;z-index:5}
.tabs button{border:0;background:none;padding:6px 12px;border-radius:6px;color:var(--sub);font-size:14px}
.tabs button.on{background:var(--bg);color:var(--ink);font-weight:600}
/* 틀 */
.wrap{display:grid;grid-template-columns:minmax(0,1fr) auto;min-height:calc(100vh - var(--hdr))}
.main{padding:16px 20px;min-width:0}
.side{border-left:1px solid var(--line);background:#fff;padding:8px;display:none;position:sticky;top:var(--hdr);height:calc(100vh - var(--hdr));overflow:auto}
.side.show{display:block}
.side iframe{width:360px;height:min(740px,calc(100vh - 150px));border:1px solid var(--line2);border-radius:var(--r-lg);background:#fff;display:block}
.side .bar{display:flex;gap:6px;margin-bottom:8px;align-items:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px}
.card+.card{margin-top:12px}
.card.flush{padding:0 8px}
/* 칩 · 점 : 틸 = 끝났거나 끝나가는 것, 먹색 = 지금 손대는 것, 회색 = 아직 */
.chip{display:inline-block;font-size:12px;line-height:1.5;padding:1px 8px;border-radius:999px;border:1px solid transparent;vertical-align:1px;white-space:nowrap;text-decoration:none;font-variant-numeric:tabular-nums}
.chip.done{background:var(--teal-bg);color:var(--teal-ink)}
.chip.review{background:#fff;color:var(--teal-ink);border-color:var(--teal)}
.chip.doing{background:var(--ink);color:#fff}
.chip.week{background:var(--bg2);color:var(--ink);font-weight:600}
.chip.todo{background:#f1efe8;color:var(--sub)}
.chip.wait{background:#fff;color:var(--mute);border-color:var(--line2)}
.chip.ai{background:#fff;color:var(--mute);border:1px dashed var(--line2)}
.chip.tag{background:#fff;color:var(--ink);border-color:var(--line2)}
a.chip:hover{filter:brightness(.96);text-decoration:none}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:#d3d1c7;vertical-align:0;flex:none}
.dot.done{background:var(--teal)}.dot.review{background:#fff;box-shadow:inset 0 0 0 2px var(--teal)}.dot.doing{background:var(--ink)}.dot.week{background:#b5b2a8}
/* 표 */
table{border-collapse:collapse;width:100%;font-size:13px;line-height:1.45}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--sub);font-weight:500;white-space:nowrap;background:#fff}
table.sticky th{position:sticky;top:var(--hdr);z-index:1;box-shadow:0 1px 0 var(--line)}
tr:hover td{background:var(--bg)}
tr.grp td{background:var(--bg);color:var(--sub);font-weight:600;padding:5px 8px;border-bottom:0}
tr.grp:hover td{background:var(--bg)}
tr.islate td:first-child{box-shadow:inset 3px 0 var(--red)}
tr.dim td{opacity:.55}
.k{color:var(--sub);font-weight:600;font-size:12px;letter-spacing:.02em;white-space:nowrap}
/* 큰 그림 */
.now{margin-bottom:16px}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.stat{display:inline-block;padding:6px 12px;border:1px solid var(--line);border-radius:var(--r);color:var(--ink);text-decoration:none;font-size:13px}
.stat b{font-size:18px;margin-right:4px;font-variant-numeric:tabular-nums}
.stat:hover{background:var(--bg);text-decoration:none}
.stat.late b{color:var(--red)}
.next{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.next .i{color:var(--mute);font-style:normal}
.big{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.box{border:1px solid var(--line2);border-radius:var(--r-lg);padding:12px 16px;background:#fff}
.box h4{margin:0 0 8px;font-size:13px;font-weight:600;color:var(--sub)}
.node{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;padding:6px 10px;border:1px solid var(--line);border-radius:var(--r);margin:6px 0;background:#fff;font-size:14px}
button.node{cursor:pointer}button.node:hover{border-color:var(--line2);background:var(--bg)}
div.node{border-style:dashed;cursor:default}
.node small{color:var(--mute);font-size:12px}
.node>small:last-child{white-space:nowrap;text-align:right}
.node .dots .dot{margin:0 0 0 3px}
.arrow{color:var(--mute);text-align:center;font-size:12px;margin:8px 0 4px}
/* 화면 */
.screens{display:grid;grid-template-columns:200px minmax(0,1fr);gap:16px}
.tree{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);padding:8px 6px;position:sticky;top:calc(var(--hdr) + 16px);align-self:start;max-height:calc(100vh - var(--hdr) - 32px);overflow:auto}
.tree .g{font-size:12px;font-weight:600;color:var(--sub);padding:10px 8px 4px;display:flex;justify-content:space-between}
.tree .g span{font-weight:500;color:var(--mute)}
.tree .it{display:flex;align-items:center;width:100%;text-align:left;padding:5px 8px;border:0;border-radius:6px;background:none;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tree .it:hover{background:var(--bg)}
.tree .it.on{background:var(--teal-bg);color:var(--teal-ink);font-weight:600}
.kv td:first-child{color:var(--sub);width:72px;font-size:12px;white-space:nowrap;padding-top:8px}
/* 기능 */
.feat h2{display:flex;align-items:baseline;gap:10px}
.feat h2 .num{font-size:13px;color:var(--mute);margin-left:auto;font-weight:500}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0 12px}
.flow span{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:3px 8px;font-size:13px}
.flow span.scr{background:#fff;border-color:var(--line2);font-weight:500}
.flow i{color:var(--mute);font-style:normal}
.feat.ai{opacity:.7}
/* 매핑 */
.matrix-wrap{overflow:auto;max-height:calc(100vh - 190px);border:1px solid var(--line);border-radius:var(--r-lg);background:#fff}
.matrix th,.matrix td{white-space:nowrap;text-align:center;padding:2px 6px;border-left:1px solid #f1efe8}
.matrix thead th{position:sticky;top:0;background:#fff;z-index:2}
.matrix thead tr:first-child th{font-weight:600;background:var(--bg);text-align:center}
.matrix thead tr:nth-child(2) th{top:29px}
.matrix th.v{writing-mode:vertical-rl;transform:rotate(180deg);height:156px;font-size:12px;text-align:left;padding:8px 2px 4px;line-height:1}
.matrix td:first-child,.matrix th:first-child{text-align:left;position:sticky;left:0;background:#fff;font-weight:500;border-left:0;padding-left:10px;z-index:1}
.matrix thead th:first-child{z-index:3}
.matrix td.y{background:var(--teal-bg);color:var(--teal-ink);font-weight:700}
.matrix tr:hover td,.matrix tr:hover td:first-child{background:var(--bg)}
.matrix td.hl,.matrix th.hl{background:var(--teal-bg)}
.matrix tr.grp td{text-align:left;position:sticky;left:0}
details{margin-top:12px}summary{cursor:pointer;color:var(--sub);font-size:13px}
/* 할 일 */
.filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.filters button{padding:3px 9px;font-size:13px}
.filters button.on{background:var(--teal-bg);color:var(--teal-ink);border-color:transparent;font-weight:600}
.filters .reset{margin-left:4px;font-size:13px}
td.due{white-space:nowrap;font-variant-numeric:tabular-nums}
/* 환경 · 결정 */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.check{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
.check select{font-size:12px;padding:1px 4px}
input.tok{font:inherit;font-size:13px;border:1px solid var(--line2);border-radius:var(--r);padding:4px 8px;width:300px}
/* 결정: 한 줄 = 안건(누르면 펼침), 틸 테두리 = 먼저 고른 안 */
.dec-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:4px}
.dec-head h2{margin:0}.dec-head b{color:var(--ink);font-weight:600}
.dec-head .row{margin-left:auto}
.dec-g{margin-top:18px}
.dec-g>.k{padding-bottom:6px;border-bottom:1px solid var(--line2)}
.dec{border-bottom:1px solid var(--line)}
.dec-row{display:flex;align-items:center;gap:12px;cursor:pointer;border-radius:6px}
.dec-row:hover{background:var(--bg)}
.dec-tg{flex:1;min-width:0;display:flex;align-items:baseline;gap:10px;border:0;background:none;padding:9px 4px;text-align:left;font-size:14px;line-height:1.45}
.dec-tg:hover{background:none}
.dec-tg::before{content:"";flex:none;width:6px;height:6px;border-right:1.5px solid var(--mute);border-bottom:1.5px solid var(--mute);transform:translateY(-2px) rotate(-45deg);margin-left:4px;transition:transform .15s}
.dec.open .dec-tg::before{transform:translateY(-3px) rotate(45deg)}
.dec-id{flex:none;min-width:28px;font-family:ui-monospace,Consolas,monospace;font-size:12px;color:var(--mute)}
.dec-q{min-width:0}
.dec.open .dec-q{font-weight:600}
.dec-side{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end;font-size:13px;padding-right:6px}
.dec-res{color:var(--teal-ink);font-weight:500}
.dec-body{display:grid;gap:14px;padding:2px 12px 18px 52px;font-size:13px}
.dec-body h4{margin:0 0 6px;font-size:12px;font-weight:600;color:var(--sub)}
.dec-body p{margin:0;max-width:72ch}
.dec-body ul{margin:0;padding-left:18px}
.dec-meta{display:grid;grid-template-columns:auto 1fr;gap:3px 14px}
.dec-meta .k{padding-top:1px}
table.dec-t{max-width:760px}
table.dec-t td:first-child{width:34%;color:var(--sub)}
.dec-opts{display:grid;gap:6px;max-width:760px}
.dec-opt{display:grid;grid-template-columns:18px minmax(0,1fr);gap:10px;padding:8px 12px;border:1px solid var(--line);border-radius:var(--r);background:#fff;line-height:1.55}
.dec-opt.pick{border-color:var(--teal);background:var(--teal-bg)}
.dec-opt .key{font-family:ui-monospace,Consolas,monospace;font-weight:600;color:var(--teal-ink)}
@media (prefers-reduced-motion:reduce){.dec-tg::before{transition:none}}
@media (max-width:760px){.dec-row{flex-wrap:wrap;gap:0}.dec-side{justify-content:flex-start;padding:0 0 8px 46px}.dec-body{padding-left:8px}}
.cp{padding:1px 8px;font-size:12px;color:var(--sub)}
.wrap:has(.side.show) .grid2{grid-template-columns:1fr}
.wrap:has(.side.show) .screens{grid-template-columns:176px minmax(0,1fr)}
@media (max-width:1100px){.side iframe{zoom:.78}}
@media (max-width:760px){.wrap{grid-template-columns:1fr}.side{position:static;height:auto;border-left:0;border-top:1px solid var(--line)}.screens{grid-template-columns:1fr}.tree{position:static;max-height:none}.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="top">
  <h1>Re:Spec 개발 보드</h1>
  <span class="meta" id="meta"></span>
  <span class="meta" id="syncMeta"></span>
  <button id="btnSync">동기화</button>
  <button id="btnSide">앱 보기</button>
</div>
<div class="tabs" id="tabs" role="tablist"></div>
<div class="wrap">
  <div class="main" id="main"></div>
  <div class="side" id="side">
    <div class="bar">
      <button data-src="/" class="on">앱</button>
      <button data-src="/mockup.html">목업</button>
      <button data-src="/dev/ui">UI 부품</button>
      <span style="flex:1"></span>
      <button id="btnReload">새로고침</button>
    </div>
    <iframe id="frame" src="/" title="앱 미리보기"></iframe>
  </div>
</div>

<script>
// ───────────────────────────────── 데이터 (docs/screen-data-map.md · docs/alarm-core.md 기준)
const SITE = {
  web: 'https://respec-alarm-capstone.vmgfh878.workers.dev',
  org: '403-forbidden-capstone', repo: 'respec-alarm-capstone', project: 1,
  week1: '2026-10-05', demo1: '2026-10-19', contest: '2026-12-04',
};
const TABS = [
  ['home', '01 홈'], ['group', '02 그룹'], ['ai', '03 AI'], ['records', '04 기록'], ['common', '공통'],
];
// 표기: k = DB · RPC · Edge · 폰 · 배치 · Auth, r = 테이블 · 함수 이름
const SCREENS = [
  { code: 'H01', name: '홈', tab: 'home', route: '(tabs)/index', issues: [30], feat: ['①', '④', '②'],
    data: [
      { k: 'DB', t: '다음 알람 (루틴 알람이면 routines.title)', r: ['alarms', 'appointment_participants', 'appointments'] },
      { k: 'DB', t: '오늘 일정(저녁엔 내일)', r: ['appointment_participants', 'appointments'] },
      { k: 'DB', t: '오늘 루틴 · 진행', r: ['routines', 'alarm_events'] },
      { k: 'DB', t: '내일 준비물 체크', r: ['todos'] },
      { k: 'DB', t: '제안 카드 (PENDING)', r: ['alarm_suggestions'] },
      { k: 'RPC', t: '그룹 기상 요약', r: ['get_group_wake_status'] },
    ] },
  { code: 'H02', name: '알람 목록', tab: 'home', route: 'alarms', issues: [30], feat: ['①'],
    data: [
      { k: 'DB', t: '날짜별 알람', r: ['alarms', 'appointment_participants', 'appointments'] },
      { k: 'DB', t: '켜기 · 끄기', r: ['alarms'] },
      { k: '폰', t: '예약 취소 · 다시 예약', r: ['alarm-core'] },
    ] },
  { code: 'H03', name: '알람 설정', tab: 'home', route: 'alarm/[id]', issues: [30, 32], feat: ['①'],
    data: [
      { k: 'DB', t: '연결 일정 · 이동 조건 · 준비 시간', r: ['appointments', 'appointment_participants'] },
      { k: 'DB', t: '예측 준비(P80) 근거', r: ['v_prepare_time_stats'] },
      { k: 'Edge', t: '여유 시간 바꾸면 다시 계산 → 저장', r: ['alarm-suggest', 'alarm-commit'] },
      { k: 'DB', t: '강도 직접 고르기 → 다시 예약', r: ['alarms'] },
      { k: '폰', t: '다시 예약', r: ['alarm-core'] },
    ] },
  { code: 'H05', name: '새 일정', tab: 'home', route: 'schedule/new', issues: [31, 32], feat: ['①'],
    data: [
      { k: 'Edge', t: '장소 검색(카카오)', r: ['place-search'] },
      { k: 'Edge', t: '이동시간 · 알람 시각 · 강도 미리 보기', r: ['alarm-suggest'] },
      { k: 'Edge', t: '약속 · 참여 조건 · 알람 4종 한 번에 저장', r: ['alarm-commit', 'appointments', 'appointment_participants', 'alarms'] },
      { k: 'DB', t: '준비물', r: ['todos'] },
      { k: '폰', t: '예약', r: ['alarm-core'] },
    ] },
  { code: 'H07', name: '알람 울림', tab: 'home', route: 'ring', issues: [33], feat: ['①'],
    data: [
      { k: '폰', t: '소리 · 강도 · 미루기 · 해제', r: ['alarm-core'] },
      { k: 'DB', t: '기록(TRIGGERED · SNOOZED · DISMISSED), 오프라인이면 보관 후 전송', r: ['alarm_events'] },
      { k: 'DB', t: '무음 알림 원탭 → ACKNOWLEDGED · ARRIVAL_CONFIRMED + 출발 · 도착 시각 · 지각', r: ['alarm_events', 'appointment_participants'] },
    ] },
  { code: 'H08', name: '기상 확인', tab: 'home', route: 'wake', issues: [35, 40], feat: ['④'],
    data: [
      { k: '폰', t: '판정(폰 사용 · 버튼)', r: ['alarm-core'] },
      { k: 'DB', t: 'WAKE_CONFIRMED + 기상 시각', r: ['alarm_events', 'daily_records'] },
      { k: 'DB', t: '확인 알림 원탭 → ACKNOWLEDGED', r: ['alarm_events'] },
      { k: '배치', t: '끝까지 안 깨면 MISSED + 미확인 푸시', r: ['wake-check'] },
    ] },
  { code: 'F01·G01', name: '친구와 그룹', tab: 'group', route: '(tabs)/group', issues: [43, 44], feat: ['②'],
    data: [
      { k: 'DB', t: '친구 목록 · 받은 요청 · 수락', r: ['friends'] },
      { k: 'RPC', t: '이름 · 사진, 아이디 검색', r: ['get_public_profiles', 'find_profile_by_handle'] },
      { k: 'DB', t: '그룹 목록 · 만들기', r: ['groups', 'group_members'] },
      { k: 'RPC', t: '초대 코드로 참여, 오늘 기상 n명', r: ['join_group_by_invite_code', 'get_group_wake_status'] },
    ] },
  { code: 'F02', name: '친구 권한', tab: 'group', route: 'friends/[id]', issues: [44], feat: ['②'],
    data: [{ k: 'DB', t: '관계별 받은 권한 → 항목별 OR은 앱에서', r: ['sharing_permissions'] }] },
  { code: 'F03', name: '공유 권한 설정', tab: 'group', route: 'permissions', issues: [44], feat: ['②'],
    data: [{ k: 'DB', t: '내가 주는 권한 3종 · 받은 권한 보기', r: ['sharing_permissions'] }] },

function closesOf(p) { if (p.closes && p.closes.length) return p.closes; const m = /^[a-z]+\/(\d+)-/.exec(p.branch || ''); return m ? [Number(m[1])] : []; }

function plan() {

  const fileText = s.native ? '네이티브 화면 (alarm-core)' : f ? `<code>${esc(f.path)}</code> ${f.known ? (f.exists ? chip('done', 'main에 있음') : chip('todo', 'main에 없음')) : ''}` : '';

      ${openPrs.length ? `<tr><td>PR</td><td>${openPrs.map(p => `<a href="${ghPr(p.number)}" target="_blank" rel="noopener">#${p.number}</a> ${esc(p.title)} ${p.draft ? chip('wait', 'WIP') : ''} ${checkChip(p.checks)}`).join('<br>')}</td></tr>` : ''}

    </table>

    <table><tr><th style="width:56px">위치</th><th>용도</th><th>테이블 · 함수</th></tr>${rows}</table>
  </div></div>`;
}

function rFeatures() {
  const span = (f) => { const ds = f.issues.map(issue).filter(Boolean); const a = ds.map(i => i.start).filter(Boolean).sort()[0]; const b = ds.map(i => i.due).filter(Boolean).sort().pop(); return a ? `${fmtDate(a)}–${fmtDate(b || a)}` : ''; };
  const flowItem = (x) => {
    const sc = SCREENS.find(s => s.code.split('·').some(c => x.startsWith(c)));
    if (sc) return `<span class="scr"><a class="in" href="#" data-go="screens:${sc.code}">${esc(x)}</a></span>`;
    const m = /#(\d+)/.exec(x);
    if (m) return `<span>${esc(x.replace(/#\d+/, '').trim())} <a class="in" href="${ghIssue(m[1])}" target="_blank" rel="noopener">#${m[1]}</a></span>`;

      <h2><span class="dot ${groupStatus(f.issues, f.ai)}"></span>${i + 1}. ${esc(f.name)}${f.ai ? ' ' + chip('ai') : ''}<span class="num">${esc(f.ms)} · ${span(f)} · ${done}/${f.issues.length}</span></h2>

  }).join('');
}

function rTodo() {

  const mss = [...new Set(all.map(i => i.ms).filter(Boolean))].sort((a, b) => { const da = a.startsWith('창의'), db = b.startsWith('창의'); return da !== db ? (da ? 1 : -1) : a.localeCompare(b); });

  list.sort((a, b) => { const ga = GORDER.indexOf(grpOf(a)), gb = GORDER.indexOf(grpOf(b)); if (ga !== gb) return ga - gb; const x = a.due || '9', y = b.due || '9'; if (x !== y) return x < y ? -1 : 1; return ORDER[p.st[a.n]] - ORDER[p.st[b.n]]; });

    const st = p.st[i.n]; const late = g === '지연';
    const pr = prsOf(i.n).map(x => ` <a href="${ghPr(x.number)}" target="_blank" rel="noopener" title="${esc(x.title)}">PR #${x.number}</a>`).join('');
    const scr = SCREENS.filter(s => s.issues.includes(i.n)).map(s => `<a class="in" href="#" data-go="screens:${s.code}">${s.code}</a>`).join(' ');

    rows.push(`<tr class="${late ? 'islate' : ''} ${st === 'done' ? 'dim' : ''}"><td><a href="${ghIssue(i.n)}" target="_blank" rel="noopener">#${i.n}</a> ${esc(i.t)} <span class="muted" title="${esc(i.ms || '')}">${esc(msShort(i.ms))}</span></td><td>${chip(st)}${pr}</td><td>${esc(i.part || '')}</td><td class="due" title="${i.start ? '시작 ' + fmtDate(i.start) : ''}">${dueText}</td><td>${scr}</td></tr>`);
  }
  const btn = (k, v, label) => `<button class="${f[k] === v ? 'on' : ''}" data-f="${k}" data-v="${esc(v)}">${esc(label)}</button>`;
  const hasFilter = f.status || f.ms || f.label;
  return `<div class="filters">${btn('status', '', `전체 ${all.length}`)}${['doing', 'review', 'week', 'todo', 'ai', 'done'].map(s => btn('status', s, `${STATUS_KO[s]} ${p.counts[s]}`)).join('')}
    <select data-fsel="ms"><option value="">마일스톤</option>${mss.map(m => `<option value="${esc(m)}" ${f.ms === m ? 'selected' : ''}>${esc(msShort(m))}</option>`).join('')}</select>
    <select data-fsel="label"><option value="">라벨</option>${labels.map(l => `<option value="${esc(l)}" ${f.label === l ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>
    ${hasFilter ? '<a class="in reset" href="#" data-f="reset" data-v="">초기화</a>' : ''}</div>
  <div class="card flush"><table class="sticky"><tr><th>할 일</th><th>상태</th><th>파트</th><th>목표</th><th>화면</th></tr>${rows.join('') || '<tr><td colspan="5" class="muted">조건에 맞는 카드 없음 · <a class="in" href="#" data-f="reset" data-v="">필터 지우기</a></td></tr>'}</table></div>

// 결정: 원본 docs/decisions.md → DECISIONS. 한 줄 = 안건, 누르면 세부(지금 어긋난 곳 · 선택지 · 참고)
const DEC_GROUPS = ['정할 것', '보류', '정한 것'];
const DEC_DOC = `https://github.com/${SITE.org}/${SITE.repo}/blob/main/docs/decisions.md`;
// 문서 글줄 → HTML: `코드` · **굵게** · PR #n · #n (links=false면 링크 없이 — 버튼 안 제목용)
const inl = (s, links = true) => String(s || '').split(/(`[^`]+`)/).map((p) => /^`[^`]+`$/.test(p) ? `<code>${esc(p.slice(1, -1))}</code>`
  : esc(p).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/(PR )?#(\d+)/g, (m, pr, n) => links ? `<a href="${pr ? ghPr(n) : ghIssue(n)}" target="_blank" rel="noopener">${m}</a>` : m)).join('');
const decIssues = (d) => [...new Set((String(d.meta['이슈'] || '').match(/#\d+/g) || []).map((x) => Number(x.slice(1))))];
// 기한 = 연결 이슈 중 안 끝난 것의 가장 이른 시작일 (보드 날짜를 따라감)
const decDue = (d) => decIssues(d).map(issue).filter((it) => it && it.start && it.st !== 'CLOSED').map((it) => it.start).sort()[0] || '';
function decPart(p) {
  if (p.t === 'p') return `<p>${inl(p.v)}</p>`;
  if (p.t === 'ul') return `<ul>${p.v.map((x) => `<li>${inl(x)}</li>`).join('')}</ul>`;
  if (p.t === 'table') return `<table class="dec-t"><tr>${p.head.map((h) => `<th>${inl(h)}</th>`).join('')}</tr>${p.rows.map((r) => `<tr>${r.map((c) => `<td>${inl(c)}</td>`).join('')}</tr>`).join('')}</table>`;
  if (p.t === 'opts') return `<div class="dec-opts">${p.v.map((o) => `<div class="dec-opt${o.tag ? ' pick' : ''}"><span class="key">${esc(o.key)}</span><div>
    <div><b>${inl(o.name)}</b>${o.tag ? ` <span class="chip review">${esc(o.tag)}</span>` : ''}</div>${o.desc ? `<div>${inl(o.desc)}</div>` : ''}${o.sub.map((s) => `<div class="muted">${inl(s)}</div>`).join('')}</div></div>`).join('')}</div>`;
  return '';
}
function decRow(d) {
  const open = decOpen.has(d.id);
  const due = d.status === '정할 것' ? decDue(d) : '';
  const tail = d.status === '정한 것' ? `<span class="dec-res">${inl(d.meta['결과'])}</span>`
    : d.status === '보류' ? `<span class="muted">${inl(d.meta['보류 이유'])}</span>`
    : due ? `<span class="num ${due < todayS ? 'late' : 'muted'}" title="연결 이슈 시작일">~${fmtDate(due)}</span>` : '';
  const meta = Object.entries(d.meta).map(([k, v]) => `<span class="k">${esc(k)}</span><span>${inl(v)}${k === '기한' && due ? ` <span class="muted num">· ${fmtDate(due)}</span>` : ''}</span>`).join('');
  return `<div class="dec${open ? ' open' : ''}">
    <div class="dec-row" data-dec="${esc(d.id)}">
      <button class="dec-tg" aria-expanded="${open}" aria-controls="dec-${esc(d.id)}"><span class="dec-id">${esc(d.id)}</span><span class="dec-q">${inl(d.title, false)}</span></button>
      <span class="dec-side">${decIssues(d).map(issuePill).join('')}${tail}</span>
    </div>` +
    (open ? `<div class="dec-body" id="dec-${esc(d.id)}"><div class="dec-meta">${meta}</div>` +
      d.blocks.map((b) => `<div>${b.h ? `<h4>${esc(b.h)}</h4>` : ''}${b.parts.map(decPart).join('')}</div>`).join('') + `</div>` : '') +
    `</div>`;
}
function rDec() {
  const by = Object.fromEntries(DEC_GROUPS.map((g) => [g, DECISIONS.filter((d) => d.status === g)]));
  const head = `<div class="dec-head"><h2>결정</h2><span class="muted num">${DEC_GROUPS.map((g) => `${g} <b>${by[g].length}</b>`).join(' · ')}</span>
    <span class="row"><button data-decall="open">모두 펼치기</button><button data-decall="close">모두 접기</button></span></div>
    <div class="muted">원본 <a href="${DEC_DOC}" target="_blank" rel="noopener">docs/decisions.md</a> · 회의에서 정하면 결과를 적고 정한 것으로 옮김</div>`;
  if (!DECISIONS.length) return `<div class="card">${head}<p class="note">안건이 비어 있음 — <code>cd mobile && npm run board:decisions</code></p></div>`;
  return `<div class="card">${head}` + DEC_GROUPS.filter((g) => by[g].length).map((g) =>
    `<div class="dec-g"><div class="k">${g} <span class="num">${by[g].length}</span></div>${by[g].map(decRow).join('')}</div>`).join('') + `</div>`;
}

// ───────────────────────────────── GitHub 동기화
// 아래 질의 · 매핑은 mobile/scripts/board-snapshot.mjs와 같은 모양이어야 함 — 한쪽을 고치면 둘 다
const GQL = `query($org:String!,$repo:String!,$num:Int!){
  organization(login:$org){ projectV2(number:$num){ items(first:100){ nodes{
    fieldValues(first:20){ nodes{
      ... on ProjectV2ItemFieldSingleSelectValue{ field{ ... on ProjectV2FieldCommon{ name } } name }
      ... on ProjectV2ItemFieldDateValue{ field{ ... on ProjectV2FieldCommon{ name } } date } } }
    content{ ... on Issue{ number title state milestone{ title } labels(first:10){ nodes{ name } } } } } } } }
  repository(owner:$org,name:$repo){ pullRequests(first:50,states:[OPEN],orderBy:{field:UPDATED_AT,direction:DESC}){ nodes{
    number title isDraft headRefName reviewDecision closingIssuesReferences(first:5){ nodes{ number } }
    commits(last:1){ nodes{ commit{ statusCheckRollup{ state } } } } } } } }`;
async function sync() {
  if (!token) { askToken(); return; }
  const b = document.getElementById('btnSync'); b.disabled = true; b.textContent = '동기화 중…';
  try {
    const H = { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' };
    const gh = async (url, init) => { const r = await fetch(url, init); const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(`GitHub ${r.status}: ${j.message || r.statusText}`); return j; };
    const g = await gh('https://api.github.com/graphql', { method: 'POST', headers: H, body: JSON.stringify({ query: GQL, variables: { org: SITE.org, repo: SITE.repo, num: SITE.project } }) });
    if (g.errors) throw new Error(g.errors.map(e => e.message).join('; '));
    const items = g.data.organization.projectV2.items.nodes.map(it => {
      const fv = {}; for (const v of it.fieldValues.nodes) if (v.field) fv[v.field.name] = v.name ?? v.date;
      const c = it.content || {};
      return { n: c.number, t: c.title || '', st: c.state || 'DRAFT', status: fv['Status'], ms: c.milestone && c.milestone.title, start: fv['시작일'], due: fv['목표일'], part: fv['파트'], labels: c.labels ? c.labels.nodes.map(l => l.name) : [] };
    });
    const prs = g.data.repository.pullRequests.nodes.map(p => ({ number: p.number, title: p.title, state: 'OPEN', draft: p.isDraft, branch: p.headRefName, review: p.reviewDecision, closes: p.closingIssuesReferences.nodes.map(x => x.number), checks: p.commits.nodes[0]?.commit?.statusCheckRollup?.state || null }));
    const t = await gh(`https://api.github.com/repos/${SITE.org}/${SITE.repo}/git/trees/main?recursive=1`, { headers: H }).catch(() => null);
    const tree = t && t.tree ? t.tree.filter(x => x.type === 'blob').map(x => x.path) : null;
    live = { at: Date.now(), items, prs, tree }; LS.set('sync', live); syncError = '';
  } catch (e) { syncError = e.message; }
  b.disabled = false; b.textContent = '동기화'; render();
}
function askToken() {
  const v = prompt('GitHub fine-grained 토큰, 읽기 전용 (이 레포 Contents · Issues · Pull requests + 조직 Projects). 이 브라우저에만 저장됩니다.', token || '');
  if (v === null) return; token = v.trim(); LS.set('ghToken', token); render(); if (token) sync();
}
// 배포본은 빌드 때 만든 스냅샷을 먼저 읽음 (main에 머지될 때마다 갱신됨)
async function loadSnapshot() {
  try {
    const r = await fetch('./board-snapshot.json', { cache: 'no-store' });
    if (!r.ok) return;
    const j = await r.json();
    if (j && j.items) { SNAPSHOT = { at: Date.parse(j.at) || Date.now(), items: j.items, prs: j.prs || [], tree: j.tree || null }; render(); }
  } catch {}
}

// ───────────────────────────────── 이벤트
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-tab],[data-go],[data-sel],[data-f],[data-src],[data-copy],[data-dec],[data-decall],#btnSync,#btnSide,#btnReload,#tokSave,#tokClear');
  if (!el) return;
  if (el.dataset.tab) { tab = el.dataset.tab; LS.set('tab', tab); render(); return; }
  if (el.dataset.decall) { if (el.dataset.decall === 'open') DECISIONS.forEach((d) => decOpen.add(d.id)); else decOpen.clear(); LS.set('decOpen', [...decOpen]); render(); return; }
  if (el.dataset.dec) {
    if (e.target.closest('a')) return; // 줄 안 이슈 링크는 그대로 열림
    const id = el.dataset.dec; if (decOpen.has(id)) decOpen.delete(id); else decOpen.add(id);
    LS.set('decOpen', [...decOpen]); render();
    const b = document.querySelector(`.dec-row[data-dec="${CSS.escape(id)}"] .dec-tg`); if (b) b.focus({ preventScroll: true });
    return;
  }
  if (el.dataset.f !== undefined) {
    e.preventDefault();
    if (el.dataset.f === 'reset') todoFilter = { status: '', ms: '', label: '' }; else todoFilter[el.dataset.f] = el.dataset.v;
    LS.set('todoFilter', todoFilter);
    if (el.dataset.go !== undefined) { tab = el.dataset.go.split(':')[0]; LS.set('tab', tab); }
    render(); return;
  }
  if (el.dataset.go !== undefined) { e.preventDefault(); const [t, s] = el.dataset.go.split(':'); tab = t; if (s) sel = s; LS.set('tab', tab); LS.set('sel', sel); render(); return; }
  if (el.dataset.sel) { e.preventDefault(); sel = el.dataset.sel; LS.set('sel', sel); render(); const on = document.querySelector('.tree .it.on'); if (on) { on.focus(); on.scrollIntoView({ block: 'nearest' }); } return; }
  if (el.dataset.src) {
    e.preventDefault();
    const side = document.getElementById('side'); if (!side.classList.contains('show')) { side.classList.add('show'); LS.set('side', true); document.getElementById('btnSide').classList.add('on'); }
    document.querySelectorAll('.side .bar [data-src]').forEach(b => b.classList.toggle('on', b.dataset.src === el.dataset.src));
    document.getElementById('frame').src = el.dataset.src; LS.set('src', el.dataset.src); return;
  }
  if (el.dataset.copy !== undefined) { navigator.clipboard.writeText(el.dataset.copy).then(() => { el.textContent = '복사됨'; setTimeout(() => { el.textContent = '복사'; }, 1200); }); return; }
  if (el.id === 'btnSync') sync();
  if (el.id === 'btnSide') { const s = document.getElementById('side'); s.classList.toggle('show'); LS.set('side', s.classList.contains('show')); el.classList.toggle('on', s.classList.contains('show')); }
  if (el.id === 'btnReload') { const f = document.getElementById('frame'); f.src = f.src; }
  if (el.id === 'tokSave') { token = document.getElementById('tok').value.trim(); LS.set('ghToken', token); render(); if (token) sync(); }
  if (el.id === 'tokClear') { token = ''; LS.set('ghToken', ''); live = null; LS.set('sync', null); syncError = ''; render(); }
});
document.addEventListener('change', (e) => {
  const el = e.target;
  if (el.dataset.fsel) { todoFilter[el.dataset.fsel] = el.value; LS.set('todoFilter', todoFilter); render(); }
  if (el.dataset.env) { envState[el.dataset.env] = el.value; LS.set('env', envState); render(); }
});
// 화면 트리: ↑ ↓로 이동
document.addEventListener('keydown', (e) => {
  if (!e.target.closest || !e.target.closest('.tree')) return;
  if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
  const its = [...document.querySelectorAll('.tree .it')]; const i = its.findIndex(x => x.classList.contains('on'));
  const j = Math.max(0, Math.min(its.length - 1, i + (e.key === 'ArrowDown' ? 1 : -1)));
  if (j !== i) { e.preventDefault(); its[j].click(); }
});
// 매핑 표: 열 하이라이트
const main = document.getElementById('main');
main.addEventListener('mouseover', (e) => {
  const c = e.target.closest('.matrix td, .matrix th.v'); if (!c) return;
  const i = c.cellIndex; main.querySelectorAll('.matrix .hl').forEach(x => x.classList.remove('hl'));
  if (i === 0) return;
  main.querySelectorAll('.matrix tbody tr:not(.grp), .matrix thead tr:nth-child(2)').forEach(r => { const cell = r.children[i]; if (cell) cell.classList.add('hl'); });
});
main.addEventListener('mouseleave', () => main.querySelectorAll('.matrix .hl').forEach(x => x.classList.remove('hl')));

// 시작
if (LS.get('side', false)) { document.getElementById('side').classList.add('show'); document.getElementById('btnSide').classList.add('on'); }
const src0 = LS.get('src', '/'); document.getElementById('frame').src = src0; document.querySelectorAll('.side .bar [data-src]').forEach(b => b.classList.toggle('on', b.dataset.src === src0));
render();
loadSnapshot();
</script>
</body>
