<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Re:Spec 결정 안건</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
/* 한 줄 목록(번호 · 질문 · 기한) → 누르면 펼침, 안건마다 회의 기록 칸. 기록은 이 브라우저에 자동 저장 + .md로 내보내기
   안건 내용(DATA 줄)은 scripts/board-decisions.mjs가 docs/decisions.md에서 채움 — 손으로 고치지 않음 */
:root {
  --bg: #f6f7f7;
  --paper: #ffffff;
  --ink: #1a1d1e;
  --muted: #6b7377;
  --line: #e1e5e6;
  --soft: #eef1f1;
  --accent: #0f766e;
  --accent-soft: #e3f2ef;
  --hold: #8a6d1d;
  --hold-soft: #f6efd9;
  --done: #4b5563;
  --note: #fffdf5;
  --font: Pretendard, "Malgun Gothic", system-ui, sans-serif;
  --mono: ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121516; --paper: #1a1e1f; --ink: #e8ecec; --muted: #9aa3a6; --line: #2b3133; --soft: #22282a;
    --accent: #4fc1b3; --accent-soft: #173431; --hold: #d9b75c; --hold-soft: #332b14; --done: #a3abb3; --note: #1f2321;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html { color-scheme: light dark; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); margin: 0; font-size: 14px; line-height: 1.6; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 28px 64px; }
header h1 { font-size: 24px; margin: 0; letter-spacing: -.01em; }
header p { color: var(--muted); margin: 6px 0 0; max-width: 64ch; }
.stats { display: flex; gap: 10px; flex-wrap: wrap; margin: 18px 0 0; }
.stat { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px; display: flex; gap: 8px; align-items: baseline; }
.stat b { font-size: 20px; font-variant-numeric: tabular-nums; }
.stat span { color: var(--muted); font-size: 12px; }

.bar { position: sticky; top: 0; z-index: 2; background: var(--bg); padding-block: 14px 10px; margin-top: 18px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; border-bottom: 1px solid var(--line); }
.tabs { display: flex; background: var(--soft); border-radius: 9px; padding: 3px; }
.tabs button { border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 13px; padding: 5px 12px; border-radius: 7px; cursor: pointer; }
.tabs button[aria-pressed="true"] { background: var(--paper); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
.bar input[type="search"] { flex: 1 1 180px; min-width: 0; font: inherit; font-size: 13px; padding: 7px 11px; border: 1px solid var(--line); border-radius: 9px; background: var(--paper); color: var(--ink); }
.btn { border: 1px solid var(--line); background: var(--paper); color: var(--ink); font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 9px; cursor: pointer; white-space: nowrap; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.meeting { margin-top: 16px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.meeting label { font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: .04em; }
.bar .nm { font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center; white-space: nowrap; }
.bar .nm input { font: inherit; font-size: 13px; padding: 6px 9px; border: 1px solid var(--line); border-radius: 9px; background: var(--paper); color: var(--ink); width: 120px; }
.cmt { display: flex; flex-direction: column; gap: 8px; border-top: 1px dashed var(--line); padding-top: 12px; }
.meeting .cmt { border-top: 0; padding-top: 0; }
.cmt h3 { margin: 0; color: var(--accent); }
.cnt { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.thread { display: flex; flex-direction: column; gap: 6px; }
.c { background: var(--note); border: 1px solid var(--line); border-radius: 10px; padding: 8px 11px; }
.c.new { animation: cnew 1.6s ease-out; }
@keyframes cnew { from { background: var(--accent-soft); border-color: var(--accent); } }
.ch { display: flex; gap: 8px; align-items: baseline; font-size: 12.5px; }
.ch b { font-weight: 600; }
.ch time { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.cb { white-space: pre-wrap; word-break: break-word; margin-top: 2px; font-size: 13.5px; }
.cempty { color: var(--muted); font-size: 12.5px; margin: 0; }
.compose { display: flex; gap: 8px; align-items: flex-end; }
.compose textarea { min-height: 44px; flex: 1; }
.compose .btn { flex: none; padding: 9px 16px; }
.compose .btn:disabled { opacity: .6; cursor: default; }
.who { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; }
.who .sp { flex: 1; }
.meeting .who .nm { display: flex; gap: 6px; align-items: center; font-weight: 400; letter-spacing: 0; }
.who input { font: inherit; font-size: 13px; padding: 4px 8px; border: 1px solid var(--line); border-radius: 7px; background: var(--paper); color: var(--ink); width: 140px; }
.sync { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.sync::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.sync.live::before { background: #16a34a; }
.sync.off::before { background: #dc2626; }
.sync.wait::before { background: var(--hold); }
.banner { background: var(--hold-soft); border-radius: 9px; padding: 8px 10px; font-size: 13px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.banner[hidden] { display: none; }
.mstamp { font-size: 11.5px; color: var(--muted); text-align: right; min-height: 1em; }

h2.sec { font-size: 13px; letter-spacing: .06em; color: var(--muted); margin: 26px 0 8px; font-weight: 600; }
.list { display: flex; flex-direction: column; gap: 6px; }
details.d { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; }
details.d[open] { border-color: var(--accent); }
details.d summary { list-style: none; cursor: pointer; padding: 11px 14px; display: grid; grid-template-columns: auto 1fr auto; gap: 4px 12px; align-items: baseline; }
details.d summary::-webkit-details-marker { display: none; }
.id { display: inline-flex; align-items: center; justify-content: center; min-width: 46px; height: 22px; font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--muted); background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 0 8px; }
.ttl { font-weight: 600; min-width: 0; }
.due { color: var(--muted); font-size: 12px; white-space: nowrap; }
.peek { grid-column: 2 / -1; color: var(--muted); font-size: 12.5px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.peek b { color: var(--accent); font-weight: 600; margin-right: 6px; }
.body { padding: 14px 14px 16px; display: flex; flex-direction: column; gap: 14px; border-top: 1px solid var(--line); }
.meta { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12.5px; color: var(--muted); }
.meta b { color: var(--ink); font-weight: 500; }
.result { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; }
.result.hold { background: var(--hold-soft); }
.result.hold b { color: var(--hold); }
.rmeta { font-size: 12px; color: var(--muted); margin-top: 2px; }
/* 라벨은 전부 같은 회색 틀 — 코드 반영 상태만 앞의 작은 점 색으로: 반영 전(회색) · 반영 중(주황) · 반영됨(초록) · 코드 없음(빈 점) */
.chip.code::before { content: ""; width: 6px; height: 6px; border-radius: 50%; margin-right: 5px; background: var(--muted); flex: none; }
.chip.c1::before { background: #d97706; }
.chip.c2::before { background: #16a34a; }
.chip.c3::before { background: transparent; box-shadow: inset 0 0 0 1px var(--muted); }
.pickmark { font-size: 11.5px; font-weight: 600; color: var(--accent); margin-left: 8px; }
.opt.chosen { border-color: var(--accent); }
.vrow { grid-column: 2; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; margin-top: 6px; min-height: 0; }
.vrow:empty { display: none; }
.vbtn { font: inherit; font-size: 12px; font-weight: 500; height: 26px; padding: 0 10px; border-radius: 7px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); cursor: pointer; }
.vbtn:hover { border-color: var(--muted); }
.vbtn.on { border-color: var(--accent); color: var(--accent); font-weight: 600; }
.vn { font-size: 12px; font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
.vwho { font-size: 12px; color: var(--muted); }
.decide { display: flex; flex-direction: column; gap: 8px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; }
.decide .hint { font-size: 12px; color: var(--muted); }
.dact { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.dact .sp { flex: 1; }
.dform { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.dform .pick, .code-row .k { font-size: 12px; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
.dform select, .dform input, .code-row select, .code-row input { font: inherit; font-size: 13px; padding: 6px 9px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); }
.dform input[data-dresult] { flex: 1 1 240px; min-width: 0; }
.code-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; flex: 1 1 auto; }
.code-row .chip { margin-left: 0; }
.code-row input { width: 110px; }
.btn.ghost { background: transparent; }
.result b { color: var(--accent); }
h3 { font-size: 12px; letter-spacing: .05em; color: var(--muted); margin: 0 0 6px; font-weight: 600; }
.tbl { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12px; color: var(--muted); font-weight: 500; background: var(--soft); }
td:first-child { white-space: nowrap; font-weight: 500; }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; }
.opt .k { font-weight: 700; color: var(--muted); grid-row: span 4; }
.opt .nm { font-weight: 600; min-width: 0; }
.tag, .op-chip, .chip { display: inline-flex; align-items: center; height: 20px; font-size: 11.5px; font-weight: 600; line-height: 1; border-radius: 6px; padding: 0 7px; margin-left: 6px; border: 1px solid var(--line); color: var(--muted); background: var(--paper); vertical-align: 2px; white-space: nowrap; }
.opt .ds { min-width: 0; }
.opt ul { margin: 4px 0 0; padding-left: 16px; color: var(--muted); font-size: 13px; }
.opt li.todo { color: var(--ink); list-style: none; margin-left: -16px; }
.opt li.todo::before { content: "할 일"; color: var(--accent); font-size: 11px; font-weight: 600; margin-right: 6px; }
ul.plain { margin: 0; padding-left: 18px; }
p.par { margin: 0; color: var(--muted); }
code { font-family: var(--mono); font-size: .9em; background: var(--soft); border-radius: 4px; padding: 0 4px; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

.notebox { background: var(--note); border: 1px dashed var(--accent); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
.notebox .hd { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.notebox .hd span { font-size: 11.5px; color: var(--muted); }
textarea { width: 100%; min-height: 84px; resize: vertical; font: inherit; font-size: 13.5px; line-height: 1.6; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); }
.opinion { border-left: 3px solid var(--accent); background: var(--accent-soft); border-radius: 0 10px 10px 0; padding: 10px 12px; }
.opinion h3 { color: var(--accent); }
.situ { background: var(--soft); border-radius: 10px; padding: 10px 12px; }
.situ p.par, .situ ul.plain { color: var(--ink); }
.op-chip { }

/* 펼치면 오른쪽에 화면: 목업(목업.html) · 추가 화면 와이어프레임 · 피그마 캡처 · 앱 웹 미리보기 */
:root { --s: .74; --mark: #f5a524; }
@media (max-height: 860px) { :root { --s: .64; } }
@media (max-height: 720px) { :root { --s: .54; } }
.body.has-shot { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px 24px; align-items: start; }
.txt { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.shot { position: sticky; top: 64px; width: calc(390px * var(--s) + 12px); display: flex; flex-direction: column; gap: 8px; }
.shot-tabs { display: flex; flex-wrap: wrap; gap: 4px; }
.shot-tabs button { font: inherit; font-size: 11.5px; line-height: 1.4; border: 1px solid var(--line); background: var(--paper); color: var(--muted); border-radius: 7px; padding: 3px 8px; cursor: pointer; text-align: left; }
.shot-tabs button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); font-weight: 600; }
.phone { width: calc(390px * var(--s) + 12px); height: calc(844px * var(--s) + 12px); border: 6px solid #1b1d1c; border-radius: calc(46px * var(--s) + 6px); overflow: hidden; background: #f6f6f4; position: relative; }
.phone iframe { width: 390px; height: 844px; border: 0; display: block; transform: scale(var(--s)); transform-origin: 0 0; }
.phone img { width: 100%; height: 100%; display: block; object-fit: cover; object-position: top; }
.shot-cap { font-size: 11.5px; color: var(--muted); margin: 0; display: flex; justify-content: space-between; gap: 8px; }
.shot-cap .mk::before { content: ""; display: inline-block; width: 9px; height: 9px; border: 2px solid var(--mark); border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
@media (max-width: 900px) {
  .body.has-shot { grid-template-columns: 1fr; }
  .shot { position: static; justify-self: center; }
}
.empty { color: var(--muted); padding: 24px 0; text-align: center; }
footer { margin-top: 36px; color: var(--muted); font-size: 12px; display: flex; flex-direction: column; gap: 4px; }
.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 9px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.on { opacity: 1; }
@media (max-width: 560px) {
  details.d summary { grid-template-columns: auto 1fr; }
  .due { grid-column: 2; }
}
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>결정 안건</h1>
    <p>줄을 누르면 상황 · 선택지와 그 안건의 화면이 떠요(노란 테두리 = 안건이 가리키는 곳). 안건마다 아래 "의견"에 이름과 함께 남기면, 같은 링크를 연 사람 모두에게 바로 보여요. 선택지마다 투표할 수 있고, 한 안이 3표가 되면 자동으로 "정한 것"으로 옮겨져요. 직접 옮길 땐 고른 안과 결과를 적고 "정한 것으로 이동".</p>
    <div class="stats" id="stats"></div>
  </header>

  <div class="bar">
    <div class="tabs" role="group" aria-label="상태">
      <button type="button" data-f="all" aria-pressed="true">전체</button>
      <button type="button" data-f="정할 것" aria-pressed="false">정할 것</button>
      <button type="button" data-f="보류" aria-pressed="false">보류</button>
      <button type="button" data-f="정한 것" aria-pressed="false">정한 것</button>
      <button type="button" data-f="noted" aria-pressed="false">의견 있음</button>
    </div>
    <input id="q" type="search" placeholder="찾기: 번호 · 화면 · 이슈 · 의견 (예: H03, #25)" aria-label="찾기">
    <button type="button" class="btn" id="toggleAll">모두 펼치기</button>
    <label class="nm">내 이름 <input id="myName" maxlength="30" placeholder="의견에 남을 이름" autocomplete="nickname"></label>
    <span class="sync" id="sync" role="status"></span>
  </div>

  <div class="meeting" id="meetingCmt"></div>

  <main id="out"></main>
  <footer id="foot"></footer>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

// ---- 앱 화면(web)에서 가리키는 곳 — 목업 hl과 같은 노란 테두리 ----
// 같은 사이트일 때만 iframe 안을 읽을 수 있음(배포 /decisions). 로컬 사본처럼 주소가 다르면 화면만 보임
function findInApp(doc, spec) {
  // 선택자를 잘못 적어도 그 화면의 다시 붙이기가 멈추지 않게
  const pick = (fn) => { try { return fn(); } catch { return null; } };
  if (spec.startsWith('@')) return pick(() => doc.querySelector(spec.slice(1)));
  const [text, up] = spec.split('^');
  let el = null;
  for (const exact of [true, false]) {
    const walk = doc.createTreeWalker(doc.body, NodeFilter.SHOW_TEXT);
    for (let n = walk.nextNode(); n && !el; n = walk.nextNode()) {
      const v = n.nodeValue.trim();
      if (exact ? v === text : v.includes(text)) el = n.parentElement;
    }
    if (el) break;
  }
  if (!el || up === undefined) return el;
  // 글자^숫자 = 그만큼 위 상자, 글자^선택자 = 그 글자를 감싼 선택자 상자 (목업과 같은 꼴)
  if (/^\d+$/.test(up)) {
    for (let i = 0; i < +up && el.parentElement; i++) el = el.parentElement;
    return el;
  }
  if (up !== '') return pick(() => el.closest(up)) || el;
  // 글자^ = 그 글자를 감싼 카드 (배경 · 테두리 · 둥근 모서리가 있는 가장 가까운 상자)
  for (let p = el.parentElement, i = 0; p && i < 8; p = p.parentElement, i++) {
    const cs = doc.defaultView.getComputedStyle(p);
    const bg = cs.backgroundColor;
    if ((bg !== 'rgba(0, 0, 0, 0)' && bg !== 'transparent') || parseFloat(cs.borderTopWidth) > 0 || parseFloat(cs.borderTopLeftRadius) > 0) return p;
  }
  return el;
}
// 바깥 페이지는 움직이지 않고 앱 안 스크롤만 옮김
function scrollInApp(doc, el) {
  for (let p = el.parentElement; p; p = p.parentElement) {
    const oy = doc.defaultView.getComputedStyle(p).overflowY;
    if (/(auto|scroll)/.test(oy) && p.scrollHeight > p.clientHeight) {
      const r = el.getBoundingClientRect();
      const pr = p.getBoundingClientRect();
      p.scrollTop += r.top - pr.top - Math.max(0, (p.clientHeight - r.height) / 2);
      return;
    }
  }
}
function pointInApp(frame, hl) {
  let tries = 0;
  let scrolled = false;
  const tick = () => {
    let doc;
    try { doc = frame.contentDocument; } catch { return; }
    if (!doc || !doc.body || !frame.isConnected) return;
    if (!doc.getElementById('hl-style')) {
      const st = doc.createElement('style');
      st.id = 'hl-style';
      st.textContent = '[data-hl]{outline:3px solid #f5a524!important;outline-offset:3px;animation:hlPulse 1.4s ease-in-out 3}@keyframes hlPulse{50%{outline-color:rgba(245,165,36,.25)}}';
      doc.head.appendChild(st);
    }
    const found = hl.split('|').map((h) => findInApp(doc, h)).filter(Boolean);
    found.forEach((el) => el.setAttribute('data-hl', ''));
    if (found.length && !scrolled) { scrollInApp(doc, found[0]); scrolled = true; }
    // 앱이 그리는 동안 · 다시 그리면 표시가 지워져서 몇 초 동안 다시 붙임
    if (++tries < 16) setTimeout(tick, 500);
  };
  frame.addEventListener('load', () => setTimeout(tick, 300));
}

  const who = Object.keys(v).filter((n) => v[n] === key);
  const names = who.length ? `<span class="vn">${who.length}표</span><span class="vwho">${who.map(esc).join(' · ')}</span>` : '';
  if (s === '정한 것') return names;
  const mine = myName && v[myName] === key;
  return `<button type="button" class="vbtn${mine ? ' on' : ''}" data-vote="${id}|${bi}|${key}">${mine ? '✓ 내 표' : '투표'}</button>${names}`;
}
function refreshVotes(id) {
  const d = DATA.find((x) => x.id === id);
  if (!d) return;
  document.querySelectorAll(`[data-vrow^="${id}|"]`).forEach((el) => { const [, bi, key] = el.dataset.vrow.split('|'); el.innerHTML = voteRow(id, +bi, key, statusOf(d)); });
  const det = document.getElementById(id);
  if (det) { const sum = det.querySelector('summary'); const old = sum.querySelector('.chip.vote'); if (old) old.remove(); const n = voteCount(id); if (n && statusOf(d) !== '정한 것') sum.querySelector('.ttl').insertAdjacentHTML('beforeend', `<span class="chip vote">투표 ${n}</span>`); }
}
function decideHtml(d) {
  const s = statusOf(d);
  if (s === '정한 것') {
    const c = codeOf(d);
    return `<div class="decide"><div class="dact code-row"><span class="k">코드 반영</span>
      <select data-code="${d.id}" aria-label="코드 반영 상태">${CODE.map((x) => `<option${x === c.s ? ' selected' : ''}>${x}</option>`).join('')}</select>
      <input data-coderef="${d.id}" value="${esc(c.ref)}" maxlength="40" placeholder="PR #번호" aria-label="PR 번호">
      <button type="button" class="btn" data-codesave="${d.id}">라벨 저장</button><span class="sp"></span>
      <button type="button" class="btn ghost" data-reopen="${d.id}">다시 정할 것으로</button></div></div>`;
  }
  const bl = optBlocks(d);
  const picks = bl.map((b, i) => {
    const bi = bl.length > 1 ? i + 1 : 0;
    const label = bl.length > 1 ? (b.h.replace(/^선택지\s*/, '').replace(/[()]/g, '') || '질문 ' + bi) : '고른 안';
    return `<label class="pick">${esc(label)} <select data-pick="${d.id}" data-bi="${bi}"><option value="">고르기</option>${optsOf(b).map((o) => `<option value="${o.key}">${o.key}. ${esc(o.name.replace(/\*\*|`/g, ''))}</option>`).join('')}</select></label>`;
  }).join('');
  const hint = bl.length === 1 ? `고른 안 · 결과를 적고 이동, 또는 한 안이 ${VOTE_GOAL}표가 되면 자동으로 정한 것` : bl.length > 1 ? '질문마다 고른 안을 적고 이동 (질문이 여러 개라 투표로는 자동 이동 안 함)' : '결과를 적고 이동';
  return `<div class="decide">
    <div class="dform" data-dform="${d.id}">${picks}
      <input data-dresult="${d.id}" maxlength="500" placeholder="결과 한 줄 — 어떻게 정했는지 (보류면 보류 이유)" value="${esc(drafts['r:' + d.id] || '')}"></div>
    <div class="dact"><button type="button" class="btn" data-decide="${d.id}">정한 것으로 이동</button>${s === '보류' ? `<button type="button" class="btn" data-reopen="${d.id}">다시 정할 것으로</button>` : `<button type="button" class="btn" data-hold="${d.id}">보류로</button>`}<span class="hint">${hint}</span></div></div>`;
}
function renderStats() {
  document.getElementById('stats').innerHTML = ORDER.map((s) => `<div class="stat"><b>${DATA.filter((d) => statusOf(d) === s).length}</b><span>${s}</span></div>`).join('');
}

function peekOf(d) {
  const st = states[d.id];
  if (st && st.status === '정한 것' && st.via !== '문서' && (st.choice || st.result)) return `<span class="peek"><b>정한 안</b>${esc(st.choice ? choiceLabel(d, st.choice) : st.result)}</span>`;
  const l = listOf(d.id);
  if (l.length) { const c = l[l.length - 1]; return `<span class="peek"><b>의견 ${l.length}</b>${esc(c.author)}: ${esc(c.body.split('\n')[0])}</span>`; }
  if (statusOf(d) === '정한 것' && d.meta['결과']) return `<span class="peek">결과: ${plain(d.meta['결과'])}</span>`;
  return '';
}
// ---- 회의 화면에서 뺄 것: 코드 · PR · 이슈 이야기 (전체는 docs/decisions.md 그대로) ----
const HIDE_BLOCK = /^지금 어긋난 곳$/;
const hasCode = (t) => /`/.test(String(t || ''));
// "(PR #104 리뷰)" · "#46 시작 전" · "· #60" 같은 이슈 · PR 번호를 지움
const noRefs = (t) => String(t || '')
  .replace(/\s*\([^()]*#\d+[^()]*\)/g, '')
  .replace(/\s*·?\s*(?:PR\s*)?#\d+(?:\s*·\s*(?:PR\s*)?#\d+)*/g, '')
  .replace(/\s{2,}/g, ' ').trim();
const plain = (t) => inl(noRefs(String(t || '').replace(/`/g, '')));
function cleanPart(p) {
  if (p.t === 'p') return hasCode(p.v) || /^지금 코드/.test(p.v) ? null : { ...p, v: noRefs(p.v) };
  if (p.t === 'ul') { const v = p.v.filter((x) => !hasCode(x)).map(noRefs).filter(Boolean); return v.length ? { ...p, v } : null; }
  if (p.t === 'table') { const rows = p.rows.filter((r) => !r.some(hasCode)).map((r) => r.map(noRefs)); return rows.length ? { ...p, rows } : null; }
  if (p.t === 'opts') return { ...p, v: p.v.map((o) => ({ ...o, desc: hasCode(o.desc) ? '' : noRefs(o.desc), sub: [], tag: '' })) };
  return p;
}

function itemHtml(d) {
  const isOp = (b) => /의견/.test(b.h);
  const cls = (b) => (isOp(b) ? ' class="opinion"' : b.h === '무슨 상황' ? ' class="situ"' : '');
  const head = (b) => (isOp(b) ? '문서에 적은 의견' : b.h);
  const part = (b) => (p) => (p.t === 'opts' ? `<div class="opts">${p.v.map((o) => optHtml(o, d, blockNo(d, b))).join('')}</div>` : partHtml(p));
  const view = d.blocks.filter((b) => !HIDE_BLOCK.test(b.h)).map((b) => ({ b, parts: b.parts.map(cleanPart).filter(Boolean) })).filter((x) => x.parts.length);
  const blocks = view.map(({ b, parts }) => `<section${cls(b)}>${b.h ? `<h3>${esc(head(b))}</h3>` : ''}${parts.map(part(b)).join('')}</section>`).join('');
  const s = statusOf(d);
  const n = voteCount(d.id);
  const badge = s === '정한 것' ? codeChip(codeOf(d)) : n ? `<span class="chip vote">투표 ${n}</span>` : '';
  const op = d.blocks.some(isOp) ? '<span class="op-chip">문서 의견</span>' : '';
  const shot = SCREENS[d.id] ? shotHtml(d) : '';
  return `<details class="d st-${s.replace(/\s/g, '')}" id="${d.id}">
    <summary><span class="id">${d.id}</span><span class="ttl">${plain(d.title)}${op}${badge}</span><span class="due"></span>${peekOf(d)}</summary>
    <div class="body${shot ? ' has-shot' : ''}"><div class="txt">${resultHtml(d)}${decideHtml(d)}${blocks}
      ${cmtHtml(d.id, '의견')}
    </div>${shot}</div>
  </details>`;
}

let filter = 'all';
function render() {
  const q = document.getElementById('q').value.trim().toLowerCase();
  const openIds = new Set([...document.querySelectorAll('details.d[open]')].map((d) => d.id));
  let html = '';
  for (const s of ORDER) {
    const items = DATA.filter((d) => statusOf(d) === s
      && (filter === 'all' || filter === s || (filter === 'noted' && listOf(d.id).length))
      && (!q || (JSON.stringify(d) + listOf(d.id).map((c) => c.author + ' ' + c.body).join(' ')).toLowerCase().includes(q)));
    if (!items.length) continue;
    html += `<h2 class="sec">${esc(s)} · ${items.length}</h2><div class="list">${items.map(itemHtml).join('')}</div>`;
  }
  const out = document.getElementById('out');
  out.innerHTML = html || '<p class="empty">맞는 안건이 없어요.</p>';
  openIds.forEach((id) => { const el = document.getElementById(id); if (el) el.open = true; });
  out.querySelectorAll('textarea').forEach(fit);
  document.getElementById('toggleAll').textContent = '모두 펼치기';
  renderStats();
}
function fit(t) { t.style.height = 'auto'; t.style.height = Math.max(44, t.scrollHeight + 2) + 'px'; }

// 이름 · 남길 글 (남길 글은 이 브라우저에 보관 — 새로 고침해도 그대로)
document.addEventListener('input', (e) => {
  const t = e.target;
  if (t.id === 'myName') { myName = t.value.trim(); try { localStorage.setItem(NAME_KEY, myName); } catch (err) { /* 이번만 */ } return; }
  if (!t.dataset || !t.dataset.draft) return;
  const k = t.dataset.draft;
  drafts[k] = t.value;
  saveDrafts();
  fit(t);
});
document.addEventListener('keydown', (e) => {
  const t = e.target;
  if (t.dataset && t.dataset.draft && e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); post(t.dataset.draft); }
});
document.addEventListener('click', (e) => {
  const b = e.target.closest && e.target.closest('[data-post]');
  if (b) post(b.dataset.post);
});
async function post(k) {
  const ta = document.querySelector(`textarea[data-draft="${k}"]`);
  const btn = document.querySelector(`[data-post="${k}"]`);
  const body = (drafts[k] || '').trim();
  if (!body) { if (ta) ta.focus(); return; }
  if (!myName) { document.getElementById('myName').focus(); toast('위 "내 이름"을 먼저 적어 주세요.'); return; }
  if (!online) { toast('연결이 안 돼서 못 남겨요. 새로 고침해 주세요. (적은 글은 그대로 있어요)'); return; }
  if (btn) { btn.disabled = true; btn.textContent = '남기는 중…'; }
  const { data, error } = await sb.from('decision_comments').insert({ decision_id: k, author: myName.slice(0, 30), body }).select().single();
  if (btn) { btn.disabled = false; btn.textContent = '남기기'; }
  if (error) { console.warn('의견 못 남김', error); toast('못 남겼어요. 잠시 뒤 다시 눌러 주세요. (적은 글은 그대로 있어요)'); return; }
  drafts[k] = '';
  saveDrafts();
  document.querySelectorAll(`textarea[data-draft="${k}"]`).forEach((x) => { x.value = ''; fit(x); });
  addComment(data, true);
  toast('남겼어요');
}
async function fetchAll() {
  const [cm, vt, stt] = await Promise.all([
    sb.from('decision_comments').select('id, decision_id, author, body, created_at').order('created_at').order('id'),
    sb.from('decision_votes').select('decision_id, block, voter, option_key, created_at'),
    sb.from('decision_states').select('*'),
  ]);
  if (cm.error) throw cm.error;
  // 투표 · 상태 표가 아직 없거나 못 읽어도 의견은 그대로 (투표 · 이동만 안 됨)
  if (vt.error || stt.error) console.warn('투표 · 상태 못 읽음', vt.error || stt.error);
  votes = {};
  for (const v of vt.data || [])((votes[v.decision_id] = votes[v.decision_id] || {})[v.block] = votes[v.decision_id][v.block] || {})[v.voter] = v.option_key;
  states = {};
  for (const x of stt.data || []) states[x.decision_id] = x;
  const data = cm.data;
  comments = {};
  seen.clear();
  for (const c of data) { seen.add(c.id); (comments[c.decision_id] = comments[c.decision_id] || []).push(c); }
}
function refreshAll() {
  document.getElementById('meetingCmt').innerHTML = cmtHtml('_meeting', '회의 전체 의견');
  render();
}
async function connect() {
  setSync('wait');
  try {
    if (!window.supabase) throw new Error('supabase-js를 못 불러옴');
    sb = window.supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: false, autoRefreshToken: false } });
    await fetchAll();
    online = true;
    refreshAll();
    let first = true;
    sb.channel('decision-live')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'decision_comments' }, (p) => addComment(p.new, true))
      .on('postgres_changes', { event: '*', schema: 'public', table: 'decision_votes' }, onVote)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'decision_states' }, onState)
      .subscribe(async (st) => {
        if (st === 'SUBSCRIBED') {
          setSync('live');
          // 끊겼다 다시 붙으면 그사이 남긴 것 받기
          if (!first) { try { await fetchAll(); refreshAll(); } catch (err) { /* 다음 연결 때 */ } }
          first = false;
        } else if (st === 'CHANNEL_ERROR' || st === 'TIMED_OUT' || st === 'CLOSED') setSync('wait');
      });
  } catch (err) {
    console.warn('의견 연결 안 됨', err);
    online = false;
    setSync('off');
  }
}
// 표 · 상태가 바뀜 (실시간)
function onVote(p) {
  const v = p.eventType === 'DELETE' ? p.old : p.new;
  if (!v || !v.decision_id) return;
  const box = ((votes[v.decision_id] = votes[v.decision_id] || {})[v.block] = votes[v.decision_id][v.block] || {});
  // 지울 땐 RLS 때문에 키(안건 · 질문 · 이름)만 옴 → 고른 안과 상관없이 그 사람 표를 지움
  if (p.eventType === 'DELETE') delete box[v.voter]; else box[v.voter] = v.option_key;
  refreshVotes(v.decision_id);
}
function onState(p) {
  if (!p.new || !p.new.decision_id) return;
  states[p.new.decision_id] = p.new;
  if (p.new.status === '정할 것') delete votes[p.new.decision_id]; // 다시 정할 것이면 서버가 표를 비움
  render();
}
function needName() {
  if (myName) return false;
  document.getElementById('myName').focus();
  toast('위 "내 이름"을 먼저 적어 주세요.');
  return true;
}
function needOnline() {
  if (online) return false;
  toast('연결이 안 돼서 못 바꿔요. 새로 고침해 주세요.');
  return true;
}
async function castVote(id, bi, key) {
  if (needName() || needOnline()) return;
  const box = ((votes[id] = votes[id] || {})[bi] = votes[id][bi] || {});
  const cancel = box[myName] === key;
  if (cancel) delete box[myName]; else box[myName] = key;
  refreshVotes(id);
  const res = cancel
    ? await sb.from('decision_votes').delete().match({ decision_id: id, block: bi, voter: myName })
    : await sb.from('decision_votes').upsert({ decision_id: id, block: bi, voter: myName.slice(0, 30), option_key: key }, { onConflict: 'decision_id,block,voter' });
  if (res.error) { console.warn('투표 못 함', res.error); toast('투표가 안 됐어요. 잠시 뒤 다시 눌러 주세요.'); try { await fetchAll(); render(); } catch (e) { /* 그대로 */ } return; }
  toast(cancel ? '투표를 취소했어요' : `${key}안에 투표했어요`);
}
async function setState(id, patch, msg) {
  if (needName() || needOnline()) return false;
  const { data, error } = await sb.from('decision_states')
    .upsert({ decision_id: id, updated_by: myName.slice(0, 30), ...patch }, { onConflict: 'decision_id', defaultToNull: false })
    .select().single();
  if (error) { console.warn('상태 못 바꿈', error); toast('못 바꿨어요. 잠시 뒤 다시 눌러 주세요.'); return false; }
  states[id] = data;
  if (data.status === '정할 것') delete votes[id];
  delete drafts['r:' + id];
  saveDrafts();
  render();
  toast(msg);
  return true;
}
function decide(id) {
  const d = DATA.find((x) => x.id === id);
  const picks = [...document.querySelectorAll(`select[data-pick="${id}"]`)];
  const result = (drafts['r:' + id] || '').trim();
  const multi = picks.length > 1;
  const chosen = picks.map((sel) => (sel.value ? (multi ? sel.dataset.bi : '') + sel.value : ''));
  if (picks.length && chosen.some((c) => !c)) { toast(multi ? '질문마다 고른 안을 골라 주세요.' : '고른 안을 골라 주세요.'); return; }
  if (!picks.length && !result) { toast('결과 한 줄을 적어 주세요.'); return; }
  const choice = chosen.length ? chosen.join(' · ') : null;
  setState(id, { status: '정한 것', choice, result, via: '직접', decided_by: myName.slice(0, 30) }, `정한 것으로 넘겼어요${choice ? ' — ' + choiceLabel(d, choice) : ''}`);
}
function saveCode(id) {
  const d = DATA.find((x) => x.id === id);
  const code_status = document.querySelector(`select[data-code="${id}"]`).value;
  const code_ref = document.querySelector(`input[data-coderef="${id}"]`).value.trim();
  // upsert라 상태 칸도 같이 보냄(비면 새 줄로 못 넣음) — 이미 줄이 있으면 같은 상태라 바뀌지 않음
  const patch = states[id] ? { status: statusOf(d), code_status, code_ref } : { status: '정한 것', via: '문서', code_status, code_ref };
  setState(id, patch, `코드 라벨: ${code_status}${code_ref ? ' · ' + code_ref : ''}`);
}
document.addEventListener('click', (e) => {
  const t = e.target.closest && e.target.closest('[data-vote],[data-dopen],[data-dclose],[data-decide],[data-hold],[data-reopen],[data-codesave]');
  if (!t) return;
  const ds = t.dataset;
  if (ds.vote) { const [id, bi, key] = ds.vote.split('|'); castVote(id, +bi, key); return; }
  if (ds.dopen) { const f = document.querySelector(`[data-dform="${ds.dopen}"]`); f.hidden = false; const first = f.querySelector('select,input'); if (first) first.focus(); return; }
  if (ds.dclose) { document.querySelector(`[data-dform="${ds.dclose}"]`).hidden = true; return; }
  if (ds.decide) { decide(ds.decide); return; }
  if (ds.hold) { setState(ds.hold, { status: '보류', result: (drafts['r:' + ds.hold] || '').trim() }, '보류로 옮겼어요'); return; }
  if (ds.reopen) { if (confirm('다시 정할 것으로 돌릴까요? 이 안건의 표는 비워져요.')) setState(ds.reopen, { status: '정할 것', choice: null, result: '' }, '다시 정할 것으로 돌렸어요'); return; }
  if (ds.codesave) saveCode(ds.codesave);
});
document.addEventListener('input', (e) => { if (e.target.dataset && e.target.dataset.dresult) { drafts['r:' + e.target.dataset.dresult] = e.target.value; saveDrafts(); } });

// 화면으로 돌아오면 최신 의견 다시 받기 (폰 잠금 · 탭 전환 사이에 놓친 것)
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState !== 'visible' || !online) return;
  try { await fetchAll(); refreshAll(); } catch (err) { /* 그대로 */ }
});

let toastTimer;
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('on'), 2400); }

document.getElementById('foot').innerHTML = `<span>원본 <a href="${REPO}/blob/main/docs/decisions.md" target="_blank" rel="noopener">docs/decisions.md</a> · ${esc(BUILT)} 내용 · <a href="${PATHS.web}/board" target="_blank" rel="noopener">개발 보드 /board</a></span><span>의견 · 투표 · 정한 것은 같은 링크를 연 사람 모두에게 바로 보여요. 남긴 의견은 고치거나 지울 수 없고, 상태가 바뀔 때마다 의견 목록에 [정한 것] 같은 줄이 자동으로 남아요.</span>`;
document.querySelectorAll('.tabs button').forEach((b) => b.addEventListener('click', () => {
  filter = b.dataset.f;
  document.querySelectorAll('.tabs button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
  render();
}));
document.getElementById('q').addEventListener('input', render);
document.getElementById('toggleAll').addEventListener('click', (e) => {
  const all = [...document.querySelectorAll('details.d')];
  const open = all.some((d) => !d.open);
  all.forEach((d) => { d.open = open; });
  if (open) document.querySelectorAll('#out textarea').forEach(fit);
  e.target.textContent = open ? '모두 접기' : '모두 펼치기';
});
document.addEventListener('toggle', (e) => {
  if (!(e.target.matches && e.target.matches('details.d') && e.target.open)) return;
  e.target.querySelectorAll('textarea').forEach(fit);
  loadShot(e.target);
}, true);

document.getElementById('myName').value = myName;
document.getElementById('meetingCmt').innerHTML = cmtHtml('_meeting', '회의 전체 의견');
render();
connect();
const h = location.hash.slice(1);
if (/^D\d+$/.test(h)) { const el = document.getElementById(h); if (el) { el.open = true; el.scrollIntoView({ block: 'start' }); } }
</script>
</body>
