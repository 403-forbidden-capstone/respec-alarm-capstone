name: 데모 릴리즈

# v로 시작하는 태그를 달면 Releases에 데모 버전을 만듭니다.
#   git tag v0.1.0
#   git push origin v0.1.0
# - 릴리즈 노트: 머지된 PR을 라벨(FE · BE · DESIGN)별로 묶어 자동으로 씁니다 (.github/release.yml)
# - 앱(mobile/eas.json)과 Secret EXPO_TOKEN이 있으면 EAS로 APK를 빌드해 첨부하고 설치 QR을 붙입니다

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 릴리즈 태그 (예 v0.1.0). main 최신 커밋에 붙습니다
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}

jobs:
  release:
    name: 데모 릴리즈
    # 직접 실행은 main에서만
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 태그가 main에 있는 커밋인지 확인
        run: |
          git fetch -q origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::데모 릴리즈는 main에 들어간 커밋에만 만들 수 있어요. main에서 태그를 달아 주세요."
            exit 1
          fi

      - name: APK를 빌드할 수 있는지 확인
        id: app
        run: |
          if [ -f mobile/eas.json ] && [ -n "$EXPO_TOKEN" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "::notice::앱(mobile/eas.json)이나 EXPO_TOKEN이 없어 APK 없이 릴리즈만 만듭니다."
          fi

      - name: Node
        if: steps.app.outputs.build == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: EAS
        if: steps.app.outputs.build == 'true'
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: APK 빌드
        if: steps.app.outputs.build == 'true'
        working-directory: mobile
        # mobile/eas.json의 preview 프로필에 "android": { "buildType": "apk" }가 있어야 폰에 설치되는 APK가 나옵니다 (기본값은 AAB)
        run: |
          npm ci
          eas build --platform android --profile preview --non-interactive --wait --json > ../build.json
          APK_URL=$(jq -r '.[0].artifacts.buildUrl' ../build.json)
          # 파일 이름을 고정해 두면 releases/latest/download/respec-alarm.apk가 항상 최신 데모 APK를 가리킵니다 (레포 멤버용)
          curl -sSfL -o ../respec-alarm.apk "$APK_URL"
          echo "APK_URL=$APK_URL" >> "$GITHUB_ENV"

      - name: 릴리즈 만들기
        env:
          EVENT: ${{ github.event_name }}
        run: |
          NOTES=""
          if [ -n "${APK_URL:-}" ]; then
            QR="https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=$(jq -rn --arg u "$APK_URL" '$u|@uri')"
            NOTES=$(printf '## 폰에 설치\n\n<img src="%s" width="180" alt="APK 설치 QR" />\n\nQR을 찍으면 레포 권한 없이도 받을 수 있습니다. 레포 멤버는 아래 APK 파일을 받아도 됩니다.\n' "$QR")
          fi
          # 직접 실행했을 때만 태그가 아직 없으므로 main 최신 커밋에 새로 붙입니다
          TARGET=()
          if [ "$EVENT" = "workflow_dispatch" ]; then TARGET=(--target "$GITHUB_SHA"); fi
          gh release create "$TAG" \
            --title "Re:Spec Alarm $TAG" \
            "${TARGET[@]}" \
            --generate-notes \
            --notes "$NOTES" \
            $(ls respec-alarm.apk 2>/dev/null)
