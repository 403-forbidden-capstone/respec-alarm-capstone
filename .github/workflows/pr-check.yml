name: PR 체크

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-check:
    name: PR 체크
    runs-on: ubuntu-latest
    steps:
      - name: 제목 · 브랜치 · 이슈 연결 확인, 라벨 붙이기
        uses: actions/github-script@v8
        with:
          script: |
            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;
            const title = pr.title.trim();
            const branch = pr.head.ref;
            const body = pr.body ?? '';
            const isBot = pr.user.type === 'Bot';

            const PARTS = 'FE|BE|AI|DATA|DESIGN|ALL';
            const TYPES = 'FEAT|FIX|DOCS|REFACTOR|CHORE';
            const LABEL_PARTS = ['FE', 'BE', 'DESIGN'];

            // 1) 제목: [파트] [유형] 작업 내용  (앞에 [WIP], 유형 뒤 콜론 허용)
            const wip = /^\[WIP\]/i.test(title);
            const titleCore = title.replace(/^\[WIP\]\s*/i, '');
            const titleMatch = titleCore.match(new RegExp(`^\\[(${PARTS})\\] \\[(${TYPES})\\]:? \\S.*$`));

            // 2) 브랜치: 유형/이슈번호-파트-설명
            const branchOk = isBot || new RegExp(`^(feat|fix|docs|refactor|chore)/\\d+-(${PARTS})-[a-z0-9]+(-[a-z0-9]+)*$`).test(branch);

            // 3) 이슈 연결: Closes #12
            const linked = [...body.matchAll(/\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/gi)].map((m) => Number(m[1]));
            const linkOk = isBot || linked.length > 0;

            // 라벨: 제목의 파트 + 연결된 이슈의 파트 라벨(FE / BE / DESIGN)
            const labels = new Set();
            if (titleMatch && LABEL_PARTS.includes(titleMatch[1])) labels.add(titleMatch[1]);
            for (const number of linked) {
              try {
                const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number: number });
                for (const l of issue.labels) {
                  const name = typeof l === 'string' ? l : l.name;
                  if (LABEL_PARTS.includes(name)) labels.add(name);
                }
              } catch (e) {
                core.warning(`#${number} 이슈를 읽지 못했어요: ${e.message}`);
              }
            }
            if (labels.size) {
              await github.rest.issues.addLabels({ owner, repo, issue_number: pr.number, labels: [...labels] });
            }

            // 결과 댓글 — PR마다 하나만 두고 고칠 때마다 갱신
            const mark = (ok) => (ok === true ? '✅' : ok === 'warn' ? '⚠️' : '❌');
            const row = (ok, item, hint) => `| ${item} | ${mark(ok)} | ${ok === true ? '' : hint} |`;
            const lines = [
              '<!-- pr-check -->',
              '### 🤖 PR 체크',
              '',
              '| 항목 | 결과 | 고칠 점 |',
              '|---|:-:|---|',
              row(!!titleMatch, '제목 `[파트] [유형] 작업 내용`', '예) `[FE] [FEAT] 알람 목록 화면 구현` — 이 제목이 그대로 main의 커밋이 돼요'),
              row(branchOk ? true : 'warn', '브랜치 `유형/이슈번호-파트-설명`', `지금 \`${branch}\` → 예) \`feat/12-FE-alarm-list\` (다음 브랜치부터 지켜 주세요)`),
              row(linkOk ? true : 'warn', '이슈 연결 `Closes #번호`', '본문에 `Closes #이슈번호`를 적으면 머지할 때 이슈가 자동으로 닫혀요'),
            ];
            if (wip) lines.push('', '🚧 **WIP** — 리뷰받을 준비가 되면 제목에서 `[WIP]`를 빼 주세요.');
            if (labels.size) lines.push('', `🏷️ 붙인 라벨: ${[...labels].map((l) => `\`${l}\``).join(' ')}`);
            if (titleMatch && !wip) lines.push('', '👀 리뷰어를 지정하고 카톡방에 PR 링크를 공유해 주세요.');
            const text = lines.join('\n');

            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number: pr.number, per_page: 100 });
            const mine = comments.find((c) => c.user.type === 'Bot' && c.body.includes('<!-- pr-check -->'));
            if (mine) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body: text });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body: text });
            }

            if (!titleMatch) core.setFailed('PR 제목 형식이 맞지 않아요: [파트] [유형] 작업 내용');
            else if (wip) core.setFailed('WIP 상태예요. 준비되면 제목에서 [WIP]를 빼 주세요.');
