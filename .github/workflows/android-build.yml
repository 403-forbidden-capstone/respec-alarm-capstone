name: 안드로이드 빌드 검사

# 네이티브에 영향을 주는 파일이 바뀐 PR과 main push에서 Android 앱이 실제로 컴파일되는지 확인합니다.
#   앱 검사(ci.yml)는 타입 · 웹 빌드만 보므로 Kotlin 모듈 · 설정 플러그인 · 네이티브 패키지가 깨져도 잡지 못합니다.
#   expo prebuild로 android/ 폴더를 만들고 Gradle 디버그 빌드를 돕니다 (arm64 하나만, APK는 남기지 않음).
#   한 번에 10~15분 걸리고 Actions 무료 분량(월 2,000분)을 쓰므로 아래 paths에 해당할 때만 돕니다.
#   손으로 돌리려면 Actions → 안드로이드 빌드 검사 → Run workflow
#   Gradle 캐시는 main에서 돌 때만 저장되고 PR은 읽기만 합니다 (gradle/actions 기본 동작).

on:
  pull_request:
    paths:
      - 'mobile/app.json'
      - 'mobile/app.config.*'
      - 'mobile/assets/images/**'
      - 'mobile/package.json'
      - 'mobile/package-lock.json'
      - 'mobile/modules/**'
      - 'mobile/plugins/**'
      - 'mobile/android/**'
      - '.github/workflows/android-build.yml'
  push:
    branches: [main]
    paths:
      - 'mobile/app.json'
      - 'mobile/app.config.*'
      - 'mobile/assets/images/**'
      - 'mobile/package.json'
      - 'mobile/package-lock.json'
      - 'mobile/modules/**'
      - 'mobile/plugins/**'
      - 'mobile/android/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}  # main 실행은 취소하지 않음 (Gradle 캐시 저장)

jobs:
  build:
    name: Android 컴파일
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_NO_TELEMETRY: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: 패키지 설치
        run: npm ci

      - name: 네이티브 프로젝트 생성
        run: npx expo prebuild --platform android --no-install

      - name: Gradle 디버그 빌드
        working-directory: mobile/android
        run: ./gradlew :app:assembleDebug -PreactNativeArchitectures=arm64-v8a
