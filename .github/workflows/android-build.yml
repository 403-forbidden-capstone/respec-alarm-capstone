name: 안드로이드 빌드 검사

# Android 앱이 실제로 컴파일되는지 확인합니다. 손으로만 돌립니다: Actions → 안드로이드 빌드 검사 → Run workflow → 브랜치 선택
#   앱 검사(ci.yml)는 타입 · 린트 · 테스트 · 웹 빌드만 보므로 Kotlin 모듈 · 설정 플러그인 · 네이티브 패키지가 깨져도 잡지 못합니다.
#   app.json · package.json · modules/ · plugins/ 를 바꾼 PR은 머지 전에 그 브랜치로 한 번 돌립니다.
#   expo prebuild로 android/ 폴더를 만들고 Gradle 디버그 빌드를 돕니다 (arm64 하나만).
#   만든 APK는 개발용 APK로 3일 남깁니다. 실행 요약의 링크로 받으면 EAS 무료 횟수(월 15회)를 안 씁니다.
#   한 번에 10~15분 걸려 Actions 무료 분량(월 2,000분)을 가장 많이 써서 PR · main push 자동 실행은 뺐습니다 (#134).
#   Gradle 캐시는 main에서 돌 때만 저장되고 다른 브랜치는 읽기만 합니다 (gradle/actions 기본 동작).

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}  # main 실행은 취소하지 않음 (Gradle 캐시 저장)

jobs:
  build:
    name: Android 컴파일
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_NO_TELEMETRY: '1'
    steps:
      # 기본 러너 디스크로는 Gradle 네이티브 빌드 중 꽉 참(No space left on device, #15) → 안 쓰는 도구를 지움 (Android SDK는 남김)
      #   체크아웃 전이라 mobile/ 폴더가 없어서 맨 위에서 돌림
      - name: 디스크 비우기
        working-directory: .
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /usr/local/share/powershell /usr/share/swift /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -h /

      - name: Checkout
        uses: actions/checkout@v7

      - name: Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: 패키지 설치
        run: npm ci

      - name: 네이티브 프로젝트 생성
        run: npx expo prebuild --platform android --no-install

      - name: Gradle 디버그 빌드
        working-directory: mobile/android
        run: |
          ./gradlew :app:assembleDebug -PreactNativeArchitectures=arm64-v8a
          cp app/build/outputs/apk/debug/app-debug.apk ../respec-alarm-dev.apk

      - name: 개발용 APK 남기기
        id: apk
        # 비공개 레포의 Actions 저장 용량(무료 조직 500MB)이 차면 업로드만 실패함. 컴파일 검사와는 떼어 둠
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          path: mobile/respec-alarm-dev.apk
          archive: false
          retention-days: 3
          if-no-files-found: error

      - name: 받는 법 안내
        env:
          APK_URL: ${{ steps.apk.outputs.artifact-url }}
        run: |
          {
            echo "### 개발용 APK"
            echo ""
            if [ -n "$APK_URL" ]; then
              echo "[respec-alarm-dev.apk 받기]($APK_URL) (3일 보관)"
            else
              echo "APK 업로드가 실패했습니다(저장 용량 부족일 수 있음). 컴파일은 통과했고, 오래된 실행의 아티팩트를 지우면 다시 올라갑니다."
            fi
            echo ""
            echo "- 폰에 설치한 뒤 PC에서 npx expo start로 연결해 씁니다. EAS 개발용 APK와 쓰는 법이 같습니다."
            echo "- EAS로 받은 앱과 서명이 달라서 처음 한 번은 앱을 지우고 설치합니다."
          } >> "$GITHUB_STEP_SUMMARY"
