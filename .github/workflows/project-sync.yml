name: 보드 연동

# 이슈 · 브랜치 · PR 이벤트를 조직 보드(Re:Spec Alarm 보드)에 반영합니다.
#   이슈 작성          → 보드 등록 · 백로그, 이슈 틀의 파트 · 우선순위 · 크기 · 시작일 · 목표일 · 주차
#   브랜치 생성        → 브랜치 이름의 이슈가 진행 중, 빈 시작일은 오늘, 담당자가 없으면 만든 사람
#   PR 생성            → 연결된 이슈(Closes #번호)가 리뷰, 이슈의 파트 라벨을 PR에, 빈 담당자는 PR 작성자(초안 포함)
#                        닫는 이슈가 없으면 PR 자체가 카드(리뷰, 초안이면 진행 중) + 브랜치 이름의 이슈 번호를 본문에 '관련 이슈 #번호'로
#   PR 머지 · 이슈 닫힘 → 완료, 주차는 끝낸 주 (Not planned · Duplicate 이슈와 머지 없이 닫힌 PR 카드는 보관)
# PR 본문 · 제목 수정(edited)은 Actions 분량 때문에 안 받음 (#134). Closes #번호는 PR을 만들 때 적습니다.
# 필요한 것: 레포 Secret PROJECT_TOKEN (repo · project 권한)
# PR 본문은 GITHUB_TOKEN으로 고침 — 이 토큰으로 고친 건 다른 워크플로(edited)를 새로 돌리지 않음

on:
  issues:
    types: [opened, closed, reopened]
  create:
  pull_request:
    types: [opened, reopened, ready_for_review, closed]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: board-sync-${{ github.event.issue.number || github.event.pull_request.number || github.event.ref }}
  cancel-in-progress: false

jobs:
  sync:
    name: 보드 연동
    if: github.event_name != 'create' || github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    env:
      PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
      PR_TOKEN: ${{ github.token }}
    steps:
      - name: 토큰 확인
        if: env.PROJECT_TOKEN == ''
        run: echo "::notice::PROJECT_TOKEN 시크릿이 없어 보드 연동을 건너뜁니다."

      - name: 스크립트 가져오기
        if: env.PROJECT_TOKEN != ''
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts

      - name: 보드에 반영
        if: env.PROJECT_TOKEN != ''
        uses: actions/github-script@v9
        with:
          github-token: ${{ env.PROJECT_TOKEN }}
          script: |
            const sync = require('./.github/scripts/project-sync.js');
            const prClient = getOctokit(process.env.PR_TOKEN);
            try {
              await sync({ github, context, core, prClient });
            } catch (error) {
              if (/not accessible|Bad credentials|scope/i.test(error.message)) {
                core.setFailed(`PROJECT_TOKEN 권한이 부족해요. classic 토큰이면 repo · project 권한이 있어야 해요. (${error.message})`);
              } else {
                throw error;
              }
            }
