name: DB 검사 · 적용

# DB 구조는 supabase/migrations의 새 파일로만 바꾸고, 실제 프로젝트에는 이 워크플로가 넣습니다 (터미널 db push 안 함).
#   PR     검사 잡 하나에서 차례로 (잡이 둘이면 잡마다 분 올림이 붙어 Actions 분량이 두 배 가까이 됨, #514)
#            마이그레이션 · RLS 검사: PGlite(WASM Postgres)에 Supabase 흉내를 만들고 적용 → RLS · 권한 · 함수 동작 확인
#            실제 이미지 적용 · 타입: 실제 Supabase Postgres(supabase db start)에 처음부터 적용
#            이미 있는 마이그레이션을 고쳤거나 새 파일 이름이 앞서면 실패 · 앱 타입이 스키마와 다르면 실패
#          초안 PR에서는 안 돌고, 초안을 풀 때(ready_for_review) 돎
#   main   PR에서 검사를 통과한 것만 머지되므로 검사 없이 실제 프로젝트에 supabase db push
#          손으로 돌리면(workflow_dispatch) 검사 뒤 main일 때만 적용
#   비밀값 SUPABASE_ACCESS_TOKEN 하나 (supabase/README.md)

on:
  # 서버 함수(supabase/functions)와 데모 시드(supabase/seed)만 바꾼 PR · push에는 안 돎 — DB 구조와 상관없고 Actions 분량이 아까워서
  # (그 검사는 node --test로 로컬에서: supabase/README.md "시험")
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'supabase/**'
      - '!supabase/functions/**'
      - '!supabase/seed/**'
      - 'mobile/src/types/database.ts'
      - '.github/workflows/db-check.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - '!supabase/functions/**'
      - '!supabase/seed/**'
      - '.github/workflows/db-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-check-${{ github.event.pull_request.number || github.ref }}
  # main은 적용 중에 끊지 않음
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SUPABASE_CLI_VERSION: 2.119.0
  PROJECT_REF: gomrhctwjvttoqifxktt

jobs:
  verify:
    name: 마이그레이션 · RLS 검사 · 실제 이미지 적용
    # main push는 검사 없이 적용만, 초안 PR은 건너뜀 (workflow_dispatch는 pull_request가 비어 있어 돎)
    if: github.event_name != 'push' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: supabase/tests/package-lock.json

      - name: 패키지 설치
        working-directory: supabase/tests
        run: npm ci

      - name: 마이그레이션 · RLS 검사
        working-directory: supabase/tests
        run: npm test

      - name: 마이그레이션 파일 규칙
        if: github.event_name == 'pull_request'
        run: |
          base=$(git rev-parse HEAD^1)
          # 받는 브랜치에 이미 있는 파일은 실제 DB에 들어갔을 수 있어서 고쳐도 다시 적용되지 않음
          touched=$(git diff --name-status --no-renames "$base" HEAD -- supabase/migrations | awk '$1 != "A" { print $2 }')
          if [ -n "$touched" ]; then
            echo "::error::이미 있는 마이그레이션을 고쳤어요. 바꿀 내용은 새 파일로 올려요: $(echo $touched)"
            exit 1
          fi
          # 실제 DB는 이름(시각) 순서로 쌓여서 새 파일이 기존 것보다 앞이면 적용이 막힘
          last=$(git ls-tree --name-only "$base" supabase/migrations/ | sed -n 's#^supabase/migrations/\(.*\.sql\)$#\1#p' | sort | tail -n 1)
          for f in $(git diff --name-only --diff-filter=A "$base" HEAD -- 'supabase/migrations/*.sql'); do
            f=${f##*/}
            if [ -n "$last" ] && [[ "$f" < "$last" ]]; then
              echo "::error::$f 이름이 이미 있는 $last 보다 앞이에요. npx supabase migration new 로 지금 시각 이름을 받아 옮겨요"
              exit 1
            fi
          done
          echo "통과 (기준 마지막 파일: ${last:-없음})"

      - name: Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: 임시 DB에 적용
        run: supabase db start

      - name: 앱 타입 확인
        id: types
        if: github.event_name == 'pull_request'
        run: |
          supabase gen types --lang typescript --local --schema public > "$RUNNER_TEMP/database.ts"
          if cmp -s "$RUNNER_TEMP/database.ts" mobile/src/types/database.ts; then
            echo "mobile/src/types/database.ts가 스키마와 같음"
            exit 0
          fi
          echo "::error file=mobile/src/types/database.ts::앱 타입이 스키마와 달라요. 이 실행의 database-types 파일로 바꿔요"
          diff -u mobile/src/types/database.ts "$RUNNER_TEMP/database.ts" | head -n 200 || true
          exit 1

      - name: 새 앱 타입 올리기
        if: failure() && steps.types.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: database-types
          path: ${{ runner.temp }}/database.ts
          retention-days: 3

  preview_remote:
    name: PR #479 원격 DB 적용 목록만 확인
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 479 && github.event.pull_request.head.repo.full_name == github.repository
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: 배포 자격 증명 존재 확인
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::SUPABASE_ACCESS_TOKEN이 설정되지 않았어요"; exit 1; }

      - name: Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: 프로젝트 연결
        run: supabase link --project-ref "$PROJECT_REF"

      - name: 미적용 7개 목록 확인 (절대 적용하지 않음)
        run: |
          set -euo pipefail
          supabase db push --linked --include-all --dry-run 2>&1 | tee "$RUNNER_TEMP/db-plan.txt"
          for f in \
            20261109090000_friend_explore_fixes.sql \
            20261110100000_prepare_ml_verified_profiles.sql \
            20261110110000_prepare_ml_optional_survey.sql \
            20261110120000_prepare_ml_reset_cleanup.sql \
            20261110130000_prepare_ml_age_only.sql \
            20261110220000_prepare_ml_consented_age_sync.sql \
            20261110224500_prepare_ml_consent_safety.sql
          do
            grep -Fq "$f" "$RUNNER_TEMP/db-plan.txt" || { echo "::error::사전 검사에 $f 미표시"; exit 1; }
          done
          echo "계획한 7개 파일 모두 출력됨. 데이터베이스 변경 없음."

  deploy:
    name: 실제 DB에 적용
    needs: [verify]
    # push에서는 verify가 건너뛰어져도(skipped) 돌아야 해서 !cancelled()로 받고, 손으로 돌린 검사가 실패하면 막음
    if: ${{ !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.verify.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: db-deploy
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      # 없으면 CLI가 토큰으로 임시 로그인 역할을 만들어 접속함
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: 비밀값 확인
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::저장소 비밀값 SUPABASE_ACCESS_TOKEN이 없어요. supabase/README.md대로 넣고 이 실행을 다시 돌려요"
            exit 1
          fi

      - name: Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: 프로젝트 연결
        run: supabase link --project-ref "$PROJECT_REF"

      - name: 적용 대상 정확히 7개 재확인 후 배포
        run: |
          set -euo pipefail
          # 이미 운영에서 적용한 버전, 새로 추가된 버전, 예상 밖 파일이 하나라도 있으면 중단.
          supabase db push --include-all --dry-run 2>&1 | tee "$RUNNER_TEMP/remote-db-plan.txt"
          sed -nE 's/^[[:space:]]*•[[:space:]]*([0-9]{14}_[^[:space:]]+\.sql).*$/\1/p' "$RUNNER_TEMP/remote-db-plan.txt" > "$RUNNER_TEMP/actual.txt"
          cat > "$RUNNER_TEMP/expected.txt" <<'EXPECTED'
          20261109090000_friend_explore_fixes.sql
          20261110100000_prepare_ml_verified_profiles.sql
          20261110110000_prepare_ml_optional_survey.sql
          20261110120000_prepare_ml_reset_cleanup.sql
          20261110130000_prepare_ml_age_only.sql
          20261110220000_prepare_ml_consented_age_sync.sql
          20261110224500_prepare_ml_consent_safety.sql
          EXPECTED
          if grep -Fxq '20261109090000_friend_explore_fixes.sql' "$RUNNER_TEMP/actual.txt"; then
            diff -u "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/actual.txt" || {
              echo "::error::원격 DB 대상 파일이 사전 검증과 다릅니다. 자동 배포 중단."
              exit 1
            }
            echo "7개 누락 파일 일치. 이번 한 번만 오래된 마이그레이션을 포함해 적용."
            supabase db push --include-all --yes
          else
            echo "과거 누락 파일이 이미 적용된 상태. 기존 표준 배포 동작 사용."
            supabase db push --yes
          fi
