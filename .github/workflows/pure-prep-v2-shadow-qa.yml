name: CatBoost v2 Shadow · 10 history QA
on:
  push:
    branches: [main, test/pure-prep-android-scheduling-20261124]
    paths:
      - '.github/workflows/pure-prep-v2-shadow-qa.yml'
      - 'supabase/functions/_shared/pure-prep-shadow*'
      - 'supabase/functions/alarm-suggest/index.ts'
      - 'tools/prepare-adjust-sidecar/**'
      - 'docs/pure-prep-v2-shadow-10hist.md'
      - 'supabase/functions/_shared/calc/pure-prep-basis*'
      - 'supabase/functions/_shared/plan.ts'
      - 'supabase/functions/_shared/plan.test.ts'
      - 'supabase/functions/_shared/plan-core.ts'
      - 'supabase/migrations/*pure_prep*'
      - 'mobile/src/app/settings.tsx'
      - 'mobile/src/app/alarm/[id].tsx'
      - 'mobile/src/lib/alarmSync/__tests__/sync.test.ts'
      - 'mobile/src/features/onboarding/views/PrepareStep.tsx'
      - 'mobile/src/app/onboarding.tsx'
      - 'mobile/src/features/profile/edit.ts'
      - 'mobile/src/features/profile/components/ProfileEditors.tsx'
      - 'mobile/src/features/profile/__tests__/edit.test.ts'
      - 'mobile/src/features/alarm/realPlan.ts'
      - 'mobile/src/features/alarm/types.ts'
      - 'mobile/src/features/social/components/GroupJoinSheet.tsx'
  pull_request:
    paths:
      - '.github/workflows/pure-prep-v2-shadow-qa.yml'
      - 'supabase/functions/_shared/pure-prep-shadow*'
      - 'supabase/functions/_shared/calc/pure-prep-basis*'
      - 'supabase/functions/_shared/plan.ts'
      - 'supabase/functions/_shared/plan.test.ts'
      - 'supabase/functions/_shared/plan-core.ts'
      - 'supabase/migrations/*pure_prep*'
      - 'mobile/src/app/settings.tsx'
      - 'mobile/src/app/alarm/[id].tsx'
      - 'mobile/src/lib/alarmSync/__tests__/sync.test.ts'
      - 'mobile/src/features/onboarding/views/PrepareStep.tsx'
      - 'mobile/src/app/onboarding.tsx'
      - 'mobile/src/features/profile/edit.ts'
      - 'mobile/src/features/profile/components/ProfileEditors.tsx'
      - 'mobile/src/features/profile/__tests__/edit.test.ts'
      - 'mobile/src/features/alarm/realPlan.ts'
      - 'mobile/src/features/alarm/types.ts'
      - 'mobile/src/features/social/components/GroupJoinSheet.tsx'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck mobile application
        run: npm run typecheck
      - name: Run onboarding, profile and alarm regression tests
        run: npm test -- --runInBand --ci --watch=false src/features/profile/__tests__/edit.test.ts src/features/profile/__tests__/api.test.ts src/features/alarm/__tests__/real.test.ts src/features/alarm/__tests__/request.test.ts src/features/alarm/__tests__/shared.test.ts src/lib/alarmSync/__tests__/sync.test.ts src/lib/alarmSync/__tests__/reconcile.test.ts
  shadow-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fail-closed 9/10-history shadow and existing pure prep regression tests
        run: |
          node --experimental-strip-types --test \
            supabase/functions/_shared/pure-prep-shadow.test.ts \
            supabase/functions/_shared/pure-prep-shadow.synthetic.test.ts \
            supabase/functions/_shared/calc/pure-prep-basis.test.ts \
            supabase/functions/_shared/calc/pure-prep.test.ts \
            supabase/functions/_shared/plan-core.test.ts \
            supabase/functions/_shared/plan.test.ts
  edge-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Typecheck deployed alarm-suggest Edge entrypoint and dependencies
        run: deno check --node-modules-dir=auto supabase/functions/alarm-suggest/index.ts
  trainer-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research trainer dependencies
        run: pip install 'catboost>=1.2,<2' 'pandas>=2,<3' 'numpy>=1.26,<3'
      - name: Validate 10-prior→11th training example, 9-prior rejection
        run: |
          python - <<'PY'
          import csv, importlib.util, tempfile
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          root=Path.cwd()
          def mod(name,path):
              spec=importlib.util.spec_from_file_location(name,root/path)
              out=importlib.util.module_from_spec(spec);spec.loader.exec_module(out);return out
          train=mod('training','tools/prepare-adjust-sidecar/train.py')
          serve=mod('server','tools/prepare-adjust-sidecar/server.py')
          cols=['user_id','prepare_started_at','departed_at','prepare_started_source','departed_source','weekday_code','평토일구분코드','휴일종류코드','연령코드']
          def records(n):
              for i in range(n):
                  d=datetime(2026,11,1,tzinfo=timezone.utc)+timedelta(days=i)
                  yield dict(user_id='fictional-account',prepare_started_at=(d-timedelta(minutes=20+i)).isoformat(),
                             departed_at=d.isoformat(),prepare_started_source='PREPARE_ALARM',departed_source='LOCATION',
                             weekday_code='1',평토일구분코드='1',휴일종류코드='__MISSING__',연령코드='2')
          with tempfile.TemporaryDirectory() as folder:
              path=Path(folder)/'sessions.csv'
              for n in (10,11):
                  with path.open('w',newline='') as f:
                      writer=csv.DictWriter(f,fieldnames=cols);writer.writeheader();writer.writerows(records(n))
                  if n==10:
                      try:
                          train.build_samples(path)
                          raise AssertionError('unexpected training sample with only 10 total completed records')
                      except ValueError as e:
                          assert '>=11' in str(e),str(e)
                  else:
                      data=train.build_samples(path)
                      assert len(data)==1
                      assert data.iloc[0]['history_count']==10
                      # A nine-minute observation is valid as a manual input but
                      # not as an automatically learned historical interval.
                      altered=list(records(11))
                      altered[0]['prepare_started_at']=(datetime(2026,11,1,tzinfo=timezone.utc)-timedelta(minutes=9)).isoformat()
                      with path.open('w',newline='') as f:
                          w=csv.DictWriter(f,fieldnames=cols);w.writeheader();w.writerows(altered)
                      try:
                          train.build_samples(path)
                          raise AssertionError('nine-minute session must not reach ten valid training histories')
                      except ValueError as e:
                          assert '>=11' in str(e),str(e)
          body={'model':'prep_start_ratio_v2','baseline_definition':serve.BASELINE_DEFINITION,'history_count':9,
                'features':{'weekday_code':'1','평토일구분코드':'1','휴일종류코드':'__MISSING__','연령코드':'2','baseline_observed':25}}
          class FakeModel:
              def predict(self, data):
                  return [0.]
          try:
              serve.predict(FakeModel(),body,'survey_start_cluster_proxy')
              raise AssertionError('nine records were accepted')
          except ValueError as e:
              assert 'insufficient history' in str(e)
          body['history_count']=10
          result=serve.predict(FakeModel(),body,'survey_start_cluster_proxy')
          assert result['model']=='prep_start_ratio_v2' and result['minutes']==25
          proxy=serve.predict(FakeModel(),body,'alarm_dismiss_location_proxy')
          assert proxy['training_target']=='alarm_dismiss_location_proxy'
          assert proxy['baseline_definition']==train.BASELINE_DEFINITION
          try:
              serve.predict(FakeModel(),{**body,'baseline_definition':'previous_day_survey_diary'},'alarm_dismiss_location_proxy')
              raise AssertionError('old baseline was accepted')
          except ValueError as e:
              assert 'baseline definition' in str(e)
          print('10-record model gate and causal training boundary: PASS')
          PY

  synthetic-retraining:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CatBoost training dependencies
        run: pip install 'catboost>=1.2,<2' 'pandas>=2,<3' 'numpy>=1.26,<3'
      - name: End-to-end synthetic user-split retraining and model manifest compatibility
        run: python tools/prepare-adjust-sidecar/synthetic_protocol_test.py
