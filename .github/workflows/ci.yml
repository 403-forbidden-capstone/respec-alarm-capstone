name: 앱 검사

# mobile/이 바뀐 PR과 main push에서 앱이 깨지지 않았는지 확인합니다.
#   타입 검사: tsc --noEmit
#   웹 빌드: expo export --platform web. 웹 데모가 만들어지는지 보고,
#            폰 전용 기능을 웹에서 그대로 부르면 여기서 깨집니다.

on:
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/ci.yml'
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 타입 검사 · 웹 빌드
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: 패키지 설치
        run: npm ci

      - name: 타입 검사
        run: npx tsc --noEmit

      - name: 웹 빌드
        run: npx expo export --platform web --output-dir dist
