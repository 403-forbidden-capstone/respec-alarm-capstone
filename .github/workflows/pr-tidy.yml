name: PR 정리

# PR이 열리거나 바뀌면 자동으로
#   - 파트 라벨: 바뀐 폴더(mobile/ → FE, supabase/ → BE)와 연결된 이슈(Closes #번호)의 라벨
#   - 크기 라벨: 잠금 파일을 뺀 바뀐 줄 수. size: S(100줄 이하) · M(400줄 이하) · L
#   - 담당자: 비어 있으면 PR 작성자
# 폴더 구조가 정해지면 아래 PATH_LABELS를 고칩니다.

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: pr-tidy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  tidy:
    name: PR 정리
    # Dependabot PR은 토큰이 읽기 전용이라 건너뜁니다. 라벨은 dependabot.yml이 붙입니다.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: 라벨 · 담당자 정리
        uses: actions/github-script@v9
        with:
          script: |
            const PATH_LABELS = [
              [/^mobile\//, 'FE'],
              [/^supabase\//, 'BE'],
            ];
            const PART_LABELS = ['FE', 'BE', 'DESIGN'];
            const SIZES = [[100, 'size: S'], [400, 'size: M'], [Infinity, 'size: L']];
            const IGNORE = /(^|\/)(package-lock\.json|yarn\.lock|pnpm-lock\.yaml)$|\.snap$/;

            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;
            const issue_number = pr.number;

            const files = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number: pr.number, per_page: 100 });

            const want = new Set();
            for (const file of files) {
              for (const [pattern, label] of PATH_LABELS) if (pattern.test(file.filename)) want.add(label);
            }

            const linked = [...(pr.body ?? '').matchAll(/\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/gi)].map((m) => Number(m[1]));
            for (const number of linked) {
              try {
                const { data } = await github.rest.issues.get({ owner, repo, issue_number: number });
                for (const l of data.labels) {
                  const name = typeof l === 'string' ? l : l.name;
                  if (PART_LABELS.includes(name)) want.add(name);
                }
              } catch {
                core.warning(`#${number} 이슈를 읽지 못했어요.`);
              }
            }

            const lines = files.filter((f) => !IGNORE.test(f.filename)).reduce((sum, f) => sum + f.additions + f.deletions, 0);
            const size = SIZES.find(([max]) => lines <= max)[1];

            const current = pr.labels.map((l) => l.name);
            for (const name of current.filter((n) => n.startsWith('size: ') && n !== size)) {
              await github.rest.issues.removeLabel({ owner, repo, issue_number, name });
            }
            const add = [...want, size].filter((name) => !current.includes(name));
            if (add.length) await github.rest.issues.addLabels({ owner, repo, issue_number, labels: add });

            if (!pr.assignees?.length && pr.user.type === 'User') {
              await github.rest.issues.addAssignees({ owner, repo, issue_number, assignees: [pr.user.login] });
            }

            core.info(`바뀐 줄 ${lines}줄 → ${size}, 붙인 라벨: ${add.join(', ') || '없음'}`);
