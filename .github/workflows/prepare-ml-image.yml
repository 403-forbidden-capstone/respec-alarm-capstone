name: prepare-ml 이미지 검증 및 GHCR 게시

on:
  pull_request:
    paths:
      - 'services/prepare-ml/**'
      - 'deploy/prepare-ml.compose.example.yml'
      - '.github/workflows/prepare-ml-image.yml'
      - 'scripts/smoke-prepare-ml-arm64.sh'
  push:
    branches: [main]
    paths:
      - 'services/prepare-ml/**'
      - '.github/workflows/prepare-ml-image.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-image:
    # Production EC2 is arm64. Validate on that architecture as well.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - name: Validate local ARM64 smoke script syntax
        run: bash -n scripts/smoke-prepare-ml-arm64.sh
      - name: Build without model artifacts (linux/arm64)
        run: |
          docker build --platform linux/arm64 -t respec-prepare-ml:ci services/prepare-ml
          test "$(docker image inspect -f '{{.Architecture}}' respec-prepare-ml:ci)" = arm64
      - name: Verify no .cbm file is bundled
        run: |
          docker run --rm --entrypoint sh respec-prepare-ml:ci -c \
            'test ! -f /app/models/v4_age_only/c1_mae.cbm && test ! -f /app/models/v4_age_only/w4_mae.cbm'
      - name: Validate empty image startup and readiness failure
        run: |
          docker run --rm -e CATBOOST_API_TOKEN=ci-only --entrypoint python respec-prepare-ml:ci \
            -c 'from fastapi import Response; import app; assert app.LOAD_ERRORS == {}; assert app.MODELS == {}; response=Response(); result=app.health(response); assert response.status_code == 503 and result["ok"] is False'

  publish:
    needs: docker-image
    # Never publish images from pull requests or non-main workflow_dispatch.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Build and push arm64 image to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY: ghcr.io/${{ github.repository_owner }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="sha-${GITHUB_SHA::7}"
          IMAGE="$REGISTRY/respec-prepare-ml:$TAG"

          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build --platform linux/arm64 \
            --label "org.opencontainers.image.source=$SOURCE" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t "$IMAGE" services/prepare-ml
          test "$(docker image inspect -f '{{.Architecture}}' "$IMAGE")" = arm64
          docker push "$IMAGE"

          echo "Published $IMAGE" >> "$GITHUB_STEP_SUMMARY"
