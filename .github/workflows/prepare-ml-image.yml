name: prepare-ml 이미지 검증

on:
  pull_request:
    paths:
      - 'services/prepare-ml/**'
      - 'deploy/prepare-ml.compose.example.yml'
      - '.github/workflows/prepare-ml-image.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build without model artifacts
        run: docker build -t respec-prepare-ml:ci services/prepare-ml
      - name: Verify no .cbm file is bundled
        run: |
          docker run --rm --entrypoint sh respec-prepare-ml:ci -c \
            'test ! -f /app/models/v4_age_only/c1_mae.cbm && test ! -f /app/models/v4_age_only/w4_mae.cbm'
      - name: Validate app imports using a dummy runtime token
        run: |
          docker run --rm -e CATBOOST_API_TOKEN=ci-only --entrypoint python respec-prepare-ml:ci \
            -c 'import app; assert app.LOAD_ERRORS == {}; assert app.MODELS == {}'
