name: 주간 요약

# 매주 월요일 오전 9시(한국 시간)에 지난주(월~일) 진행 상황을 "주간 요약" 이슈에 남깁니다.
#   본문 = 최신 주 요약으로 매주 갱신 (이슈를 열면 이번 주가 바로 보임)
#   댓글 = 지난 주 기록. <details>로 접혀 있어 한 줄(기간 · 숫자)만 보이고 누르면 펼쳐짐
# 완료한 이슈 · 머지된 PR · 새 이슈 · 리뷰 기다리는 PR · 7일 넘게 멈춘 이슈 · 마일스톤 진행률
# 직접 돌려 보려면 Actions → 주간 요약 → Run workflow (미리 보기를 켜면 이슈에 올리지 않고 실행 결과에만 보여 줌)

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 미리 보기 (이슈에 올리지 않음)
        type: boolean
        default: true

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  summary:
    name: 주간 요약
    runs-on: ubuntu-latest
    steps:
      - name: 지난주 정리
        uses: actions/github-script@v9
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        with:
          script: |
            const TITLE = '주간 요약';
            const DAY = 86400000;
            const KST = 9 * 3600000;
            const { owner, repo } = context.repo;
            const dryRun = process.env.DRY_RUN === 'true';

            // 지난주 월요일 0시 ~ 이번 주 월요일 0시 (한국 시간)
            const nowKst = new Date(Date.now() + KST);
            const fromMonday = (nowKst.getUTCDay() + 6) % 7;
            const thisMonday = Date.UTC(nowKst.getUTCFullYear(), nowKst.getUTCMonth(), nowKst.getUTCDate() - fromMonday) - KST;
            const start = thisMonday - 7 * DAY;
            const end = thisMonday;
            const mmdd = (t) => { const d = new Date(t + KST); return `${d.getUTCMonth() + 1}/${d.getUTCDate()}`; };
            const inWeek = (iso) => Boolean(iso) && Date.parse(iso) >= start && Date.parse(iso) < end;
            const daysAgo = (iso) => Math.floor((Date.now() - Date.parse(iso)) / DAY);

            const isPR = (i) => Boolean(i.pull_request);
            const notSummary = (i) => i.title !== TITLE;
            const touched = (await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'all', since: new Date(start).toISOString(), per_page: 100 })).filter(notSummary);
            const openIssues = (await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'open', per_page: 100 })).filter((i) => !isPR(i));
            const openPRs = (await github.paginate(github.rest.pulls.list, { owner, repo, state: 'open', per_page: 100 })).filter((p) => !p.draft);
            const milestones = await github.paginate(github.rest.issues.listMilestones, { owner, repo, state: 'open', sort: 'due_on', direction: 'asc', per_page: 100 });

            const done = touched.filter((i) => !isPR(i) && inWeek(i.closed_at) && (i.state_reason ?? 'completed') === 'completed');
            const merged = touched.filter((i) => isPR(i) && inWeek(i.pull_request.merged_at));
            const created = touched.filter((i) => !isPR(i) && inWeek(i.created_at));
            const stale = openIssues.filter(notSummary).filter((i) => daysAgo(i.updated_at) >= 7);

            const people = (i) => {
              const names = (i.assignees ?? []).map((a) => a.login);
              return names.length ? names.join(', ') : '담당 없음';
            };
            const item = (i) => `- #${i.number} ${i.title} · ${people(i)}`;
            const section = (title, list, format = item) => [`### ${title} (${list.length})`, '', ...(list.length ? list.map(format) : ['- 없음']), ''];

            const range = `${mmdd(start)} ~ ${mmdd(end - DAY)}`;
            const counts = `완료 ${done.length} · 머지 ${merged.length} · 새 이슈 ${created.length} · 리뷰 대기 ${openPRs.length} · 멈춤 ${stale.length}`;
            const details = [
              ...section('완료한 이슈', done),
              ...section('머지된 PR', merged, (p) => `- #${p.number} ${p.title} · ${p.user.login}`),
              ...section('새로 생긴 이슈', created),
              ...section('리뷰 기다리는 PR', openPRs, (p) => `- #${p.number} ${p.title} · ${p.user.login} · ${daysAgo(p.created_at)}일째`),
              ...section('7일 넘게 멈춘 이슈', stale, (i) => `- #${i.number} ${i.title} · ${people(i)} · ${daysAgo(i.updated_at)}일 전 마지막 변경`),
              '### 마일스톤',
              '',
              ...(milestones.length
                ? milestones.map((m) => {
                    const total = m.open_issues + m.closed_issues;
                    const due = m.due_on ? ` · 마감 ${mmdd(Date.parse(m.due_on))}` : '';
                    return `- ${m.title}: ${m.closed_issues}/${total} 완료${due}`;
                  })
                : ['- 없음']),
            ].join('\n');

            // 본문(최신 주): 전부 펼침 / 댓글(지난 주 기록): 한 줄만 보이고 누르면 펼쳐짐
            const text = [`## ${range}`, '', counts, '', details].join('\n');
            const comment = ['<details>', `<summary><b>${range}</b> · ${counts}</summary>`, '', details, '', '</details>'].join('\n');
            const notice = '매주 월요일 오전 9시에 지난주 진행 상황이 올라옵니다. 본문은 최신 주, 지난 주들은 아래 댓글에 접혀 있습니다. 이 이슈는 닫지 말아 주세요.';
            const body = [notice, '', '---', '', text].join('\n');

            await core.summary.addRaw(text).write();
            if (dryRun) {
              core.info(['[본문]', body, '', '[댓글]', comment].join('\n'));
              return core.info('미리 보기라 이슈에 올리지 않았어요.');
            }

            let target = openIssues.find((i) => i.title === TITLE);
            if (target) {
              await github.rest.issues.update({ owner, repo, issue_number: target.number, body });
            } else {
              ({ data: target } = await github.rest.issues.create({ owner, repo, title: TITLE, body }));
            }
            await github.rest.issues.createComment({ owner, repo, issue_number: target.number, body: comment });
            core.info(`#${target.number} 본문을 갱신하고 댓글을 남겼어요.`);
