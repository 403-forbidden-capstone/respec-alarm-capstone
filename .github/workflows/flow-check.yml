name: 흐름 확인

# `흐름 확인 필요` 라벨이 붙은 PR(기능 흐름 PR)의 "흐름 확인" 검사를 다시 계산합니다.
#   - 작업자가 PR 본문의 "흐름 · 판단 근거를 작업자가 직접 확인했어요"를 체크하면 통과, 아니면 대기
#   - 새 커밋이 올라오면 새 커밋에도 같은 검사를 붙임
#   - 라벨은 Claude 리뷰가 기능 흐름 PR로 판단할 때 붙음 (claude-review.yml · claude.yml). 라벨을 빼면 검사가 풀림
# 규칙: .claude/review-checklist.md "기능 흐름 PR"

on:
  pull_request:
    types: [edited, synchronize, reopened, labeled, unlabeled]

jobs:
  flow-check:
    # 검사 이름("흐름 확인")과 헷갈리지 않게 작업 이름은 따로 둠
    name: 흐름 확인 다시 계산
    if: contains(github.event.pull_request.labels.*.name, '흐름 확인 필요') || github.event.label.name == '흐름 확인 필요'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: flow-check-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    steps:
      - name: 흐름 확인 스크립트 (main)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts

      - name: 흐름 확인
        uses: actions/github-script@v9
        with:
          script: |
            const flowCheck = require('./.github/scripts/flow-check.js');
            await flowCheck({ github, context, core, mode: 'sync', prNumber: context.payload.pull_request.number });
