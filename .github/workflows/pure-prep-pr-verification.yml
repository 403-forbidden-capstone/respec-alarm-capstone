# Temporary one-off verification for PR #577. Remove before merging.
# The repository's regular app CI is manual to save Actions minutes.
name: Pure Prep PR 577 App Verification
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - '.github/workflows/pure-prep-pr-verification.yml'
      - 'mobile/**'
      - 'supabase/functions/**'
      - 'tools/golden/**'
permissions:
  contents: read
concurrency:
  group: pure-prep-577-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  verify:
    if: github.event.pull_request.number == 577
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci
      - name: TypeScript
        working-directory: mobile
        run: npm run typecheck
      - name: ESLint
        working-directory: mobile
        run: npm run lint
      - name: Full Jest
        working-directory: mobile
        run: npm test -- --ci --runInBand
      - name: Web bundle export
        working-directory: mobile
        run: npx expo export --platform web
      - name: Golden snapshots
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON tools/golden/golden.ts check
      - name: Pure preparation server tests
        run: |
          node --experimental-strip-types --test \
            supabase/functions/_shared/calc/pure-prep.test.ts \
            supabase/functions/_shared/calc/pure-prep-basis.test.ts \
            supabase/functions/_shared/plan-core.test.ts \
            supabase/functions/_shared/requests.test.ts
