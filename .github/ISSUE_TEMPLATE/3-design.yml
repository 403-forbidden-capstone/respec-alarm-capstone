name: 🎨 디자인 요청
description: 피그마 · UI · 화면 흐름 디자인을 요청할 때
type: Design
labels: ["DESIGN"]
projects: ["403-forbidden-capstone/1"]
body:
  - type: markdown
    attributes:
      value: |
        제목에는 화면과 요청을 짧게 적어 주세요. 예) `알람 울림 화면 — 출발 알림 버전`

  - type: textarea
    id: request
    attributes:
      label: 🖌️ 요청 내용
      description: 어떤 화면 · 부분을, 왜 디자인해야 하는지
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: 🎯 기대 결과
      description: 디자인이 적용되면 무엇이 좋아지는지

  - type: dropdown
    id: tab
    attributes:
      label: 🖼️ 화면 위치
      options:
        - 01 홈
        - 02 그룹
        - 03 AI
        - 04 일정 · 기록
        - 탭 밖 (울림 · 설정 등)
    validations:
      required: true

  - type: input
    id: figma
    attributes:
      label: 피그마 링크
      description: 프레임 선택 → 우클릭 → Copy link to selection
      placeholder: https://www.figma.com/design/...

  - type: textarea
    id: refs
    attributes:
      label: 📋 참고 자료
      description: 지금 화면 캡처, 참고할 앱 · 레퍼런스

  - type: textarea
    id: extra
    attributes:
      label: 💡 추가 요청 사항
      description: 색상 · 폰트 · 간격, 다크 모드, 빈 화면 · 로딩 · 에러 상태 등

  - type: markdown
    attributes:
      value: |
        ---
        ### 일정
        비워 둬도 돼요. 시작일이 없으면 PR(초안 포함)을 연 날이 자동으로 들어가요.

  - type: dropdown
    id: priority
    attributes:
      label: 우선순위
      options:
        - 🔴 높음
        - 🟡 보통
        - ⚪ 낮음
      default: 1

  - type: dropdown
    id: size
    attributes:
      label: 크기
      options:
        - S — 반나절 이하
        - M — 1~2일
        - L — 3일 이상 (쪼개기 권장)

  - type: input
    id: start
    attributes:
      label: 시작일
      placeholder: 2026-10-07 또는 10/7

  - type: input
    id: due
    attributes:
      label: 목표일
      placeholder: 2026-10-10 또는 10/10
